<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UUID 生成器 - 在线工具</title>
<meta name="description" content="在线 UUID v4 批量生成工具，支持带横线/不带横线/大写格式，纯前端实现，安全快速">
<meta name="keywords" content="UUID,UUID生成器,UUID v4,GUID,在线工具">
<meta property="og:title" content="UUID 生成器 - 在线工具">
<meta property="og:description" content="在线 UUID v4 批量生成工具，支持带横线/不带横线/大写格式，纯前端实现">
<meta property="og:type" content="website">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #f5f5f5;
  min-height: 100vh;
  padding: 20px;
}
.container {
  max-width: 900px;
  margin: 0 auto;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  padding: 30px;
}
.back-link {
  display: inline-block;
  margin-bottom: 20px;
  color: #49b1f5;
  text-decoration: none;
  font-size: 14px;
}
.back-link:hover { text-decoration: underline; }
h1 {
  font-size: 24px;
  margin-bottom: 20px;
  color: #333;
}
.option-group {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  margin-bottom: 20px;
  align-items: center;
}
.option-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  color: #666;
}
.option-item label { margin-bottom: 0; }
label {
  display: block;
  font-size: 14px;
  color: #666;
  margin-bottom: 8px;
}
input[type="number"] {
  width: 100px;
  padding: 8px 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
}
input[type="number"]:focus {
  outline: none;
  border-color: #49b1f5;
}
select {
  padding: 8px 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  background: #fff;
  cursor: pointer;
}
select:focus {
  outline: none;
  border-color: #49b1f5;
}
.btn-group {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
button {
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-primary {
  background: #49b1f5;
  color: #fff;
}
.btn-primary:hover { background: #3aa0e4; }
.btn-secondary {
  background: #f0f0f0;
  color: #333;
}
.btn-secondary:hover { background: #e0e0e0; }
.btn-success {
  background: #52c41a;
  color: #fff;
}
.btn-success:hover { background: #45b016; }
.btn-warning {
  background: #faad14;
  color: #fff;
}
.btn-warning:hover { background: #e89c0c; }
.btn-danger {
  background: #ff4d4f;
  color: #fff;
}
.btn-danger:hover { background: #e84143; }
.result-area {
  margin-top: 20px;
}
textarea {
  width: 100%;
  min-height: 240px;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 14px;
  font-family: Consolas, Monaco, monospace;
  resize: vertical;
  line-height: 1.6;
}
textarea:focus {
  outline: none;
  border-color: #49b1f5;
}
.msg {
  padding: 10px 16px;
  border-radius: 6px;
  margin-bottom: 12px;
  font-size: 14px;
  display: none;
}
.msg.error { background: #fff2f0; color: #ff4d4f; border: 1px solid #ffccc7; display: block; }
.msg.success { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; display: block; }
@media (max-width: 600px) {
  .container { padding: 20px; }
  .option-group { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>
<div class="container">
  <a href="/tools/" class="back-link">← 返回工具列表</a>
  <h1>UUID 生成器</h1>

  <div id="msg" class="msg"></div>

  <div class="option-group">
    <div class="option-item">
      <label for="count">生成数量：</label>
      <input type="number" id="count" value="1" min="1" max="100">
    </div>
    <div class="option-item">
      <label for="format">格式：</label>
      <select id="format">
        <option value="hyphen">带横线 (xxxxxxxx-xxxx-...)</option>
        <option value="no-hyphen">不带横线</option>
        <option value="upper">大写带横线</option>
        <option value="upper-no-hyphen">大写不带横线</option>
      </select>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn-primary" onclick="generate()">生成 UUID</button>
    <button class="btn-success" onclick="copyAll()">复制全部</button>
    <button class="btn-danger" onclick="clearAll()">清空</button>
  </div>

  <div class="result-area">
    <label>生成结果：</label>
    <textarea id="output" readonly placeholder="生成的 UUID 将显示在这里..."></textarea>
  </div>
</div>

<script>
function showMsg(text, type) {
  const msg = document.getElementById('msg');
  msg.textContent = text;
  msg.className = 'msg ' + type;
}
function hideMsg() {
  document.getElementById('msg').className = 'msg';
}

function uuidv4() {
  if (window.crypto && window.crypto.randomUUID) {
    return window.crypto.randomUUID();
  }
  // 手写实现
  if (window.crypto && window.crypto.getRandomValues) {
    const arr = new Uint8Array(16);
    window.crypto.getRandomValues(arr);
    arr[6] = (arr[6] & 0x0f) | 0x40;
    arr[8] = (arr[8] & 0x3f) | 0x80;
    const hex = [];
    for (let i = 0; i < 16; i++) hex.push(arr[i].toString(16).padStart(2, '0'));
    return hex[0]+hex[1]+hex[2]+hex[3]+'-'+hex[4]+hex[5]+'-'+hex[6]+hex[7]+'-'+hex[8]+hex[9]+'-'+hex[10]+hex[11]+hex[12]+hex[13]+hex[14]+hex[15];
  }
  // 回退方案 Math.random
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
    const r = Math.random() * 16 | 0;
    const v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

function formatUuid(uuid) {
  const format = document.getElementById('format').value;
  switch (format) {
    case 'no-hyphen':
      return uuid.replace(/-/g, '');
    case 'upper':
      return uuid.toUpperCase();
    case 'upper-no-hyphen':
      return uuid.replace(/-/g, '').toUpperCase();
    default:
      return uuid;
  }
}

function generate() {
  let count = parseInt(document.getElementById('count').value, 10);
  if (isNaN(count) || count < 1) count = 1;
  if (count > 100) count = 100;
  document.getElementById('count').value = count;

  const results = [];
  for (let i = 0; i < count; i++) {
    results.push(formatUuid(uuidv4()));
  }
  document.getElementById('output').value = results.join('\n');
  showMsg('成功生成 ' + count + ' 个 UUID', 'success');
}

function copyAll() {
  const val = document.getElementById('output').value;
  if (!val) { showMsg('没有可复制的内容', 'error'); return; }
  navigator.clipboard.writeText(val).then(() => {
    showMsg('已复制到剪贴板', 'success');
  }).catch(() => {
    const el = document.getElementById('output');
    el.select();
    document.execCommand('copy');
    showMsg('已复制到剪贴板', 'success');
  });
}

function clearAll() {
  document.getElementById('output').value = '';
  hideMsg();
}
</script>
</body>
</html>
