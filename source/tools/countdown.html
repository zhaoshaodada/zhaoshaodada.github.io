<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>倒计时工具 - 在线工具</title>
<meta name="description" content="在线倒计时工具，支持设置目标日期和时间，实时显示剩余天数、小时、分钟、秒数，纯前端实现">
<meta name="keywords" content="倒计时,倒计时工具,在线倒计时,目标日期,剩余时间">
<meta property="og:title" content="倒计时工具 - 在线工具">
<meta property="og:description" content="在线倒计时工具，支持设置目标日期和时间，实时显示剩余时间">
<meta property="og:type" content="website">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #f5f5f5;
  min-height: 100vh;
  padding: 20px;
}
.container {
  max-width: 600px;
  margin: 0 auto;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  padding: 30px;
}
.back-link {
  display: inline-block;
  margin-bottom: 20px;
  color: #49b1f5;
  text-decoration: none;
  font-size: 14px;
}
.back-link:hover { text-decoration: underline; }
h1 {
  font-size: 24px;
  margin-bottom: 8px;
  color: #333;
}
.subtitle { font-size: 13px; color: #999; margin-bottom: 20px; }
.textarea-group { margin-bottom: 16px; }
label {
  display: block;
  font-size: 14px;
  color: #666;
  margin-bottom: 8px;
}
input[type="datetime-local"], input[type="text"] {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 16px;
}
input[type="datetime-local"]:focus, input[type="text"]:focus {
  outline: none;
  border-color: #49b1f5;
}
.btn-group {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
button {
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-primary { background: #49b1f5; color: #fff; }
.btn-primary:hover { background: #3aa0e4; }
.btn-secondary { background: #f0f0f0; color: #333; }
.btn-secondary:hover { background: #e0e0e0; }
.btn-danger { background: #ff4d4f; color: #fff; }
.btn-danger:hover { background: #e84143; }
.msg {
  padding: 10px 16px;
  border-radius: 6px;
  margin-bottom: 12px;
  font-size: 14px;
  display: none;
}
.msg.error { background: #fff2f0; color: #ff4d4f; border: 1px solid #ffccc7; display: block; }
.msg.success { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; display: block; }
.countdown-card {
  text-align: center;
  padding: 30px;
  background: linear-gradient(135deg, #49b1f5 0%, #3aa0e4 100%);
  border-radius: 12px;
  color: #fff;
}
.countdown-title {
  font-size: 20px;
  margin-bottom: 20px;
  font-weight: 600;
}
.countdown-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
}
.countdown-item {
  background: rgba(255,255,255,0.2);
  border-radius: 8px;
  padding: 15px 10px;
}
.countdown-value {
  font-size: 36px;
  font-weight: 700;
  font-family: Consolas, Monaco, monospace;
}
.countdown-label {
  font-size: 12px;
  margin-top: 5px;
  opacity: 0.9;
}
.countdown-over {
  font-size: 28px;
  font-weight: 600;
}
.preset-buttons {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.preset-btn {
  padding: 8px 15px;
  font-size: 13px;
  background: #f5f5f5;
  color: #666;
}
.preset-btn:hover { background: #e8e8e8; }
@media (max-width: 500px) {
  .countdown-grid { grid-template-columns: repeat(2, 1fr); }
  .countdown-value { font-size: 28px; }
}
</style>
</head>
<body>
<div class="container">
  <a href="/tools/" class="back-link">← 返回工具列表</a>
  <h1>倒计时工具</h1>
  <p class="subtitle">设置目标日期，实时显示剩余时间</p>

  <div id="msg" class="msg"></div>

  <div class="textarea-group">
    <label>倒计时标题：</label>
    <input type="text" id="countdownTitle" placeholder="例如：新年倒计时">
  </div>

  <div class="textarea-group">
    <label>目标日期和时间：</label>
    <input type="datetime-local" id="targetDateTime">
  </div>

  <div class="preset-buttons">
    <button class="preset-btn" onclick="setPreset('next-year')">明年今日</button>
    <button class="preset-btn" onclick="setPreset('next-month')">下月今日</button>
    <button class="preset-btn" onclick="setPreset('next-week')">下周今日</button>
    <button class="preset-btn" onclick="setPreset('tomorrow')">明天此时</button>
    <button class="preset-btn" onclick="setPreset('hour')">一小时后</button>
  </div>

  <div class="btn-group">
    <button class="btn-primary" onclick="startCountdown()">开始倒计时</button>
    <button class="btn-danger" onclick="stopCountdown()">停止倒计时</button>
  </div>

  <div class="countdown-card" id="countdownCard" style="display:none;">
    <div class="countdown-title" id="displayTitle"></div>
    <div id="countdownContent">
      <div class="countdown-grid">
        <div class="countdown-item">
          <div class="countdown-value" id="days">00</div>
          <div class="countdown-label">天</div>
        </div>
        <div class="countdown-item">
          <div class="countdown-value" id="hours">00</div>
          <div class="countdown-label">时</div>
        </div>
        <div class="countdown-item">
          <div class="countdown-value" id="minutes">00</div>
          <div class="countdown-label">分</div>
        </div>
        <div class="countdown-item">
          <div class="countdown-value" id="seconds">00</div>
          <div class="countdown-label">秒</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let timerInterval = null;
let targetDate = null;

function showMsg(text, type) {
  const msg = document.getElementById('msg');
  msg.textContent = text;
  msg.className = 'msg ' + type;
}
function hideMsg() {
  document.getElementById('msg').className = 'msg';
}

function formatDateTime(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  const hours = String(date.getHours()).padStart(2, '0');
  const minutes = String(date.getMinutes()).padStart(2, '0');
  return `${year}-${month}-${day}T${hours}:${minutes}`;
}

function setPreset(type) {
  const now = new Date();
  let target = new Date(now);
  
  switch (type) {
    case 'next-year':
      target.setFullYear(target.getFullYear() + 1);
      break;
    case 'next-month':
      target.setMonth(target.getMonth() + 1);
      break;
    case 'next-week':
      target.setDate(target.getDate() + 7);
      break;
    case 'tomorrow':
      target.setDate(target.getDate() + 1);
      break;
    case 'hour':
      target.setHours(target.getHours() + 1);
      break;
  }
  
  document.getElementById('targetDateTime').value = formatDateTime(target);
  hideMsg();
}

function startCountdown() {
  const dateStr = document.getElementById('targetDateTime').value;
  const title = document.getElementById('countdownTitle').value || '倒计时';
  
  if (!dateStr) {
    showMsg('请选择目标日期和时间', 'error');
    return;
  }
  
  targetDate = new Date(dateStr);
  const now = new Date();
  
  if (targetDate <= now) {
    showMsg('目标时间必须大于当前时间', 'error');
    return;
  }
  
  stopCountdown();
  
  document.getElementById('displayTitle').textContent = title;
  document.getElementById('countdownCard').style.display = 'block';
  
  updateCountdown();
  timerInterval = setInterval(updateCountdown, 1000);
  
  showMsg('倒计时已开始', 'success');
}

function updateCountdown() {
  if (!targetDate) return;
  
  const now = new Date();
  const diff = targetDate.getTime() - now.getTime();
  
  if (diff <= 0) {
    stopCountdown();
    document.getElementById('countdownContent').innerHTML = '<div class="countdown-over">🎉 时间到！</div>';
    showMsg('倒计时结束', 'success');
    return;
  }
  
  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
  const seconds = Math.floor((diff % (1000 * 60)) / 1000);
  
  document.getElementById('days').textContent = String(days).padStart(2, '0');
  document.getElementById('hours').textContent = String(hours).padStart(2, '0');
  document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
  document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
}

function stopCountdown() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  document.getElementById('countdownCard').style.display = 'none';
  hideMsg();
}
</script>
</body>
</html>
