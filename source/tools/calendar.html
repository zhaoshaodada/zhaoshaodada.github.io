<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="万年历工具，查看公历农历对照、二十四节气、节假日，支持快速跳转年份月份。">
  <meta name="keywords" content="万年历,日历,农历,节气,节假日">
  <meta property="og:title" content="万年历工具">
  <meta property="og:description" content="查看公历农历对照、二十四节气">
  <title>万年历工具</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      padding: 30px;
      max-width: 600px;
      width: 100%;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 8px;
      font-size: 28px;
    }
    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 25px;
      font-size: 14px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .nav-btn {
      width: 40px;
      height: 40px;
      border: none;
      background: #f0f0f0;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .nav-btn:hover {
      background: #e0e0e0;
    }
    .current-date {
      font-size: 24px;
      font-weight: 600;
      color: #333;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }
    .weekday {
      text-align: center;
      padding: 10px;
      font-weight: 600;
      color: #666;
      font-size: 14px;
    }
    .day {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 16px;
    }
    .day:hover {
      background: #f0f0f0;
    }
    .day.other-month {
      color: #ccc;
    }
    .day.today {
      background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
      color: #fff;
      font-weight: 600;
    }
    .day.selected {
      background: #43e97b;
      color: #fff;
    }
    .day.lunar {
      font-size: 10px;
      color: #999;
      margin-top: 2px;
    }
    .day.today .lunar {
      color: rgba(255,255,255,0.8);
    }
    .day.selected .lunar {
      color: rgba(255,255,255,0.8);
    }
    .info-panel {
      margin-top: 25px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 10px;
    }
    .info-title {
      font-weight: 600;
      color: #333;
      margin-bottom: 15px;
      font-size: 16px;
    }
    .info-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }
    .info-item:last-child {
      border-bottom: none;
    }
    .info-label {
      color: #666;
    }
    .info-value {
      color: #333;
      font-weight: 500;
    }
    .holiday {
      color: #f44336;
    }
    .solar-term {
      color: #ff9800;
    }
    .tip {
      margin-top: 20px;
      padding: 15px;
      background: #e8f5e9;
      border-radius: 8px;
      border-left: 4px solid #43e97b;
      font-size: 14px;
      color: #2e7d32;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📅 万年历</h1>
    <p class="subtitle">公历农历对照，二十四节气，节假日查询</p>
    
    <div class="header">
      <button class="nav-btn" onclick="prevMonth()">‹</button>
      <div class="current-date" id="currentDate">2026年7月</div>
      <button class="nav-btn" onclick="nextMonth()">›</button>
    </div>
    
    <div class="calendar-grid">
      <div class="weekday">日</div>
      <div class="weekday">一</div>
      <div class="weekday">二</div>
      <div class="weekday">三</div>
      <div class="weekday">四</div>
      <div class="weekday">五</div>
      <div class="weekday">六</div>
    </div>
    
    <div class="calendar-grid" id="calendarDays"></div>
    
    <div class="info-panel">
      <div class="info-title">📋 日期详情</div>
      <div class="info-item">
        <span class="info-label">公历日期</span>
        <span class="info-value" id="solarDate">--</span>
      </div>
      <div class="info-item">
        <span class="info-label">农历日期</span>
        <span class="info-value" id="lunarDate">--</span>
      </div>
      <div class="info-item">
        <span class="info-label">星期</span>
        <span class="info-value" id="weekDay">--</span>
      </div>
      <div class="info-item">
        <span class="info-label">生肖</span>
        <span class="info-value" id="zodiac">--</span>
      </div>
      <div class="info-item">
        <span class="info-label">节气/节日</span>
        <span class="info-value" id="festival">--</span>
      </div>
    </div>
    
    <div class="tip">
      💡 提示：点击日期查看详情，支持月份切换。农历和节气数据基于通用算法，可能与实际日历有微小差异。
    </div>
  </div>

  <script>
    var currentDate = new Date();
    var selectedDate = new Date();
    
    var lunarMonths = ['正月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '冬月', '腊月'];
    var lunarDays = ['初一', '初二', '初三', '初四', '初五', '初六', '初七', '初八', '初九', '初十', '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十', '廿一', '廿二', '廿三', '廿四', '廿五', '廿六', '廿七', '廿八', '廿九', '三十'];
    var weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
    var zodiacs = ['鼠', '牛', '虎', '兔', '龙', '蛇', '马', '羊', '猴', '鸡', '狗', '猪'];
    var solarTerms = ['小寒', '大寒', '立春', '雨水', '惊蛰', '春分', '清明', '谷雨', '立夏', '小满', '芒种', '夏至', '小暑', '大暑', '立秋', '处暑', '白露', '秋分', '寒露', '霜降', '立冬', '小雪', '大雪', '冬至'];
    
    var holidays = {
      '01-01': '元旦',
      '02-14': '情人节',
      '03-08': '妇女节',
      '03-12': '植树节',
      '04-01': '愚人节',
      '05-01': '劳动节',
      '05-04': '青年节',
      '06-01': '儿童节',
      '07-01': '建党节',
      '08-01': '建军节',
      '09-10': '教师节',
      '10-01': '国庆节',
      '10-31': '万圣节',
      '12-25': '圣诞节'
    };
    
    function solarToLunar(year, month, day) {
      var lunarInfo = [0x04bd8, 0x04ae0, 0x0a570, 0x054d5, 0x0d260, 0x0d950, 0x16554, 0x056a0, 0x09ad0, 0x055d2, 0x04ae0, 0x0a5b6, 0x0a4d0, 0x0d250, 0x1d255, 0x0b540, 0x0d6a0, 0x0ada2, 0x095b0, 0x14977, 0x04970, 0x0a4b0, 0x0b4b5, 0x06a50, 0x06d40, 0x1ab54, 0x02b60, 0x09570, 0x052f2, 0x04970, 0x06566, 0x0d4a0, 0x0ea50, 0x06e95, 0x05ad0, 0x02b60, 0x186e3, 0x092e0, 0x1c8d7, 0x0c950, 0x0d4a0, 0x1d8a6, 0x0b550, 0x056a0, 0x1a5b4, 0x025d0, 0x092d0, 0x0d2b2, 0x0a950, 0x0b557, 0x06ca0, 0x0b550, 0x15355, 0x04da0, 0x0a5d0, 0x14573, 0x052d0, 0x0a9a8, 0x0e950, 0x06aa0, 0x0aea6, 0x0ab50, 0x04b60, 0x0aae4, 0x0a570, 0x05260, 0x0f263, 0x0d950, 0x05b57, 0x056a0, 0x096d0, 0x04dd5, 0x04ad0, 0x0a4d0, 0x0d4d4, 0x0d250, 0x0d558, 0x0b540, 0x0b5a0, 0x195a6, 0x095b0, 0x049b0, 0x0a974, 0x0a4b0, 0x0b27a, 0x06a50, 0x06d40, 0x0af46, 0x0ab60, 0x09570, 0x04af5, 0x04970, 0x064b0, 0x074a3, 0x0ea50, 0x06b58, 0x055c0, 0x0ab60, 0x096d5, 0x092e0, 0x0c960, 0x0d954, 0x0d4a0, 0x0da50, 0x07552, 0x056a0, 0x0abb7, 0x025d0, 0x092d0, 0x0cab5, 0x0a950, 0x0b4a0, 0x0baa4, 0x0ad50, 0x055d9, 0x04ba0, 0x0a5b0, 0x15176, 0x052b0, 0x0a930, 0x07954, 0x06aa0, 0x0ad50, 0x05b52, 0x04b60, 0x0a6e6, 0x0a4e0, 0x0d260, 0x0ea65, 0x0d530, 0x05aa0, 0x076a3, 0x096d0, 0x04bd7, 0x04ad0, 0x0a4d0, 0x1d0b6, 0x0d250, 0x0d520, 0x0dd45, 0x0b5a0, 0x056d0, 0x055b2, 0x049b0, 0x0a577, 0x0a4b0, 0x0aa50, 0x1b255, 0x06d20, 0x0ada0];
      
      var solarMonth = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
      var Gan = ["甲", "乙", "丙", "丁", "戊", "己", "庚", "辛", "壬", "癸"];
      var Zhi = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];
      
      var i, leap = 0, temp = 0;
      var baseYear = 1900;
      var baseMonth = 1;
      var baseDay = 31;
      
      if ((year < 1900) || (year > 2100)) return null;
      
      if (year == 1900 && month == 1 && day < 31) return null;
      
      var offset = (Date.UTC(year, month - 1, day) - Date.UTC(1900, 0, 31)) / 86400000;
      
      for (i = 1900; i < 2101 && offset > 0; i++) {
        temp = lYearDays(i);
        offset -= temp;
      }
      
      if (offset < 0) {
        offset += temp;
        i--;
      }
      
      var lunarYear = i;
      leap = leapMonth(i);
      var isLeap = false;
      
      for (i = 1; i < 13 && offset > 0; i++) {
        if (leap > 0 && i == (leap + 1) && isLeap == false) {
          --i;
          isLeap = true;
          temp = leapDays(lunarYear);
        } else {
          temp = monthDays(lunarYear, i);
        }
        if (isLeap == true && i == (leap + 1)) isLeap = false;
        offset -= temp;
      }
      
      if (offset == 0 && leap > 0 && i == leap + 1) {
        if (isLeap) {
          isLeap = false;
        } else {
          isLeap = true;
          --i;
        }
      }
      
      if (offset < 0) {
        offset += temp;
        --i;
      }
      
      var lunarMonth = i;
      var lunarDay = offset + 1;
      
      return { year: lunarYear, month: lunarMonth, day: lunarDay, isLeap: isLeap };
    }
    
    function lYearDays(y) {
      var i, sum = 348;
      for (i = 0x8000; i > 0x8; i >>= 1) {
        sum += (lunarInfo[y - 1900] & i) ? 1 : 0;
      }
      return (sum + leapDays(y));
    }
    
    function leapMonth(y) {
      return (lunarInfo[y - 1900] & 0xf);
    }
    
    function leapDays(y) {
      if (leapMonth(y)) {
        return ((lunarInfo[y - 1900] & 0x10000) ? 30 : 29);
      } else {
        return (0);
      }
    }
    
    function monthDays(y, m) {
      return ((lunarInfo[y - 1900] & (0x10000 >> m)) ? 30 : 29);
    }
    
    function getSolarTerm(year, month, day) {
      var termDays = [0, 21, 49, 79, 109, 139, 169, 199, 228, 258, 288, 318, 349];
      var dayOfYear = 0;
      var solarMonth = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
      
      if ((year % 4 == 0 && year % 100 != 0) || year % 400 == 0) {
        solarMonth[1] = 29;
      }
      
      for (var i = 0; i < month - 1; i++) {
        dayOfYear += solarMonth[i];
      }
      dayOfYear += day;
      
      for (var i = 0; i < 24; i++) {
        if (dayOfYear == termDays[i % 12] + Math.floor(i / 12) * 365) {
          return solarTerms[i];
        }
      }
      return '';
    }
    
    function renderCalendar() {
      var year = currentDate.getFullYear();
      var month = currentDate.getMonth();
      
      document.getElementById('currentDate').textContent = year + '年' + (month + 1) + '月';
      
      var firstDay = new Date(year, month, 1);
      var lastDay = new Date(year, month + 1, 0);
      var startDay = firstDay.getDay();
      var totalDays = lastDay.getDate();
      
      var prevMonthLastDay = new Date(year, month, 0).getDate();
      var nextMonthStartDay = 1;
      
      var html = '';
      
      for (var i = startDay - 1; i >= 0; i--) {
        var day = prevMonthLastDay - i;
        html += '<div class="day other-month">' + day + '</div>';
      }
      
      var today = new Date();
      
      for (var i = 1; i <= totalDays; i++) {
        var isToday = year === today.getFullYear() && month === today.getMonth() && i === today.getDate();
        var isSelected = year === selectedDate.getFullYear() && month === selectedDate.getMonth() && i === selectedDate.getDate();
        
        var lunar = solarToLunar(year, month + 1, i);
        var lunarStr = '';
        if (lunar) {
          var lunarMonthStr = lunarMonths[lunar.month - 1];
          if (lunar.isLeap) lunarMonthStr = '闰' + lunarMonthStr;
          lunarStr = lunarMonthStr + lunarDays[lunar.day - 1];
        }
        
        var className = 'day';
        if (isToday) className += ' today';
        if (isSelected) className += ' selected';
        
        html += '<div class="' + className + '" onclick="selectDate(' + year + ',' + month + ',' + i + ')">' + i + '<div class="day.lunar">' + lunarStr + '</div></div>';
      }
      
      var remainingCells = 42 - (startDay + totalDays);
      for (var i = 0; i < remainingCells; i++) {
        html += '<div class="day other-month">' + nextMonthStartDay++ + '</div>';
      }
      
      document.getElementById('calendarDays').innerHTML = html;
      
      selectDate(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate());
    }
    
    function selectDate(year, month, day) {
      selectedDate = new Date(year, month, day);
      renderCalendar();
      
      var lunar = solarToLunar(year, month + 1, day);
      var lunarStr = '';
      if (lunar) {
        var lunarMonthStr = lunarMonths[lunar.month - 1];
        if (lunar.isLeap) lunarMonthStr = '闰' + lunarMonthStr;
        lunarStr = lunarMonthStr + lunarDays[lunar.day - 1];
      }
      
      var weekDayStr = weekDays[selectedDate.getDay()];
      var zodiacStr = zodiacs[(year - 1900) % 12];
      
      var festivalStr = '';
      var dateKey = (month + 1).toString().padStart(2, '0') + '-' + day.toString().padStart(2, '0');
      if (holidays[dateKey]) {
        festivalStr = '<span class="holiday">' + holidays[dateKey] + '</span>';
      }
      
      var solarTerm = getSolarTerm(year, month + 1, day);
      if (solarTerm) {
        festivalStr += (festivalStr ? ' / ' : '') + '<span class="solar-term">' + solarTerm + '</span>';
      }
      
      if (!festivalStr) festivalStr = '--';
      
      document.getElementById('solarDate').textContent = year + '年' + (month + 1) + '月' + day + '日';
      document.getElementById('lunarDate').textContent = lunarStr || '--';
      document.getElementById('weekDay').textContent = weekDayStr;
      document.getElementById('zodiac').textContent = zodiacStr;
      document.getElementById('festival').innerHTML = festivalStr;
    }
    
    function prevMonth() {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    }
    
    function nextMonth() {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    }
    
    renderCalendar();
  </script>
</body>
</html>
