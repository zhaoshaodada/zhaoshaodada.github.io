<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>正则表达式测试 - 在线工具</title>
<meta name="description" content="在线正则表达式测试工具，支持实时高亮匹配、捕获组显示，内置邮箱/手机号/URL/IP/身份证常用正则，纯前端实现">
<meta name="keywords" content="正则表达式,正则测试,Regex,Regular Expression,在线正则,邮箱正则,手机号正则,URL正则,IP正则,身份证正则">
<meta property="og:title" content="正则表达式测试 - 在线工具">
<meta property="og:description" content="在线正则表达式测试工具，支持实时高亮匹配、捕获组显示，内置常用正则">
<meta property="og:type" content="website">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #f5f5f5;
  min-height: 100vh;
  padding: 20px;
}
.container {
  max-width: 900px;
  margin: 0 auto;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  padding: 30px;
}
.back-link {
  display: inline-block;
  margin-bottom: 20px;
  color: #49b1f5;
  text-decoration: none;
  font-size: 14px;
}
.back-link:hover { text-decoration: underline; }
h1 {
  font-size: 24px;
  margin-bottom: 20px;
  color: #333;
}
.textarea-group {
  margin-bottom: 16px;
}
label {
  display: block;
  font-size: 14px;
  color: #666;
  margin-bottom: 8px;
}
input[type="text"], textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 14px;
  font-family: Consolas, Monaco, monospace;
  line-height: 1.6;
}
input[type="text"]:focus, textarea:focus {
  outline: none;
  border-color: #49b1f5;
}
textarea {
  min-height: 180px;
  resize: vertical;
}
.regex-row {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.regex-row input[type="text"] {
  flex: 1;
  min-width: 200px;
  font-size: 15px;
  padding: 12px 14px;
}
.flags-group {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.flag-btn {
  padding: 8px 14px;
  border: 1px solid #ddd;
  background: #fff;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  font-family: Consolas, Monaco, monospace;
  color: #666;
  transition: all 0.2s;
}
.flag-btn.active {
  background: #49b1f5;
  color: #fff;
  border-color: #49b1f5;
}
.flag-btn:hover { border-color: #49b1f5; }
.shortcut-group {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.shortcut-btn {
  padding: 6px 12px;
  background: #f0f0f0;
  border: none;
  border-radius: 4px;
  font-size: 13px;
  cursor: pointer;
  color: #333;
  transition: all 0.2s;
}
.shortcut-btn:hover { background: #49b1f5; color: #fff; }
.btn-group {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
button {
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-primary { background: #49b1f5; color: #fff; }
.btn-primary:hover { background: #3aa0e4; }
.btn-secondary { background: #f0f0f0; color: #333; }
.btn-secondary:hover { background: #e0e0e0; }
.btn-danger { background: #ff4d4f; color: #fff; }
.btn-danger:hover { background: #e84143; }
.result-area { margin-top: 20px; }
.msg {
  padding: 10px 16px;
  border-radius: 6px;
  margin-bottom: 12px;
  font-size: 14px;
  display: none;
}
.msg.error { background: #fff2f0; color: #ff4d4f; border: 1px solid #ffccc7; display: block; }
.msg.success { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; display: block; }
.match-info {
  padding: 12px 16px;
  background: #f6f8fa;
  border-radius: 8px;
  font-size: 14px;
  color: #333;
  margin-bottom: 12px;
}
.match-info strong { color: #49b1f5; }
.highlight-box {
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-family: Consolas, Monaco, monospace;
  font-size: 14px;
  line-height: 1.8;
  white-space: pre-wrap;
  word-break: break-all;
  background: #fafafa;
  min-height: 80px;
}
.highlight-box mark {
  background: #fff3a0;
  color: #333;
  border-radius: 3px;
  padding: 1px 2px;
}
.match-list {
  margin-top: 16px;
  border: 1px solid #ddd;
  border-radius: 8px;
  overflow: hidden;
}
.match-item {
  padding: 10px 14px;
  border-bottom: 1px solid #f0f0f0;
  font-size: 13px;
  font-family: Consolas, Monaco, monospace;
}
.match-item:last-child { border-bottom: none; }
.match-item .match-no {
  color: #49b1f5;
  font-weight: 500;
  margin-right: 8px;
}
.match-item .match-pos {
  color: #999;
  margin-left: 8px;
  font-size: 12px;
}
.match-item .group-list {
  margin-top: 4px;
  color: #666;
  font-size: 12px;
}
.match-empty {
  padding: 20px;
  text-align: center;
  color: #999;
  font-size: 14px;
}
</style>
</head>
<body>
<div class="container">
  <a href="/tools/" class="back-link">← 返回工具列表</a>
  <h1>正则表达式测试</h1>

  <div id="msg" class="msg"></div>

  <div class="textarea-group">
    <label>正则表达式：</label>
    <div class="regex-row">
      <input type="text" id="pattern" placeholder="输入正则表达式，例如 \d+" autocomplete="off">
      <div class="flags-group">
        <div class="flag-btn active" data-flag="g">g</div>
        <div class="flag-btn" data-flag="i">i</div>
        <div class="flag-btn" data-flag="m">m</div>
        <div class="flag-btn" data-flag="s">s</div>
      </div>
    </div>
  </div>

  <div class="shortcut-group">
    <button class="shortcut-btn" data-regex="^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$">邮箱</button>
    <button class="shortcut-btn" data-regex="^1[3-9]\d{9}$">手机号</button>
    <button class="shortcut-btn" data-regex="^https?://[^\s]+$">URL</button>
    <button class="shortcut-btn" data-regex="^(\d{1,3}\.){3}\d{1,3}$">IP</button>
    <button class="shortcut-btn" data-regex="^[1-9]\d{5}(18|19|20)\d{2}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])\d{3}[\dXx]$">身份证</button>
  </div>

  <div class="textarea-group">
    <label>测试文本：</label>
    <textarea id="test-text" placeholder="请输入要测试的文本...">联系我：test@example.com 或者 13800138000，访问 https://example.com，IP 192.168.1.1</textarea>
  </div>

  <div class="btn-group">
    <button class="btn-primary" onclick="runMatch()">执行匹配</button>
    <button class="btn-danger" onclick="clearAll()">清空</button>
  </div>

  <div class="result-area">
    <div class="match-info" id="match-info">匹配数量：<strong>0</strong></div>
    <div class="textarea-group">
      <label>高亮结果：</label>
      <div class="highlight-box" id="highlight-box">匹配结果将显示在这里...</div>
    </div>
    <div class="textarea-group">
      <label>匹配详情：</label>
      <div class="match-list" id="match-list">
        <div class="match-empty">暂无匹配</div>
      </div>
    </div>
  </div>
</div>

<script>
const flagsSet = new Set(['g']);
document.querySelectorAll('.flag-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    const flag = this.dataset.flag;
    if (this.classList.contains('active')) {
      if (flag === 'g') return;
      this.classList.remove('active');
      flagsSet.delete(flag);
    } else {
      this.classList.add('active');
      flagsSet.add(flag);
    }
    runMatch();
  });
});

document.querySelectorAll('.shortcut-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.getElementById('pattern').value = this.dataset.regex;
    runMatch();
  });
});

document.getElementById('pattern').addEventListener('input', runMatch);
document.getElementById('test-text').addEventListener('input', runMatch);

function showMsg(text, type) {
  const msg = document.getElementById('msg');
  msg.textContent = text;
  msg.className = 'msg ' + type;
}
function hideMsg() {
  document.getElementById('msg').className = 'msg';
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function runMatch() {
  hideMsg();
  const patternStr = document.getElementById('pattern').value;
  const text = document.getElementById('test-text').value;
  const infoEl = document.getElementById('match-info');
  const hlEl = document.getElementById('highlight-box');
  const listEl = document.getElementById('match-list');

  if (!patternStr) {
    infoEl.innerHTML = '匹配数量：<strong>0</strong>';
    hlEl.textContent = text || '匹配结果将显示在这里...';
    listEl.innerHTML = '<div class="match-empty">暂无匹配</div>';
    return;
  }

  let regex;
  try {
    const flags = Array.from(flagsSet).join('');
    regex = new RegExp(patternStr, flags);
  } catch (e) {
    showMsg('正则表达式错误：' + e.message, 'error');
    infoEl.innerHTML = '匹配数量：<strong>0</strong>';
    hlEl.textContent = text;
    listEl.innerHTML = '<div class="match-empty">正则语法错误</div>';
    return;
  }

  const matches = [];
  if (flagsSet.has('g')) {
    let m;
    while ((m = regex.exec(text)) !== null) {
      matches.push({ match: m, index: m.index });
      if (m.index === regex.lastIndex) regex.lastIndex++;
    }
  } else {
    const m = regex.exec(text);
    if (m) matches.push({ match: m, index: m.index });
  }

  infoEl.innerHTML = '匹配数量：<strong>' + matches.length + '</strong>';

  // 高亮：按 index 倒序插入 mark，避免位置偏移
  let highlighted = escapeHtml(text);
  const sorted = matches.slice().sort((a, b) => b.index - a.index);
  sorted.forEach(item => {
    const start = item.index;
    const end = start + item.match[0].length;
    highlighted = highlighted.slice(0, start) + '<mark>' + highlighted.slice(start, end) + '</mark>' + highlighted.slice(end);
  });
  hlEl.innerHTML = highlighted || '匹配结果将显示在这里...';

  // 列表
  if (matches.length === 0) {
    listEl.innerHTML = '<div class="match-empty">暂无匹配</div>';
    return;
  }
  let html = '';
  matches.forEach((item, i) => {
    const m = item.match;
    let groupsHtml = '';
    if (m.length > 1) {
      groupsHtml = '<div class="group-list">捕获组：' + Array.from(m).slice(1).map((g, idx) =>
        '[' + (idx + 1) + '] ' + escapeHtml(g === undefined ? '(undefined)' : g)
      ).join('  ') + '</div>';
    }
    html += '<div class="match-item">' +
      '<span class="match-no">#' + (i + 1) + '</span>' +
      '<span>' + escapeHtml(m[0]) + '</span>' +
      '<span class="match-pos">位置 ' + item.index + ' - ' + (item.index + m[0].length) + '</span>' +
      groupsHtml +
      '</div>';
  });
  listEl.innerHTML = html;
}

function clearAll() {
  document.getElementById('pattern').value = '';
  document.getElementById('test-text').value = '';
  hideMsg();
  runMatch();
}

runMatch();
</script>
</body>
</html>
