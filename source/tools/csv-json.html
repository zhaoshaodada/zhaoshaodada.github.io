<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV 与 JSON 互转 - 在线工具</title>
<meta name="description" content="在线 CSV 与 JSON 互转工具，支持自定义分隔符（逗号/分号/制表符）、表头设置，纯前端实现，安全快速">
<meta name="keywords" content="CSV,JSON,转换,互转,分隔符,表头,在线工具">
<meta property="og:title" content="CSV 与 JSON 互转 - 在线工具">
<meta property="og:description" content="在线 CSV 与 JSON 互转工具，支持自定义分隔符（逗号/分号/制表符）、表头设置，纯前端实现，安全快速">
<meta property="og:type" content="website">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #f5f5f5;
  min-height: 100vh;
  padding: 20px;
}
.container {
  max-width: 1100px;
  margin: 0 auto;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  padding: 30px;
}
.back-link {
  display: inline-block;
  margin-bottom: 20px;
  color: #49b1f5;
  text-decoration: none;
  font-size: 14px;
}
.back-link:hover { text-decoration: underline; }
h1 {
  font-size: 24px;
  margin-bottom: 20px;
  color: #333;
}
.tabs {
  display: flex;
  border-bottom: 2px solid #eee;
  margin-bottom: 20px;
}
.tab {
  padding: 12px 24px;
  cursor: pointer;
  font-size: 15px;
  color: #666;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: all 0.2s;
}
.tab.active {
  color: #49b1f5;
  border-bottom-color: #49b1f5;
  font-weight: 500;
}
.options {
  display: flex;
  gap: 24px;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  font-size: 14px;
  color: #666;
}
.options label {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  font-weight: 500;
}
.options select {
  padding: 6px 10px;
  border: 1px solid #ddd;
  border-radius: 6px;
  font-size: 14px;
  background: #fff;
}
.options select:focus {
  outline: none;
  border-color: #49b1f5;
}
.options input[type="checkbox"] {
  width: 16px;
  height: 16px;
  cursor: pointer;
  accent-color: #49b1f5;
}
.panels {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 20px;
}
@media (max-width: 768px) {
  .panels { grid-template-columns: 1fr; }
}
.panel {
  display: flex;
  flex-direction: column;
}
.panel label {
  font-size: 14px;
  color: #666;
  margin-bottom: 8px;
  font-weight: 500;
}
textarea {
  width: 100%;
  min-height: 320px;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 13px;
  font-family: Consolas, Monaco, monospace;
  resize: vertical;
  line-height: 1.5;
}
textarea:focus {
  outline: none;
  border-color: #49b1f5;
}
.btn-group {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
button {
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-primary { background: #49b1f5; color: #fff; }
.btn-primary:hover { background: #3aa0e4; }
.btn-success { background: #52c41a; color: #fff; }
.btn-success:hover { background: #45b016; }
.btn-warning { background: #faad14; color: #fff; }
.btn-warning:hover { background: #e89c0c; }
.btn-danger { background: #ff4d4f; color: #fff; }
.btn-danger:hover { background: #e84143; }
.btn-secondary { background: #f0f0f0; color: #333; }
.btn-secondary:hover { background: #e0e0e0; }
.msg {
  padding: 10px 16px;
  border-radius: 6px;
  margin-bottom: 12px;
  font-size: 14px;
  display: none;
}
.msg.error { background: #fff2f0; color: #ff4d4f; border: 1px solid #ffccc7; display: block; }
.msg.success { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; display: block; }
</style>
</head>
<body>
<div class="container">
  <a href="/tools/" class="back-link">← 返回工具列表</a>
  <h1>CSV 与 JSON 互转</h1>

  <div class="tabs">
    <div class="tab active" data-tab="csv2json">CSV → JSON</div>
    <div class="tab" data-tab="json2csv">JSON → CSV</div>
  </div>

  <div id="msg" class="msg"></div>

  <div class="options">
    <label>分隔符：
      <select id="delimiter">
        <option value=",">逗号 ( , )</option>
        <option value=";">分号 ( ; )</option>
        <option value="\t">制表符 ( \t )</option>
      </select>
    </label>
    <label><input type="checkbox" id="header" checked> 第一行是表头</label>
  </div>

  <div class="tab-content" id="csv2json">
    <div class="panels">
      <div class="panel">
        <label>输入 CSV：</label>
        <textarea id="csv-input" placeholder="name,age,city&#10;张三,25,北京&#10;李四,30,上海"></textarea>
      </div>
      <div class="panel">
        <label>JSON 结果：</label>
        <textarea id="csv-output" readonly placeholder="JSON 结果将显示在这里..."></textarea>
      </div>
    </div>
    <div class="btn-group">
      <button class="btn-primary" onclick="csvToJson()">转换为 JSON</button>
      <button class="btn-success" onclick="copyOutput('csv-output')">复制结果</button>
      <button class="btn-secondary" onclick="loadExample()">载入示例</button>
      <button class="btn-danger" onclick="clearAll('csv')">清空</button>
    </div>
  </div>

  <div class="tab-content" id="json2csv" style="display:none;">
    <div class="panels">
      <div class="panel">
        <label>输入 JSON 数组：</label>
        <textarea id="json-input" placeholder='[{"name":"张三","age":25,"city":"北京"},{"name":"李四","age":30,"city":"上海"}]'></textarea>
      </div>
      <div class="panel">
        <label>CSV 结果：</label>
        <textarea id="json-output" readonly placeholder="CSV 结果将显示在这里..."></textarea>
      </div>
    </div>
    <div class="btn-group">
      <button class="btn-primary" onclick="jsonToCsv()">转换为 CSV</button>
      <button class="btn-success" onclick="copyOutput('json-output')">复制结果</button>
      <button class="btn-secondary" onclick="loadExampleJson()">载入示例</button>
      <button class="btn-danger" onclick="clearAll('json')">清空</button>
    </div>
  </div>
</div>

<script>
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    this.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
    document.getElementById(this.dataset.tab).style.display = 'block';
    hideMsg();
  });
});

function showMsg(text, type) {
  const msg = document.getElementById('msg');
  msg.textContent = text;
  msg.className = 'msg ' + type;
}
function hideMsg() {
  document.getElementById('msg').className = 'msg';
}

function getDelimiter() {
  const v = document.getElementById('delimiter').value;
  return v === '\\t' ? '\t' : v;
}

function parseCSV(text, delimiter) {
  const rows = [];
  let row = [], field = '', inQuotes = false, i = 0;
  while (i < text.length) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i += 2; }
        else { inQuotes = false; i++; }
      } else { field += c; i++; }
    } else {
      if (c === '"') { inQuotes = true; i++; }
      else if (c === delimiter) { row.push(field); field = ''; i++; }
      else if (c === '\r') { i++; }
      else if (c === '\n') { row.push(field); field = ''; rows.push(row); row = []; i++; }
      else { field += c; i++; }
    }
  }
  if (field !== '' || row.length > 0) { row.push(field); rows.push(row); }
  while (rows.length && rows[rows.length - 1].length === 1 && rows[rows.length - 1][0] === '') rows.pop();
  return rows;
}

function csvToJson() {
  const input = document.getElementById('csv-input').value;
  if (!input.trim()) { showMsg('请输入 CSV 内容', 'error'); return; }
  const delimiter = getDelimiter();
  const hasHeader = document.getElementById('header').checked;
  try {
    const rows = parseCSV(input, delimiter);
    if (rows.length === 0) { showMsg('CSV 内容为空', 'error'); return; }
    let headers, startIdx;
    if (hasHeader) {
      headers = rows[0];
      startIdx = 1;
    } else {
      headers = rows[0].map((_, i) => 'col_' + (i + 1));
      startIdx = 0;
    }
    const result = [];
    for (let i = startIdx; i < rows.length; i++) {
      const obj = {};
      headers.forEach((h, idx) => {
        obj[h] = rows[i][idx] !== undefined ? rows[i][idx] : '';
      });
      result.push(obj);
    }
    document.getElementById('csv-output').value = JSON.stringify(result, null, 2);
    showMsg('转换成功，共 ' + result.length + ' 条记录', 'success');
  } catch (e) {
    showMsg('转换失败: ' + e.message, 'error');
  }
}

function jsonToCsv() {
  const input = document.getElementById('json-input').value.trim();
  if (!input) { showMsg('请输入 JSON 内容', 'error'); return; }
  let data;
  try {
    data = JSON.parse(input);
  } catch (e) {
    showMsg('JSON 格式错误: ' + e.message, 'error');
    return;
  }
  if (!Array.isArray(data)) { showMsg('JSON 必须是数组', 'error'); return; }
  const delimiter = getDelimiter();
  const hasHeader = document.getElementById('header').checked;
  try {
    const keys = [];
    const seen = new Set();
    data.forEach(obj => {
      if (obj && typeof obj === 'object' && !Array.isArray(obj)) {
        Object.keys(obj).forEach(k => {
          if (!seen.has(k)) { seen.add(k); keys.push(k); }
        });
      }
    });
    if (keys.length === 0) { showMsg('数组中未找到对象', 'error'); return; }
    const esc = (v) => {
      let s;
      if (v === null || v === undefined) s = '';
      else if (typeof v === 'object') s = JSON.stringify(v);
      else s = String(v);
      if (s.indexOf(delimiter) !== -1 || s.indexOf('"') !== -1 || s.indexOf('\n') !== -1 || s.indexOf('\r') !== -1) {
        return '"' + s.replace(/"/g, '""') + '"';
      }
      return s;
    };
    const lines = [];
    if (hasHeader) lines.push(keys.map(esc).join(delimiter));
    data.forEach(obj => {
      const arr = keys.map(k => esc(obj && typeof obj === 'object' ? obj[k] : ''));
      lines.push(arr.join(delimiter));
    });
    document.getElementById('json-output').value = lines.join('\n');
    showMsg('转换成功，共 ' + data.length + ' 条记录', 'success');
  } catch (e) {
    showMsg('转换失败: ' + e.message, 'error');
  }
}

function copyOutput(id) {
  const val = document.getElementById(id).value;
  if (!val) { showMsg('没有可复制的内容', 'error'); return; }
  navigator.clipboard.writeText(val).then(() => {
    showMsg('已复制到剪贴板', 'success');
  }).catch(() => {
    const el = document.getElementById(id);
    el.select();
    document.execCommand('copy');
    showMsg('已复制到剪贴板', 'success');
  });
}

function clearAll(type) {
  document.getElementById(type + '-input').value = '';
  document.getElementById(type + '-output').value = '';
  hideMsg();
}

function loadExample() {
  document.getElementById('csv-input').value = 'name,age,city,note\n张三,25,北京,"hello, world"\n李四,30,上海,"他说：""你好"""\n王五,28,深圳,普通字段';
  hideMsg();
}

function loadExampleJson() {
  document.getElementById('json-input').value = '[\n  {"name":"张三","age":25,"city":"北京"},\n  {"name":"李四","age":30,"city":"上海"},\n  {"name":"王五","age":28,"city":"深圳"}\n]';
  hideMsg();
}
</script>
</body>
</html>
