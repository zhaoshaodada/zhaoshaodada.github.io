<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线计算器 - 在线工具</title>
<meta name="description" content="在线计算器，支持基本运算、科学计算、三角函数、对数运算，纯前端实现">
<meta name="keywords" content="计算器,科学计算器,在线计算器,基本运算,三角函数,对数运算">
<meta property="og:title" content="在线计算器 - 在线工具">
<meta property="og:description" content="在线计算器，支持基本运算、科学计算、三角函数、对数运算">
<meta property="og:type" content="website">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #f5f5f5;
  min-height: 100vh;
  padding: 20px;
}
.container {
  max-width: 400px;
  margin: 0 auto;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  padding: 20px;
}
.back-link {
  display: inline-block;
  margin-bottom: 15px;
  color: #49b1f5;
  text-decoration: none;
  font-size: 14px;
}
.back-link:hover { text-decoration: underline; }
h1 {
  font-size: 20px;
  margin-bottom: 15px;
  color: #333;
  text-align: center;
}
.display {
  background: #fafafa;
  border: 1px solid #eee;
  border-radius: 8px;
  padding: 15px;
  margin-bottom: 15px;
}
.display .expression {
  font-size: 14px;
  color: #999;
  min-height: 20px;
  margin-bottom: 5px;
  font-family: Consolas, Monaco, monospace;
  text-align: right;
}
.display .result {
  font-size: 32px;
  font-weight: 600;
  color: #333;
  text-align: right;
  font-family: Consolas, Monaco, monospace;
  word-break: break-all;
}
.keyboard {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.key {
  padding: 15px;
  border: none;
  border-radius: 8px;
  font-size: 18px;
  cursor: pointer;
  transition: all 0.1s;
  background: #f5f5f5;
  color: #333;
}
.key:hover { background: #e8e8e8; }
.key:active { transform: scale(0.95); }
.key.operator {
  background: #49b1f5;
  color: #fff;
}
.key.operator:hover { background: #3aa0e4; }
.key.function {
  background: #f0f0f0;
  color: #666;
}
.key.function:hover { background: #e0e0e0; }
.key.equals {
  background: #52c41a;
  color: #fff;
  grid-column: span 2;
}
.key.equals:hover { background: #45b016; }
.key.clear {
  background: #ff4d4f;
  color: #fff;
}
.key.clear:hover { background: #e84143; }
.mode-toggle {
  display: flex;
  gap: 8px;
  margin-bottom: 15px;
}
.mode-btn {
  flex: 1;
  padding: 8px;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  background: #f0f0f0;
  color: #666;
  transition: all 0.2s;
}
.mode-btn.active {
  background: #49b1f5;
  color: #fff;
}
.mode-btn:hover { background: #e0e0e0; }
.mode-btn.active:hover { background: #3aa0e4; }
@media (max-width: 400px) {
  .key { padding: 12px; font-size: 16px; }
  .display .result { font-size: 28px; }
}
</style>
</head>
<body>
<div class="container">
  <a href="/tools/" class="back-link">← 返回工具列表</a>
  <h1>在线计算器</h1>

  <div class="mode-toggle">
    <button class="mode-btn active" onclick="switchMode('basic')">基本</button>
    <button class="mode-btn" onclick="switchMode('scientific')">科学</button>
  </div>

  <div class="display">
    <div class="expression" id="expression"></div>
    <div class="result" id="result">0</div>
  </div>

  <div class="keyboard" id="keyboard">
    <button class="key clear" onclick="clearAll()">C</button>
    <button class="key function" onclick="append('(')">(</button>
    <button class="key function" onclick="append(')')">)</button>
    <button class="key operator" onclick="append('/')">÷</button>

    <button class="key" onclick="append('7')">7</button>
    <button class="key" onclick="append('8')">8</button>
    <button class="key" onclick="append('9')">9</button>
    <button class="key operator" onclick="append('*')">×</button>

    <button class="key" onclick="append('4')">4</button>
    <button class="key" onclick="append('5')">5</button>
    <button class="key" onclick="append('6')">6</button>
    <button class="key operator" onclick="append('-')">−</button>

    <button class="key" onclick="append('1')">1</button>
    <button class="key" onclick="append('2')">2</button>
    <button class="key" onclick="append('3')">3</button>
    <button class="key operator" onclick="append('+')">+</button>

    <button class="key function" onclick="append('.')">.</button>
    <button class="key" onclick="append('0')">0</button>
    <button class="key function" onclick="backspace()">⌫</button>
    <button class="key equals" onclick="calculate()">=</button>
  </div>

  <div class="keyboard" id="scientificKeyboard" style="display:none;">
    <button class="key function" onclick="append('Math.sin(')">sin(</button>
    <button class="key function" onclick="append('Math.cos(')">cos(</button>
    <button class="key function" onclick="append('Math.tan(')">tan(</button>
    <button class="key function" onclick="append('Math.sqrt(')">√(</button>

    <button class="key function" onclick="append('Math.asin(')">asin(</button>
    <button class="key function" onclick="append('Math.acos(')">acos(</button>
    <button class="key function" onclick="append('Math.atan(')">atan(</button>
    <button class="key function" onclick="append('Math.pow(')">pow(</button>

    <button class="key function" onclick="append('Math.log(')">ln(</button>
    <button class="key function" onclick="append('Math.log10(')">log(</button>
    <button class="key function" onclick="append('Math.abs(')">abs(</button>
    <button class="key function" onclick="append('Math.PI')">π</button>

    <button class="key function" onclick="append('Math.exp(')">exp(</button>
    <button class="key function" onclick="append('Math.round(')">round(</button>
    <button class="key function" onclick="append('Math.floor(')">floor(</button>
    <button class="key function" onclick="append('Math.ceil(')">ceil(</button>
  </div>
</div>

<script>
let currentExpression = '';
let displayValue = '0';

function switchMode(mode) {
  const basicBtn = document.querySelector('.mode-btn:first-child');
  const scientificBtn = document.querySelector('.mode-btn:last-child');
  const basicKeyboard = document.getElementById('keyboard');
  const scientificKeyboard = document.getElementById('scientificKeyboard');
  
  if (mode === 'basic') {
    basicBtn.classList.add('active');
    scientificBtn.classList.remove('active');
    scientificKeyboard.style.display = 'none';
  } else {
    scientificBtn.classList.add('active');
    basicBtn.classList.remove('active');
    scientificKeyboard.style.display = 'grid';
  }
}

function append(value) {
  if (value === '×') value = '*';
  if (value === '÷') value = '/';
  if (value === '−') value = '-';
  
  if (displayValue === '0' && !['+', '-', '*', '/', '.', '('].includes(value)) {
    displayValue = value;
  } else {
    displayValue += value;
  }
  currentExpression = displayValue;
  updateDisplay();
}

function backspace() {
  if (displayValue.length > 1) {
    displayValue = displayValue.slice(0, -1);
  } else {
    displayValue = '0';
  }
  currentExpression = displayValue;
  updateDisplay();
}

function clearAll() {
  displayValue = '0';
  currentExpression = '';
  updateDisplay();
}

function calculate() {
  if (!currentExpression) return;
  
  try {
    let expr = currentExpression
      .replace(/(\d+)\s*\^\s*(\d+)/g, 'Math.pow($1, $2)')
      .replace(/\^/g, 'Math.pow');
    
    const result = eval(expr);
    
    if (isNaN(result) || !isFinite(result)) {
      displayValue = 'Error';
    } else {
      displayValue = formatResult(result);
    }
    updateDisplay();
  } catch (e) {
    displayValue = 'Error';
    updateDisplay();
  }
}

function formatResult(result) {
  if (Number.isInteger(result)) return result.toString();
  if (Math.abs(result) < 0.0000001 && result !== 0) return result.toExponential(6);
  if (Math.abs(result) > 1000000000) return result.toExponential(6);
  return parseFloat(result.toFixed(10)).toString();
}

function updateDisplay() {
  document.getElementById('expression').textContent = currentExpression;
  document.getElementById('result').textContent = displayValue;
}

document.addEventListener('keydown', function(e) {
  const key = e.key;
  if (/[0-9]/.test(key)) append(key);
  else if (['+', '-', '*', '/', '.', '(', ')'].includes(key)) append(key);
  else if (key === '=' || key === 'Enter') calculate();
  else if (key === 'Backspace') backspace();
  else if (key === 'Escape') clearAll();
});
</script>
</body>
</html>
