function showMsg(text, type) {
  const msg = document.getElementById('msg');
  msg.textContent = text;
  msg.className = 'msg ' + type;
}
function hideMsg() {
  document.getElementById('msg').className = 'msg';
}

function convert() {
  const input = document.getElementById('inputText').value;
  if (!input) { showMsg('请输入内容', 'error'); return; }
  
  const tone = document.getElementById('tone').checked;
  const firstLetter = document.getElementById('firstLetter').checked;
  const capitalize = document.getElementById('capitalize').checked;
  const separator = document.getElementById('separator').value === 'space' ? ' ' : document.getElementById('separator').value;
  
  const results = [];
  for (let i = 0; i < input.length; i++) {
    const char = input[i];
    if (pinyinDict[char]) {
      let pinyin = pinyinDict[char][0];
      if (firstLetter) {
        pinyin = pinyin.charAt(0);
      }
      if (capitalize) {
        pinyin = pinyin.charAt(0).toUpperCase() + pinyin.slice(1);
      }
      results.push(pinyin);
    } else {
      results.push(char);
    }
  }
  
  document.getElementById('outputText').value = results.join(separator);
  showMsg('转换完成', 'success');
}

function copyResult() {
  const output = document.getElementById('outputText');
  if (!output.value) { showMsg('没有可复制的内容', 'error'); return; }
  output.select();
  document.execCommand('copy');
  showMsg('已复制到剪贴板', 'success');
}

function clearAll() {
  document.getElementById('inputText').value = '';
  document.getElementById('outputText').value = '';
  hideMsg();
}
