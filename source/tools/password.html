<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>密码生成器 - 在线工具</title>
<meta name="description" content="在线密码生成器，支持自定义长度、大写字母、小写字母、数字、特殊符号，实时显示密码强度，纯前端实现安全可靠">
<meta name="keywords" content="密码生成器,随机密码,密码强度,强密码,在线工具">
<meta property="og:title" content="密码生成器 - 在线工具">
<meta property="og:description" content="在线密码生成器，支持自定义长度与字符集，实时显示密码强度，纯前端实现">
<meta property="og:type" content="website">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #f5f5f5;
  min-height: 100vh;
  padding: 20px;
}
.container {
  max-width: 900px;
  margin: 0 auto;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  padding: 30px;
}
.back-link {
  display: inline-block;
  margin-bottom: 20px;
  color: #49b1f5;
  text-decoration: none;
  font-size: 14px;
}
.back-link:hover { text-decoration: underline; }
h1 {
  font-size: 24px;
  margin-bottom: 20px;
  color: #333;
}
.option-group {
  margin-bottom: 20px;
}
.option-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.option-row label {
  margin-bottom: 0;
  min-width: 90px;
}
label {
  display: block;
  font-size: 14px;
  color: #666;
  margin-bottom: 8px;
}
input[type="number"] {
  width: 100px;
  padding: 8px 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
}
input[type="number"]:focus {
  outline: none;
  border-color: #49b1f5;
}
input[type="range"] {
  flex: 1;
  min-width: 200px;
  accent-color: #49b1f5;
}
.length-value {
  font-size: 14px;
  color: #49b1f5;
  font-weight: 500;
  min-width: 40px;
}
.checkbox-group {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
}
.checkbox-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  color: #666;
  cursor: pointer;
}
.checkbox-item input[type="checkbox"] {
  width: 16px;
  height: 16px;
  accent-color: #49b1f5;
  cursor: pointer;
}
.btn-group {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
button {
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-primary {
  background: #49b1f5;
  color: #fff;
}
.btn-primary:hover { background: #3aa0e4; }
.btn-secondary {
  background: #f0f0f0;
  color: #333;
}
.btn-secondary:hover { background: #e0e0e0; }
.btn-success {
  background: #52c41a;
  color: #fff;
}
.btn-success:hover { background: #45b016; }
.btn-warning {
  background: #faad14;
  color: #fff;
}
.btn-warning:hover { background: #e89c0c; }
.btn-danger {
  background: #ff4d4f;
  color: #fff;
}
.btn-danger:hover { background: #e84143; }
.result-area {
  margin-top: 20px;
}
.password-display {
  width: 100%;
  padding: 14px 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 16px;
  font-family: Consolas, Monaco, monospace;
  background: #fafafa;
  word-break: break-all;
  min-height: 50px;
  line-height: 1.6;
  color: #333;
}
.password-display.empty {
  color: #999;
}
.strength {
  margin-top: 14px;
  font-size: 14px;
  color: #666;
}
.strength-bar {
  display: inline-block;
  width: 200px;
  height: 8px;
  background: #f0f0f0;
  border-radius: 4px;
  margin-left: 8px;
  vertical-align: middle;
  overflow: hidden;
}
.strength-fill {
  height: 100%;
  width: 0;
  border-radius: 4px;
  transition: all 0.3s;
}
.strength-label {
  margin-left: 8px;
  font-weight: 500;
}
.msg {
  padding: 10px 16px;
  border-radius: 6px;
  margin-bottom: 12px;
  font-size: 14px;
  display: none;
}
.msg.error { background: #fff2f0; color: #ff4d4f; border: 1px solid #ffccc7; display: block; }
.msg.success { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; display: block; }
@media (max-width: 600px) {
  .container { padding: 20px; }
  .option-row label { min-width: auto; }
  .strength-bar { width: 140px; }
}
</style>
</head>
<body>
<div class="container">
  <a href="/tools/" class="back-link">← 返回工具列表</a>
  <h1>密码生成器</h1>

  <div id="msg" class="msg"></div>

  <div class="option-group">
    <div class="option-row">
      <label for="length">密码长度：</label>
      <input type="range" id="length" min="4" max="64" value="12" oninput="updateLength()">
      <span class="length-value" id="length-value">12</span>
      <input type="number" id="length-num" min="4" max="64" value="12" oninput="syncLength()">
    </div>
    <div class="option-row">
      <label>字符类型：</label>
      <div class="checkbox-group">
        <label class="checkbox-item"><input type="checkbox" id="upper" checked> 大写字母 (A-Z)</label>
        <label class="checkbox-item"><input type="checkbox" id="lower" checked> 小写字母 (a-z)</label>
        <label class="checkbox-item"><input type="checkbox" id="number" checked> 数字 (0-9)</label>
        <label class="checkbox-item"><input type="checkbox" id="symbol"> 特殊符号 (!@#$%...)</label>
      </div>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn-primary" onclick="generate()">生成密码</button>
    <button class="btn-success" onclick="copyPassword()">复制密码</button>
  </div>

  <div class="result-area">
    <label>生成结果：</label>
    <div class="password-display empty" id="password">点击"生成密码"按钮以生成密码</div>
    <div class="strength">
      密码强度：
      <span class="strength-bar"><span class="strength-fill" id="strength-fill"></span></span>
      <span class="strength-label" id="strength-label">未生成</span>
    </div>
  </div>
</div>

<script>
function showMsg(text, type) {
  const msg = document.getElementById('msg');
  msg.textContent = text;
  msg.className = 'msg ' + type;
}
function hideMsg() {
  document.getElementById('msg').className = 'msg';
}

function updateLength() {
  const val = document.getElementById('length').value;
  document.getElementById('length-value').textContent = val;
  document.getElementById('length-num').value = val;
}
function syncLength() {
  let val = parseInt(document.getElementById('length-num').value, 10);
  if (isNaN(val)) val = 4;
  if (val < 4) val = 4;
  if (val > 64) val = 64;
  document.getElementById('length-num').value = val;
  document.getElementById('length').value = val;
  document.getElementById('length-value').textContent = val;
}

function getRandomInt(max) {
  if (window.crypto && window.crypto.getRandomValues) {
    const arr = new Uint32Array(1);
    window.crypto.getRandomValues(arr);
    return arr[0] % max;
  }
  return Math.floor(Math.random() * max);
}

function generate() {
  const length = parseInt(document.getElementById('length').value, 10);
  const useUpper = document.getElementById('upper').checked;
  const useLower = document.getElementById('lower').checked;
  const useNumber = document.getElementById('number').checked;
  const useSymbol = document.getElementById('symbol').checked;

  if (!useUpper && !useLower && !useNumber && !useSymbol) {
    showMsg('请至少选择一种字符类型', 'error');
    return;
  }

  const upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const lower = 'abcdefghijklmnopqrstuvwxyz';
  const number = '0123456789';
  const symbol = '!@#$%^&*()-_=+[]{}|;:,.<>?';

  let pool = '';
  const required = [];
  if (useUpper) { pool += upper; required.push(upper[getRandomInt(upper.length)]); }
  if (useLower) { pool += lower; required.push(lower[getRandomInt(lower.length)]); }
  if (useNumber) { pool += number; required.push(number[getRandomInt(number.length)]); }
  if (useSymbol) { pool += symbol; required.push(symbol[getRandomInt(symbol.length)]); }

  let password = '';
  // 先放入必选字符，再随机填充
  for (let i = 0; i < length; i++) {
    if (i < required.length) {
      password += required[i];
    } else {
      password += pool[getRandomInt(pool.length)];
    }
  }
  // 简单打乱顺序
  password = password.split('').sort(() => Math.random() - 0.5).join('');

  const display = document.getElementById('password');
  display.textContent = password;
  display.classList.remove('empty');

  updateStrength(password);
  hideMsg();
}

function updateStrength(password) {
  if (!password) {
    document.getElementById('strength-fill').style.width = '0';
    document.getElementById('strength-label').textContent = '未生成';
    return;
  }
  let score = 0;
  if (password.length >= 8) score += 1;
  if (password.length >= 12) score += 1;
  if (password.length >= 16) score += 1;
  if (/[a-z]/.test(password)) score += 1;
  if (/[A-Z]/.test(password)) score += 1;
  if (/[0-9]/.test(password)) score += 1;
  if (/[^a-zA-Z0-9]/.test(password)) score += 1;

  const fill = document.getElementById('strength-fill');
  const label = document.getElementById('strength-label');

  if (score <= 3) {
    fill.style.width = '33%';
    fill.style.background = '#ff4d4f';
    label.textContent = '弱';
    label.style.color = '#ff4d4f';
  } else if (score <= 5) {
    fill.style.width = '66%';
    fill.style.background = '#faad14';
    label.textContent = '中';
    label.style.color = '#faad14';
  } else {
    fill.style.width = '100%';
    fill.style.background = '#52c41a';
    label.textContent = '强';
    label.style.color = '#52c41a';
  }
}

function copyPassword() {
  const val = document.getElementById('password').textContent;
  if (!val || document.getElementById('password').classList.contains('empty')) {
    showMsg('没有可复制的内容', 'error');
    return;
  }
  navigator.clipboard.writeText(val).then(() => {
    showMsg('已复制到剪贴板', 'success');
  }).catch(() => {
    const range = document.createRange();
    range.selectNode(document.getElementById('password'));
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
    document.execCommand('copy');
    window.getSelection().removeAllRanges();
    showMsg('已复制到剪贴板', 'success');
  });
}

// 页面加载时先生成一个
window.addEventListener('DOMContentLoaded', generate);
</script>
</body>
</html>
