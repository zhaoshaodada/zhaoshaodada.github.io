<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文本对比 - 在线工具</title>
<meta name="description" content="在线文本对比工具，支持两段文本差异对比，高亮显示新增、删除、修改内容，纯前端实现">
<meta name="keywords" content="文本对比,差异对比,diff,在线工具">
<meta property="og:title" content="文本对比 - 在线工具">
<meta property="og:description" content="在线文本对比工具，支持两段文本差异对比">
<meta property="og:type" content="website">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #f5f5f5;
  min-height: 100vh;
  padding: 20px;
}
.container {
  max-width: 900px;
  margin: 0 auto;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  padding: 30px;
}
.back-link {
  display: inline-block;
  margin-bottom: 20px;
  color: #49b1f5;
  text-decoration: none;
  font-size: 14px;
}
.back-link:hover { text-decoration: underline; }
h1 {
  font-size: 24px;
  margin-bottom: 8px;
  color: #333;
}
.subtitle { font-size: 13px; color: #999; margin-bottom: 20px; }
.textarea-group { margin-bottom: 16px; }
label {
  display: block;
  font-size: 14px;
  color: #666;
  margin-bottom: 8px;
}
textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 14px;
  font-family: Consolas, Monaco, monospace;
  min-height: 200px;
  resize: vertical;
}
textarea:focus {
  outline: none;
  border-color: #49b1f5;
}
.btn-group {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
button {
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-primary { background: #49b1f5; color: #fff; }
.btn-primary:hover { background: #3aa0e4; }
.btn-secondary { background: #f0f0f0; color: #333; }
.btn-secondary:hover { background: #e0e0e0; }
.btn-success { background: #52c41a; color: #fff; }
.btn-success:hover { background: #45b016; }
.btn-danger { background: #ff4d4f; color: #fff; }
.btn-danger:hover { background: #e84143; }
.msg {
  padding: 10px 16px;
  border-radius: 6px;
  margin-bottom: 12px;
  font-size: 14px;
  display: none;
}
.msg.error { background: #fff2f0; color: #ff4d4f; border: 1px solid #ffccc7; display: block; }
.msg.success { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; display: block; }
.diff-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.diff-panel {
  border: 1px solid #ddd;
  border-radius: 8px;
  overflow: hidden;
}
.diff-panel .panel-header {
  padding: 10px 14px;
  background: #f6f8fa;
  font-size: 13px;
  color: #666;
  border-bottom: 1px solid #eee;
}
.diff-panel .panel-body {
  padding: 12px;
  max-height: 300px;
  overflow-y: auto;
}
.diff-content {
  font-family: Consolas, Monaco, monospace;
  font-size: 14px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-all;
}
.diff-added {
  background: #f6ffed;
  color: #52c41a;
  text-decoration: none;
}
.diff-removed {
  background: #fff2f0;
  color: #ff4d4f;
  text-decoration: line-through;
}
.diff-modified-old {
  background: #fff7e6;
  color: #fa8c16;
}
.diff-modified-new {
  background: #e6f7ff;
  color: #1890ff;
}
.diff-marker {
  display: inline-block;
  width: 20px;
  text-align: center;
  font-size: 12px;
  margin-right: 8px;
}
.info-bar {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  margin-bottom: 16px;
  padding: 12px;
  background: #fafafa;
  border-radius: 8px;
  font-size: 13px;
}
.info-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.info-item .dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}
.dot.added { background: #52c41a; }
.dot.removed { background: #ff4d4f; }
.dot.modified { background: #fa8c16; }
@media (max-width: 600px) {
  .diff-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="container">
  <a href="/tools/" class="back-link">← 返回工具列表</a>
  <h1>文本对比</h1>
  <p class="subtitle">支持两段文本差异对比，高亮显示新增、删除、修改内容</p>

  <div id="msg" class="msg"></div>

  <div class="diff-grid">
    <div class="textarea-group">
      <label>原始文本：</label>
      <textarea id="oldText" placeholder="输入原始文本..."></textarea>
    </div>
    <div class="textarea-group">
      <label>新文本：</label>
      <textarea id="newText" placeholder="输入新文本..."></textarea>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn-primary" onclick="compare()">开始对比</button>
    <button class="btn-secondary" onclick="loadExample()">加载示例</button>
    <button class="btn-danger" onclick="clearAll()">清空</button>
  </div>

  <div class="info-bar" id="infoBar" style="display:none;">
    <div class="info-item">
      <span class="dot added"></span>
      <span id="addedCount">0 行新增</span>
    </div>
    <div class="info-item">
      <span class="dot removed"></span>
      <span id="removedCount">0 行删除</span>
    </div>
    <div class="info-item">
      <span class="dot modified"></span>
      <span id="modifiedCount">0 行修改</span>
    </div>
  </div>

  <div class="diff-grid">
    <div class="diff-panel">
      <div class="panel-header">原始文本</div>
      <div class="panel-body">
        <div class="diff-content" id="diffOld"></div>
      </div>
    </div>
    <div class="diff-panel">
      <div class="panel-header">新文本</div>
      <div class="panel-body">
        <div class="diff-content" id="diffNew"></div>
      </div>
    </div>
  </div>
</div>

<script>
function showMsg(text, type) {
  const msg = document.getElementById('msg');
  msg.textContent = text;
  msg.className = 'msg ' + type;
}
function hideMsg() {
  document.getElementById('msg').className = 'msg';
}

function diffLines(oldLines, newLines) {
  const result = [];
  const matrix = [];
  const oLen = oldLines.length;
  const nLen = newLines.length;
  
  for (let i = 0; i <= oLen; i++) {
    matrix[i] = [];
    for (let j = 0; j <= nLen; j++) {
      if (i === 0) matrix[i][j] = j;
      else if (j === 0) matrix[i][j] = i;
      else if (oldLines[i - 1] === newLines[j - 1]) matrix[i][j] = matrix[i - 1][j - 1];
      else matrix[i][j] = Math.min(matrix[i - 1][j], matrix[i][j - 1], matrix[i - 1][j - 1]) + 1;
    }
  }
  
  let i = oLen, j = nLen;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && oldLines[i - 1] === newLines[j - 1]) {
      result.unshift({ type: 'equal', oldLine: oldLines[i - 1], newLine: newLines[j - 1] });
      i--; j--;
    } else if (j > 0 && (i === 0 || matrix[i][j - 1] <= matrix[i - 1][j])) {
      result.unshift({ type: 'added', oldLine: null, newLine: newLines[j - 1] });
      j--;
    } else if (i > 0 && (j === 0 || matrix[i][j - 1] > matrix[i - 1][j])) {
      result.unshift({ type: 'removed', oldLine: oldLines[i - 1], newLine: null });
      i--;
    }
  }
  
  return result;
}

function compare() {
  const oldText = document.getElementById('oldText').value;
  const newText = document.getElementById('newText').value;
  
  if (!oldText || !newText) {
    showMsg('请输入两段文本进行对比', 'error');
    return;
  }
  
  const oldLines = oldText.split('\n');
  const newLines = newText.split('\n');
  const diffResult = diffLines(oldLines, newLines);
  
  let added = 0, removed = 0, modified = 0;
  let diffOldHtml = '', diffNewHtml = '';
  
  diffResult.forEach((item, index) => {
    const lineNum = index + 1;
    if (item.type === 'equal') {
      diffOldHtml += `<div><span class="diff-marker">${lineNum}</span>${escapeHtml(item.oldLine)}</div>`;
      diffNewHtml += `<div><span class="diff-marker">${lineNum}</span>${escapeHtml(item.newLine)}</div>`;
    } else if (item.type === 'added') {
      added++;
      diffOldHtml += `<div><span class="diff-marker"> </span></div>`;
      diffNewHtml += `<div class="diff-added"><span class="diff-marker">+</span>${escapeHtml(item.newLine)}</div>`;
    } else if (item.type === 'removed') {
      removed++;
      diffOldHtml += `<div class="diff-removed"><span class="diff-marker">-</span>${escapeHtml(item.oldLine)}</div>`;
      diffNewHtml += `<div><span class="diff-marker"> </span></div>`;
    }
  });
  
  document.getElementById('diffOld').innerHTML = diffOldHtml;
  document.getElementById('diffNew').innerHTML = diffNewHtml;
  document.getElementById('addedCount').textContent = `${added} 行新增`;
  document.getElementById('removedCount').textContent = `${removed} 行删除`;
  document.getElementById('modifiedCount').textContent = `${modified} 行修改`;
  document.getElementById('infoBar').style.display = 'flex';
  
  showMsg('对比完成', 'success');
}

function escapeHtml(text) {
  if (text === null || text === undefined) return '';
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function loadExample() {
  document.getElementById('oldText').value = `function hello(name) {
  console.log('Hello, ' + name);
  return name;
}

const user = 'World';
hello(user);`;
  document.getElementById('newText').value = `function hello(name, greeting = 'Hello') {
  console.log(greeting + ', ' + name + '!');
  return { name, greeting };
}

const user = 'Moonligh';
const result = hello(user, 'Hi');`;
  hideMsg();
}

function clearAll() {
  document.getElementById('oldText').value = '';
  document.getElementById('newText').value = '';
  document.getElementById('diffOld').innerHTML = '';
  document.getElementById('diffNew').innerHTML = '';
  document.getElementById('infoBar').style.display = 'none';
  hideMsg();
}
</script>
</body>
</html>
