<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRON 表达式生成器 - 在线工具</title>
<meta name="description" content="在线 CRON 表达式可视化生成器，支持五个字段（分钟/小时/日/月/星期）的具体值、区间、列表、步长配置，实时生成表达式、中文描述及下 5 次执行时间，纯前端实现">
<meta name="keywords" content="cron,crontab,表达式,生成器,定时任务,在线工具">
<meta property="og:title" content="CRON 表达式生成器 - 在线工具">
<meta property="og:description" content="在线 CRON 表达式可视化生成器，支持五个字段配置，实时生成表达式、中文描述及下 5 次执行时间，纯前端实现">
<meta property="og:type" content="website">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #f5f5f5;
  min-height: 100vh;
  padding: 20px;
}
.container {
  max-width: 900px;
  margin: 0 auto;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  padding: 30px;
}
.back-link {
  display: inline-block;
  margin-bottom: 20px;
  color: #49b1f5;
  text-decoration: none;
  font-size: 14px;
}
.back-link:hover { text-decoration: underline; }
h1 {
  font-size: 24px;
  margin-bottom: 20px;
  color: #333;
}
h2 {
  font-size: 16px;
  color: #333;
  margin-bottom: 14px;
  font-weight: 500;
}
.section {
  margin-bottom: 24px;
}
.field-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.field-label {
  width: 60px;
  font-size: 14px;
  color: #666;
  font-weight: 500;
  flex-shrink: 0;
}
.field-type {
  padding: 6px 10px;
  border: 1px solid #ddd;
  border-radius: 6px;
  font-size: 14px;
  background: #fff;
  color: #333;
}
.field-type:focus {
  outline: none;
  border-color: #49b1f5;
}
.field-inputs {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
  flex-wrap: wrap;
}
.field-inputs input {
  padding: 6px 10px;
  border: 1px solid #ddd;
  border-radius: 6px;
  font-size: 14px;
  width: 100px;
  font-family: Consolas, Monaco, monospace;
}
.field-inputs input:focus {
  outline: none;
  border-color: #49b1f5;
}
.field-inputs .sep {
  color: #999;
  font-size: 14px;
}
.field-inputs .hint {
  color: #999;
  font-size: 14px;
}
.field-range {
  font-size: 12px;
  color: #999;
  width: 100%;
  margin-top: 2px;
}
.presets {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
button {
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-primary { background: #49b1f5; color: #fff; }
.btn-primary:hover { background: #3aa0e4; }
.btn-success { background: #52c41a; color: #fff; }
.btn-success:hover { background: #45b016; }
.btn-secondary { background: #f0f0f0; color: #333; }
.btn-secondary:hover { background: #e0e0e0; }
.btn-danger { background: #ff4d4f; color: #fff; }
.btn-danger:hover { background: #e84143; }
.expr-box {
  background: #f9f9f9;
  border: 1px solid #eee;
  border-radius: 8px;
  padding: 20px;
  text-align: center;
}
.expr-box label {
  display: block;
  font-size: 13px;
  color: #999;
  margin-bottom: 10px;
}
.expr-input {
  width: 100%;
  font-family: Consolas, Monaco, monospace;
  font-size: 22px;
  color: #49b1f5;
  font-weight: 600;
  letter-spacing: 2px;
  text-align: center;
  border: none;
  background: transparent;
  outline: none;
}
.desc-box {
  background: #f0f8ff;
  border: 1px solid #d6e9ff;
  border-radius: 8px;
  padding: 14px 16px;
  font-size: 15px;
  color: #333;
  line-height: 1.6;
}
.next-times {
  background: #fafafa;
  border: 1px solid #eee;
  border-radius: 8px;
  padding: 16px;
}
.next-times ul {
  list-style: none;
}
.next-times li {
  padding: 9px 12px;
  font-family: Consolas, Monaco, monospace;
  font-size: 14px;
  color: #333;
  border-bottom: 1px solid #f0f0f0;
}
.next-times li:last-child { border-bottom: none; }
.next-times .empty {
  color: #999;
  font-family: inherit;
  font-size: 14px;
  text-align: center;
  padding: 16px;
}
.btn-group {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 16px;
  justify-content: center;
}
</style>
</head>
<body>
<div class="container">
  <a href="/tools/" class="back-link">← 返回工具列表</a>
  <h1>CRON 表达式生成器</h1>

  <div class="section">
    <h2>常用预设</h2>
    <div class="presets">
      <button class="btn-secondary" data-expr="* * * * *">每分钟</button>
      <button class="btn-secondary" data-expr="0 * * * *">每小时整点</button>
      <button class="btn-secondary" data-expr="*/15 * * * *">每 15 分钟</button>
      <button class="btn-secondary" data-expr="0 0 * * *">每天 0:00</button>
      <button class="btn-secondary" data-expr="0 8 * * *">每天 8:00</button>
      <button class="btn-secondary" data-expr="0 0 * * 1">每周一</button>
      <button class="btn-secondary" data-expr="0 0 1 * *">每月 1 号</button>
      <button class="btn-secondary" data-expr="0 0 * * 1-5">工作日</button>
      <button class="btn-secondary" data-expr="0 0 * * 0,6">每周末</button>
      <button class="btn-secondary" data-expr="0 9 * * 1-5">工作日 9:00</button>
      <button class="btn-secondary" data-expr="0 0 1 1 *">每年 1 月 1 日</button>
    </div>
  </div>

  <div class="section">
    <h2>字段配置</h2>
    <div class="field-row">
      <label class="field-label">分钟</label>
      <select class="field-type" data-field="minute" data-min="0" data-max="59">
        <option value="every">每 ( * )</option>
        <option value="value">具体值</option>
        <option value="range">区间</option>
        <option value="list">列表</option>
        <option value="step">步长</option>
      </select>
      <span class="field-inputs" data-field="minute"></span>
      <span class="field-range" data-field="minute"></span>
    </div>
    <div class="field-row">
      <label class="field-label">小时</label>
      <select class="field-type" data-field="hour" data-min="0" data-max="23">
        <option value="every">每 ( * )</option>
        <option value="value">具体值</option>
        <option value="range">区间</option>
        <option value="list">列表</option>
        <option value="step">步长</option>
      </select>
      <span class="field-inputs" data-field="hour"></span>
      <span class="field-range" data-field="hour"></span>
    </div>
    <div class="field-row">
      <label class="field-label">日</label>
      <select class="field-type" data-field="day" data-min="1" data-max="31">
        <option value="every">每 ( * )</option>
        <option value="value">具体值</option>
        <option value="range">区间</option>
        <option value="list">列表</option>
        <option value="step">步长</option>
      </select>
      <span class="field-inputs" data-field="day"></span>
      <span class="field-range" data-field="day"></span>
    </div>
    <div class="field-row">
      <label class="field-label">月</label>
      <select class="field-type" data-field="month" data-min="1" data-max="12">
        <option value="every">每 ( * )</option>
        <option value="value">具体值</option>
        <option value="range">区间</option>
        <option value="list">列表</option>
        <option value="step">步长</option>
      </select>
      <span class="field-inputs" data-field="month"></span>
      <span class="field-range" data-field="month"></span>
    </div>
    <div class="field-row">
      <label class="field-label">星期</label>
      <select class="field-type" data-field="week" data-min="0" data-max="7">
        <option value="every">每 ( * )</option>
        <option value="value">具体值</option>
        <option value="range">区间</option>
        <option value="list">列表</option>
        <option value="step">步长</option>
      </select>
      <span class="field-inputs" data-field="week"></span>
      <span class="field-range" data-field="week"></span>
    </div>
  </div>

  <div class="section">
    <div class="expr-box">
      <label>生成的 CRON 表达式（分钟 小时 日 月 星期）</label>
      <input type="text" class="expr-input" id="expr" readonly>
      <div class="btn-group">
        <button class="btn-success" onclick="copyExpr()">复制表达式</button>
        <button class="btn-danger" onclick="resetAll()">重置</button>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>表达式描述</h2>
    <div class="desc-box" id="desc">—</div>
  </div>

  <div class="section">
    <h2>下 5 次执行时间</h2>
    <div class="next-times">
      <ul id="next-times">
        <li class="empty">计算中...</li>
      </ul>
    </div>
  </div>
</div>

<script>
var FIELDS = ['minute', 'hour', 'day', 'month', 'week'];
var weekNames = ['日', '一', '二', '三', '四', '五', '六'];

function pad(n) { return String(n).padStart(2, '0'); }

function expandField(field, min, max, isWeek) {
  var result = new Set();
  field = String(field).trim();
  if (field === '*' || field === '') {
    for (var i = min; i <= max; i++) result.add(i);
    return result;
  }
  var parts = field.split(',');
  for (var p = 0; p < parts.length; p++) {
    var part = parts[p].trim();
    if (!part) continue;
    var step = 1;
    var rangePart = part;
    var slashIdx = part.indexOf('/');
    if (slashIdx !== -1) {
      step = parseInt(part.substring(slashIdx + 1));
      rangePart = part.substring(0, slashIdx);
      if (isNaN(step) || step < 1) step = 1;
    }
    var start, end;
    if (rangePart === '*' || rangePart === '') {
      start = min; end = max;
    } else if (rangePart.indexOf('-') !== -1) {
      var ab = rangePart.split('-');
      start = parseInt(ab[0]);
      end = parseInt(ab[1]);
    } else {
      start = parseInt(rangePart);
      if (slashIdx !== -1) { end = max; }
      else { end = start; }
    }
    if (isNaN(start) || isNaN(end)) continue;
    for (var v = start; v <= end; v += step) {
      result.add(v);
    }
  }
  if (isWeek && result.has(7)) {
    result.delete(7);
    result.add(0);
  }
  return result;
}

function renderInputs(field) {
  var select = document.querySelector('.field-type[data-field="' + field + '"]');
  var type = select.value;
  var container = document.querySelector('.field-inputs[data-field="' + field + '"]');
  var rangeEl = document.querySelector('.field-range[data-field="' + field + '"]');
  var min = select.dataset.min;
  var max = select.dataset.max;
  rangeEl.textContent = '范围：' + min + ' - ' + max + (field === 'week' ? '（0 和 7 均为周日）' : '');
  var html = '';
  if (type === 'every') {
    html = '<span class="hint">每</span>';
  } else if (type === 'value') {
    html = '<input type="number" class="v" min="' + min + '" max="' + max + '" placeholder="' + min + '-' + max + '">';
  } else if (type === 'range') {
    html = '<input type="number" class="r-from" min="' + min + '" max="' + max + '" placeholder="起"> <span class="sep">-</span> <input type="number" class="r-to" min="' + min + '" max="' + max + '" placeholder="止">';
  } else if (type === 'list') {
    html = '<input type="text" class="l-val" placeholder="如 0,15,30,45">';
  } else if (type === 'step') {
    html = '<input type="number" class="s-start" min="' + min + '" max="' + max + '" placeholder="起(默认' + min + ')"> <span class="sep">/</span> <input type="number" class="s-step" min="1" placeholder="步长">';
  }
  container.innerHTML = html;
  var inputs = container.querySelectorAll('input');
  for (var k = 0; k < inputs.length; k++) {
    inputs[k].addEventListener('input', update);
  }
  update();
}

function generateField(field) {
  var select = document.querySelector('.field-type[data-field="' + field + '"]');
  var type = select.value;
  var container = document.querySelector('.field-inputs[data-field="' + field + '"]');
  var min = parseInt(select.dataset.min);
  var max = parseInt(select.dataset.max);
  if (type === 'every') return '*';
  if (type === 'value') {
    var v = container.querySelector('.v').value;
    return v !== '' ? v : String(min);
  }
  if (type === 'range') {
    var from = container.querySelector('.r-from').value;
    var to = container.querySelector('.r-to').value;
    return (from || min) + '-' + (to || max);
  }
  if (type === 'list') {
    var val = container.querySelector('.l-val').value.trim();
    return val || '*';
  }
  if (type === 'step') {
    var start = container.querySelector('.s-start').value;
    var step = container.querySelector('.s-step').value;
    var s = start !== '' ? start : min;
    var st = step !== '' ? step : 1;
    if (String(s) === String(min)) return '*/' + st;
    return s + '/' + st;
  }
  return '*';
}

function setFieldUI(field, value) {
  var select = document.querySelector('.field-type[data-field="' + field + '"]');
  var min = select.dataset.min;
  var max = select.dataset.max;
  var m;
  if (value === '*') {
    select.value = 'every';
    renderInputs(field);
  } else if ((m = value.match(/^\*\/(\d+)$/))) {
    select.value = 'step';
    renderInputs(field);
    var c = document.querySelector('.field-inputs[data-field="' + field + '"]');
    c.querySelector('.s-step').value = m[1];
  } else if ((m = value.match(/^(\d+)-(\d+)\/(\d+)$/))) {
    select.value = 'step';
    renderInputs(field);
    var c2 = document.querySelector('.field-inputs[data-field="' + field + '"]');
    c2.querySelector('.s-start').value = m[1];
    c2.querySelector('.s-step').value = m[3];
  } else if ((m = value.match(/^(\d+)\/(\d+)$/))) {
    select.value = 'step';
    renderInputs(field);
    var c3 = document.querySelector('.field-inputs[data-field="' + field + '"]');
    c3.querySelector('.s-start').value = m[1];
    c3.querySelector('.s-step').value = m[2];
  } else if ((m = value.match(/^(\d+)-(\d+)$/))) {
    select.value = 'range';
    renderInputs(field);
    var c4 = document.querySelector('.field-inputs[data-field="' + field + '"]');
    c4.querySelector('.r-from').value = m[1];
    c4.querySelector('.r-to').value = m[2];
  } else if (value.indexOf(',') !== -1) {
    select.value = 'list';
    renderInputs(field);
    var c5 = document.querySelector('.field-inputs[data-field="' + field + '"]');
    c5.querySelector('.l-val').value = value;
  } else if (/^\d+$/.test(value)) {
    select.value = 'value';
    renderInputs(field);
    var c6 = document.querySelector('.field-inputs[data-field="' + field + '"]');
    c6.querySelector('.v').value = value;
  } else {
    select.value = 'list';
    renderInputs(field);
    var c7 = document.querySelector('.field-inputs[data-field="' + field + '"]');
    c7.querySelector('.l-val').value = value;
  }
}

function applyExpression(expr) {
  var parts = expr.trim().split(/\s+/);
  if (parts.length !== 5) return;
  for (var i = 0; i < FIELDS.length; i++) {
    setFieldUI(FIELDS[i], parts[i]);
  }
  update();
}

function describeCron(expr) {
  var fields = expr.trim().split(/\s+/);
  if (fields.length !== 5) return '表达式格式不正确（需要 5 个字段）';
  var minF = fields[0], hourF = fields[1], dayF = fields[2], monthF = fields[3], weekF = fields[4];
  var isEveryMin = minF === '*';
  var isEveryHour = hourF === '*';
  var isEveryDay = dayF === '*';
  var isEveryMonth = monthF === '*';
  var isEveryWeek = weekF === '*';

  var timeStr;
  var m;
  if (isEveryMin && isEveryHour) {
    timeStr = '每分钟';
  } else if (minF === '0' && isEveryHour) {
    timeStr = '每小时整点';
  } else if ((m = minF.match(/^\*\/(\d+)$/)) && isEveryHour) {
    timeStr = '每 ' + m[1] + ' 分钟';
  } else if (isEveryMin && !isEveryHour) {
    var mh = hourF.match(/^\*\/(\d+)$/);
    if (mh) {
      timeStr = '每 ' + mh[1] + ' 小时的每分钟';
    } else {
      var hs = Array.from(expandField(hourF, 0, 23)).sort(function (a, b) { return a - b; }).map(pad);
      timeStr = hs.join('、') + ' 点的每分钟';
    }
  } else if (!isEveryMin && !isEveryHour) {
    var hs2 = Array.from(expandField(hourF, 0, 23)).sort(function (a, b) { return a - b; });
    var ms2 = Array.from(expandField(minF, 0, 59)).sort(function (a, b) { return a - b; });
    if (hs2.length === 1 && ms2.length === 1) {
      timeStr = pad(hs2[0]) + ':' + pad(ms2[0]);
    } else {
      var times = [];
      hs2.forEach(function (h) { ms2.forEach(function (mm) { times.push(pad(h) + ':' + pad(mm)); }); });
      timeStr = times.join('、');
    }
  } else {
    var ms3 = Array.from(expandField(minF, 0, 59)).sort(function (a, b) { return a - b; });
    timeStr = '每小时的第 ' + ms3.join('、') + ' 分钟';
  }

  var schedParts = [];
  if (!isEveryWeek) {
    var days = Array.from(expandField(weekF, 0, 7, true)).sort(function (a, b) {
      var oa = a === 0 ? 7 : a;
      var ob = b === 0 ? 7 : b;
      return oa - ob;
    });
    schedParts.push('每' + days.map(function (d) { return '周' + weekNames[d]; }).join('、'));
  }
  if (!isEveryDay) {
    schedParts.push('每月 ' + dayF + ' 日');
  }
  if (!isEveryMonth) {
    schedParts.push(monthF + ' 月');
  }
  var schedStr = schedParts.join('，');

  if (isEveryDay && isEveryMonth && isEveryWeek) {
    if (timeStr === '每分钟') return '每分钟执行';
    if (timeStr === '每小时整点') return '每小时整点执行';
    return '每天 ' + timeStr + ' 执行';
  } else {
    if (timeStr === '每分钟') {
      return (schedStr ? schedStr + '，' : '') + '每分钟执行';
    }
    return (schedStr ? schedStr + ' ' : '') + timeStr + ' 执行';
  }
}

function getNextTimes(expr, count) {
  var parts = expr.trim().split(/\s+/);
  if (parts.length !== 5) return [];
  var minF = parts[0], hourF = parts[1], dayF = parts[2], monthF = parts[3], weekF = parts[4];
  var minSet = expandField(minF, 0, 59);
  var hourSet = expandField(hourF, 0, 23);
  var daySet = expandField(dayF, 1, 31);
  var monthSet = expandField(monthF, 1, 12);
  var weekSet = expandField(weekF, 0, 7, true);

  var dayRestricted = dayF !== '*';
  var weekRestricted = weekF !== '*';

  var results = [];
  var d = new Date();
  d.setSeconds(0, 0);
  d.setMinutes(d.getMinutes() + 1);

  var iter = 0;
  var maxIter = 50000;
  while (results.length < count && iter < maxIter) {
    iter++;
    var month = d.getMonth() + 1;
    if (!monthSet.has(month)) {
      d.setMonth(d.getMonth() + 1, 1);
      d.setHours(0, 0, 0, 0);
      continue;
    }
    var day = d.getDate();
    var week = d.getDay();
    var dayOk;
    if (dayRestricted && weekRestricted) dayOk = daySet.has(day) || weekSet.has(week);
    else if (dayRestricted) dayOk = daySet.has(day);
    else if (weekRestricted) dayOk = weekSet.has(week);
    else dayOk = true;
    if (!dayOk) {
      d.setDate(d.getDate() + 1);
      d.setHours(0, 0, 0, 0);
      continue;
    }
    var h = d.getHours();
    if (!hourSet.has(h)) {
      d.setHours(d.getHours() + 1, 0, 0, 0);
      continue;
    }
    var mm = d.getMinutes();
    if (!minSet.has(mm)) {
      d.setMinutes(d.getMinutes() + 1, 0, 0);
      continue;
    }
    results.push(new Date(d));
    d.setMinutes(d.getMinutes() + 1, 0);
  }
  return results;
}

function formatDate(d) {
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' +
    pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + ' 周' + weekNames[d.getDay()];
}

function update() {
  var parts = FIELDS.map(generateField);
  var expr = parts.join(' ');
  document.getElementById('expr').value = expr;
  document.getElementById('desc').textContent = describeCron(expr);
  try {
    var times = getNextTimes(expr, 5);
    var list = document.getElementById('next-times');
    if (times.length === 0) {
      list.innerHTML = '<li class="empty">未找到执行时间（可能日期不存在，如 2 月 30 日）</li>';
    } else {
      list.innerHTML = times.map(function (t, idx) {
        return '<li>' + (idx + 1) + '. ' + formatDate(t) + '</li>';
      }).join('');
    }
  } catch (e) {
    document.getElementById('next-times').innerHTML = '<li class="empty">表达式无效</li>';
  }
}

function copyExpr() {
  var val = document.getElementById('expr').value;
  if (!val) return;
  navigator.clipboard.writeText(val).then(function () {
    alert('已复制：' + val);
  }).catch(function () {
    var el = document.getElementById('expr');
    el.select();
    document.execCommand('copy');
    alert('已复制：' + val);
  });
}

function resetAll() {
  FIELDS.forEach(function (f) {
    var sel = document.querySelector('.field-type[data-field="' + f + '"]');
    sel.value = 'every';
    renderInputs(f);
  });
}

FIELDS.forEach(function (f) {
  var sel = document.querySelector('.field-type[data-field="' + f + '"]');
  sel.addEventListener('change', function () { renderInputs(f); });
  renderInputs(f);
});

document.querySelectorAll('.presets button').forEach(function (btn) {
  btn.addEventListener('click', function () {
    applyExpression(btn.dataset.expr);
  });
});

update();
</script>
</body>
</html>
