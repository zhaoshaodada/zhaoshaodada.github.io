<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字符统计工具 - 在线工具</title>
<meta name="description" content="在线字符统计工具，实时统计总字符数、不含空格字符数、中文字数、英文单词数、行数、段落数、UTF-8 字节数，纯前端实现">
<meta name="keywords" content="字符统计,字数统计,中文字数,字节统计,在线工具">
<meta property="og:title" content="字符统计工具 - 在线工具">
<meta property="og:description" content="在线字符统计工具，实时统计总字符数、中文字数、英文单词数、行数、段落数、UTF-8 字节数">
<meta property="og:type" content="website">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #f5f5f5;
  min-height: 100vh;
  padding: 20px;
}
.container {
  max-width: 900px;
  margin: 0 auto;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  padding: 30px;
}
.back-link {
  display: inline-block;
  margin-bottom: 20px;
  color: #49b1f5;
  text-decoration: none;
  font-size: 14px;
}
.back-link:hover { text-decoration: underline; }
h1 {
  font-size: 24px;
  margin-bottom: 20px;
  color: #333;
}
.textarea-group {
  margin-bottom: 16px;
}
label {
  display: block;
  font-size: 14px;
  color: #666;
  margin-bottom: 8px;
}
textarea {
  width: 100%;
  min-height: 220px;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 14px;
  font-family: Consolas, Monaco, monospace;
  resize: vertical;
  line-height: 1.6;
}
textarea:focus {
  outline: none;
  border-color: #49b1f5;
}
.btn-group {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
button {
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-primary {
  background: #49b1f5;
  color: #fff;
}
.btn-primary:hover { background: #3aa0e4; }
.btn-secondary {
  background: #f0f0f0;
  color: #333;
}
.btn-secondary:hover { background: #e0e0e0; }
.btn-danger {
  background: #ff4d4f;
  color: #fff;
}
.btn-danger:hover { background: #e84143; }
.result-area {
  margin-top: 20px;
}
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
}
.stat-card {
  background: #fafafa;
  border: 1px solid #eee;
  border-radius: 8px;
  padding: 16px;
  text-align: center;
  transition: all 0.2s;
}
.stat-card:hover {
  border-color: #49b1f5;
  background: #f0f9ff;
}
.stat-label {
  font-size: 13px;
  color: #999;
  margin-bottom: 8px;
}
.stat-value {
  font-size: 24px;
  color: #49b1f5;
  font-weight: 600;
  font-family: Consolas, Monaco, monospace;
}
.msg {
  padding: 10px 16px;
  border-radius: 6px;
  margin-bottom: 12px;
  font-size: 14px;
  display: none;
}
.msg.error { background: #fff2f0; color: #ff4d4f; border: 1px solid #ffccc7; display: block; }
.msg.success { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; display: block; }
@media (max-width: 600px) {
  .container { padding: 20px; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .stat-value { font-size: 20px; }
}
</style>
</head>
<body>
<div class="container">
  <a href="/tools/" class="back-link">← 返回工具列表</a>
  <h1>字符统计工具</h1>

  <div id="msg" class="msg"></div>

  <div class="textarea-group">
    <label>输入文本：</label>
    <textarea id="input" placeholder="在此输入或粘贴文本进行统计..." oninput="count()"></textarea>
  </div>

  <div class="btn-group">
    <button class="btn-danger" onclick="clearAll()">清空</button>
  </div>

  <div class="result-area">
    <label>统计结果：</label>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">总字符数</div>
        <div class="stat-value" id="total">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">不含空格字符数</div>
        <div class="stat-value" id="no-space">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">中文字数</div>
        <div class="stat-value" id="chinese">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">英文单词数</div>
        <div class="stat-value" id="words">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">行数</div>
        <div class="stat-value" id="lines">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">段落数</div>
        <div class="stat-value" id="paragraphs">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">字节数 (UTF-8)</div>
        <div class="stat-value" id="bytes">0</div>
      </div>
    </div>
  </div>
</div>

<script>
function showMsg(text, type) {
  const msg = document.getElementById('msg');
  msg.textContent = text;
  msg.className = 'msg ' + type;
}
function hideMsg() {
  document.getElementById('msg').className = 'msg';
}

function count() {
  const text = document.getElementById('input').value;

  // 总字符数
  const total = text.length;

  // 不含空格字符数
  const noSpace = text.replace(/\s/g, '').length;

  // 中文字数（含中文标点会单独判断，这里只算汉字）
  const chineseMatches = text.match(/[\u4e00-\u9fa5]/g);
  const chinese = chineseMatches ? chineseMatches.length : 0;

  // 英文单词数
  const wordMatches = text.match(/[a-zA-Z]+/g);
  const words = wordMatches ? wordMatches.length : 0;

  // 行数
  const lines = text === '' ? 0 : text.split(/\r\n|\r|\n/).length;

  // 段落数（以一个或多个空行分隔）
  let paragraphs = 0;
  const trimmed = text.trim();
  if (trimmed.length > 0) {
    paragraphs = trimmed.split(/\n\s*\n/).filter(p => p.trim().length > 0).length;
  }

  // UTF-8 字节数
  let bytes = 0;
  for (let i = 0; i < text.length; i++) {
    const code = text.charCodeAt(i);
    if (code <= 0x7f) {
      bytes += 1;
    } else if (code <= 0x7ff) {
      bytes += 2;
    } else if (code >= 0xd800 && code <= 0xdbff) {
      // 代理对（超出 BMP 的字符，如部分 emoji）
      bytes += 4;
      i++; // 跳过低位代理
    } else {
      bytes += 3;
    }
  }

  document.getElementById('total').textContent = total;
  document.getElementById('no-space').textContent = noSpace;
  document.getElementById('chinese').textContent = chinese;
  document.getElementById('words').textContent = words;
  document.getElementById('lines').textContent = lines;
  document.getElementById('paragraphs').textContent = paragraphs;
  document.getElementById('bytes').textContent = bytes;
}

function clearAll() {
  document.getElementById('input').value = '';
  count();
  hideMsg();
}

// 初始化统计
count();
</script>
</body>
</html>
