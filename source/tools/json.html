<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON 格式化 - 在线工具</title>
<meta name="description" content="在线 JSON 格式化、压缩、校验工具，纯前端实现">
<meta name="keywords" content="JSON, 格式化, 压缩, 校验, JSON工具, 在线工具">
<meta property="og:title" content="JSON 格式化 - 在线工具">
<meta property="og:description" content="在线 JSON 格式化、压缩、校验工具，支持错误定位，纯前端实现">
<meta property="og:type" content="website">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #f5f5f5;
  min-height: 100vh;
  padding: 20px;
}
.container {
  max-width: 1100px;
  margin: 0 auto;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  padding: 30px;
}
.back-link {
  display: inline-block;
  margin-bottom: 20px;
  color: #49b1f5;
  text-decoration: none;
  font-size: 14px;
}
.back-link:hover { text-decoration: underline; }
h1 {
  font-size: 24px;
  margin-bottom: 20px;
  color: #333;
}
.panels {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 20px;
}
@media (max-width: 768px) {
  .panels { grid-template-columns: 1fr; }
}
.panel {
  display: flex;
  flex-direction: column;
}
.panel label {
  font-size: 14px;
  color: #666;
  margin-bottom: 8px;
  font-weight: 500;
}
textarea {
  width: 100%;
  min-height: 350px;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 13px;
  font-family: Consolas, Monaco, monospace;
  resize: vertical;
  line-height: 1.5;
}
textarea:focus {
  outline: none;
  border-color: #49b1f5;
}
.btn-group {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
button {
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-primary { background: #49b1f5; color: #fff; }
.btn-primary:hover { background: #3aa0e4; }
.btn-success { background: #52c41a; color: #fff; }
.btn-success:hover { background: #45b016; }
.btn-warning { background: #faad14; color: #fff; }
.btn-warning:hover { background: #e89c0c; }
.btn-danger { background: #ff4d4f; color: #fff; }
.btn-danger:hover { background: #e84143; }
.btn-secondary { background: #f0f0f0; color: #333; }
.btn-secondary:hover { background: #e0e0e0; }
.msg {
  padding: 10px 16px;
  border-radius: 6px;
  margin-bottom: 12px;
  font-size: 14px;
  display: none;
}
.msg.error { background: #fff2f0; color: #ff4d4f; border: 1px solid #ffccc7; display: block; }
.msg.success { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; display: block; }
.indent-control {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
  font-size: 14px;
  color: #666;
}
.indent-control select {
  padding: 4px 8px;
  border: 1px solid #ddd;
  border-radius: 4px;
  font-size: 13px;
}
</style>
</head>
<body>
<div class="container">
  <a href="/tools/" class="back-link">← 返回工具列表</a>
  <h1>JSON 格式化 / 压缩</h1>

  <div id="msg" class="msg"></div>

  <div class="indent-control">
    <label>缩进：</label>
    <select id="indent">
      <option value="2">2 个空格</option>
      <option value="4">4 个空格</option>
      <option value="tab">Tab</option>
    </select>
  </div>

  <div class="panels">
    <div class="panel">
      <label>输入 JSON：</label>
      <textarea id="input" placeholder='请输入 JSON，例如：{"name":"张三","age":25}'></textarea>
    </div>
    <div class="panel">
      <label>结果：</label>
      <textarea id="output" readonly placeholder="格式化/压缩结果将显示在这里..."></textarea>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn-primary" onclick="formatJson()">格式化</button>
    <button class="btn-warning" onclick="compressJson()">压缩</button>
    <button class="btn-success" onclick="checkJson()">校验</button>
    <button class="btn-secondary" onclick="copyOutput()">复制</button>
    <button class="btn-secondary" onclick="swapContent()">交换</button>
    <button class="btn-danger" onclick="clearAll()">清空</button>
  </div>
</div>

<script>
function showMsg(text, type) {
  const msg = document.getElementById('msg');
  msg.textContent = text;
  msg.className = 'msg ' + type;
  setTimeout(() => { msg.className = 'msg'; }, 3000);
}

function getIndent() {
  const val = document.getElementById('indent').value;
  return val === 'tab' ? '\t' : parseInt(val);
}

function parseInput() {
  const input = document.getElementById('input').value.trim();
  if (!input) { showMsg('请输入 JSON 内容', 'error'); return null; }
  try {
    return JSON.parse(input);
  } catch (e) {
    const lines = input.split('\n');
    const match = e.message.match(/position (\d+)/);
    let lineInfo = '';
    if (match) {
      let pos = parseInt(match[1]);
      let line = 1, col = 1, count = 0;
      for (let i = 0; i < pos && i < input.length; i++) {
        if (input[i] === '\n') { line++; col = 1; } else { col++; }
      }
      lineInfo = `（第 ${line} 行，第 ${col} 列）`;
    }
    showMsg('JSON 格式错误：' + e.message + lineInfo, 'error');
    return null;
  }
}

function formatJson() {
  const obj = parseInput();
  if (obj === null) return;
  const result = JSON.stringify(obj, null, getIndent());
  document.getElementById('output').value = result;
  showMsg('格式化成功', 'success');
}

function compressJson() {
  const obj = parseInput();
  if (obj === null) return;
  const result = JSON.stringify(obj);
  document.getElementById('output').value = result;
  showMsg('压缩成功', 'success');
}

function checkJson() {
  const obj = parseInput();
  if (obj !== null) {
    showMsg('JSON 格式正确 ✓', 'success');
  }
}

function copyOutput() {
  const val = document.getElementById('output').value;
  if (!val) { showMsg('没有可复制的内容', 'error'); return; }
  navigator.clipboard.writeText(val).then(() => {
    showMsg('已复制到剪贴板', 'success');
  }).catch(() => {
    const el = document.getElementById('output');
    el.select();
    document.execCommand('copy');
    showMsg('已复制到剪贴板', 'success');
  });
}

function swapContent() {
  const input = document.getElementById('input');
  const output = document.getElementById('output');
  const temp = input.value;
  input.value = output.value;
  output.value = temp;
}

function clearAll() {
  document.getElementById('input').value = '';
  document.getElementById('output').value = '';
  document.getElementById('msg').className = 'msg';
}
</script>
</body>
</html>
