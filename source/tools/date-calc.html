<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="日期计算器工具，计算两个日期之间的天数、工作日数，支持日期加减天数计算。">
  <meta name="keywords" content="日期计算器,天数计算,工作日计算,日期加减">
  <meta property="og:title" content="日期计算器工具">
  <meta property="og:description" content="计算两个日期之间的天数和工作日数">
  <title>日期计算器工具</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      padding: 40px;
      max-width: 600px;
      width: 100%;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 8px;
      font-size: 28px;
    }
    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .tabs {
      display: flex;
      margin-bottom: 25px;
      border-bottom: 2px solid #eee;
    }
    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      font-weight: 500;
      color: #666;
      border-bottom: 2px solid transparent;
      transition: all 0.3s;
    }
    .tab.active {
      color: #11998e;
      border-bottom-color: #11998e;
    }
    .input-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #555;
    }
    input[type="date"] {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s;
    }
    input[type="date"]:focus {
      border-color: #11998e;
    }
    input[type="number"] {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s;
    }
    input[type="number"]:focus {
      border-color: #11998e;
    }
    .calc-type {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
    }
    .radio-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .radio-btn.active {
      border-color: #11998e;
      background: #e8f8f5;
      color: #11998e;
    }
    .btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
    }
    .btn:active {
      transform: translateY(0);
    }
    .result-box {
      margin-top: 25px;
      display: none;
    }
    .result-item {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 15px;
    }
    .result-title {
      color: #666;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .result-value {
      font-size: 28px;
      font-weight: 600;
      color: #11998e;
    }
    .result-sub {
      font-size: 14px;
      color: #888;
      margin-top: 5px;
    }
    .date-info {
      font-size: 16px;
      color: #333;
      line-height: 1.8;
    }
    .tip {
      margin-top: 20px;
      padding: 15px;
      background: #e8f8f5;
      border-radius: 8px;
      border-left: 4px solid #11998e;
      font-size: 14px;
      color: #0d7d70;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📅 日期计算器</h1>
    <p class="subtitle">计算两个日期之间的天数和工作日数，支持日期加减</p>
    
    <div class="tabs">
      <div class="tab active" data-tab="diff">日期差</div>
      <div class="tab" data-tab="add">日期加减</div>
    </div>
    
    <div id="tab-diff" class="tab-content">
      <div class="input-group">
        <label>开始日期：</label>
        <input type="date" id="startDate">
      </div>
      <div class="input-group">
        <label>结束日期：</label>
        <input type="date" id="endDate">
      </div>
      <button class="btn" onclick="calcDiff()">计算日期差</button>
    </div>
    
    <div id="tab-add" class="tab-content" style="display: none;">
      <div class="input-group">
        <label>基准日期：</label>
        <input type="date" id="baseDate">
      </div>
      <div class="input-group">
        <label>天数：</label>
        <input type="number" id="daysNum" placeholder="正数加，负数减" value="1">
      </div>
      <div class="calc-type">
        <div class="radio-btn active" data-type="all">所有天数</div>
        <div class="radio-btn" data-type="work">仅工作日</div>
      </div>
      <button class="btn" onclick="calcAdd()">计算结果</button>
    </div>
    
    <div class="result-box" id="resultBox">
      <div id="diffResult"></div>
      <div id="addResult"></div>
    </div>
    
    <div class="tip">
      💡 提示：工作日计算默认排除周六、周日，不考虑节假日。日期差包含起始日期和结束日期。
    </div>
  </div>

  <script>
    var tabs = document.querySelectorAll('.tab');
    tabs.forEach(function(tab) {
      tab.addEventListener('click', function() {
        tabs.forEach(function(t) { t.classList.remove('active'); });
        tab.classList.add('active');
        
        var target = tab.dataset.tab;
        document.querySelectorAll('.tab-content').forEach(function(c) { c.style.display = 'none'; });
        document.getElementById('tab-' + target).style.display = 'block';
        
        document.getElementById('resultBox').style.display = 'none';
      });
    });
    
    var radioBtns = document.querySelectorAll('.radio-btn');
    radioBtns.forEach(function(btn) {
      btn.addEventListener('click', function() {
        radioBtns.forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
      });
    });
    
    document.getElementById('startDate').valueAsDate = new Date();
    document.getElementById('endDate').valueAsDate = new Date();
    document.getElementById('baseDate').valueAsDate = new Date();
    
    function calcDiff() {
      var start = new Date(document.getElementById('startDate').value);
      var end = new Date(document.getElementById('endDate').value);
      
      if (isNaN(start.getTime()) || isNaN(end.getTime())) {
        alert('请选择有效的日期');
        return;
      }
      
      var diffTime = Math.abs(end.getTime() - start.getTime());
      var diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
      
      var workDays = 0;
      var current = new Date(start);
      while (current <= end) {
        var day = current.getDay();
        if (day !== 0 && day !== 6) {
          workDays++;
        }
        current.setDate(current.getDate() + 1);
      }
      
      var weeks = Math.floor((diffDays - 1) / 7);
      var remainingDays = (diffDays - 1) % 7;
      
      document.getElementById('diffResult').innerHTML = `
        <div class="result-item">
          <div class="result-title">总天数</div>
          <div class="result-value">${diffDays} <span style="font-size: 16px; font-weight: normal;">天</span></div>
        </div>
        <div class="result-item">
          <div class="result-title">工作日</div>
          <div class="result-value">${workDays} <span style="font-size: 16px; font-weight: normal;">天</span></div>
        </div>
        <div class="result-item">
          <div class="result-title">周数</div>
          <div class="date-info">${weeks} 周 ${remainingDays} 天</div>
        </div>
      `;
      document.getElementById('addResult').innerHTML = '';
      document.getElementById('resultBox').style.display = 'block';
    }
    
    function calcAdd() {
      var base = new Date(document.getElementById('baseDate').value);
      var days = parseInt(document.getElementById('daysNum').value);
      var type = document.querySelector('.radio-btn.active').dataset.type;
      
      if (isNaN(base.getTime())) {
        alert('请选择有效的日期');
        return;
      }
      if (isNaN(days)) {
        alert('请输入有效的天数');
        return;
      }
      
      var result = new Date(base);
      
      if (type === 'work') {
        var count = 0;
        var direction = days > 0 ? 1 : -1;
        var absDays = Math.abs(days);
        
        while (count < absDays) {
          result.setDate(result.getDate() + direction);
          var day = result.getDay();
          if (day !== 0 && day !== 6) {
            count++;
          }
        }
      } else {
        result.setDate(result.getDate() + days);
      }
      
      var weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      var month = result.getMonth() + 1;
      var date = result.getDate();
      var weekDay = weekDays[result.getDay()];
      
      document.getElementById('addResult').innerHTML = `
        <div class="result-item">
          <div class="result-title">计算结果</div>
          <div class="result-value">${result.getFullYear()}年${month}月${date}日</div>
          <div class="result-sub">${weekDay}</div>
        </div>
      `;
      document.getElementById('diffResult').innerHTML = '';
      document.getElementById('resultBox').style.display = 'block';
    }
  </script>
</body>
</html>
