<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown 编辑器 - 在线工具</title>
<meta name="description" content="在线 Markdown 编辑器，左侧编辑右侧实时预览，支持标题/加粗/链接/代码块/表格/列表等，可导出 HTML，引用 marked CDN 渲染">
<meta name="keywords" content="Markdown,编辑器,Markdown预览,Markdown转HTML,在线Markdown,marked,实时预览">
<meta property="og:title" content="Markdown 编辑器 - 在线工具">
<meta property="og:description" content="在线 Markdown 编辑器，实时预览，支持导出 HTML">
<meta property="og:type" content="website">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #f5f5f5;
  min-height: 100vh;
  padding: 20px;
}
.container {
  max-width: 1100px;
  margin: 0 auto;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  padding: 30px;
}
.back-link {
  display: inline-block;
  margin-bottom: 20px;
  color: #49b1f5;
  text-decoration: none;
  font-size: 14px;
}
.back-link:hover { text-decoration: underline; }
h1 {
  font-size: 24px;
  margin-bottom: 20px;
  color: #333;
}
.toolbar {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 12px;
  padding: 8px;
  background: #f6f8fa;
  border-radius: 8px;
}
.tool-btn {
  padding: 6px 12px;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 4px;
  font-size: 13px;
  cursor: pointer;
  color: #333;
  transition: all 0.2s;
  font-family: Consolas, Monaco, monospace;
}
.tool-btn:hover {
  background: #49b1f5;
  color: #fff;
  border-color: #49b1f5;
}
.editor-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 16px;
}
.pane {
  border: 1px solid #ddd;
  border-radius: 8px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 420px;
}
.pane-title {
  padding: 8px 14px;
  background: #f6f8fa;
  font-size: 13px;
  color: #666;
  border-bottom: 1px solid #eee;
}
textarea {
  flex: 1;
  width: 100%;
  padding: 14px;
  border: none;
  font-size: 14px;
  font-family: Consolas, Monaco, monospace;
  resize: none;
  line-height: 1.7;
  outline: none;
}
.pane.preview .preview-body {
  flex: 1;
  padding: 14px 18px;
  overflow: auto;
  font-size: 14px;
  line-height: 1.7;
  color: #333;
}
.btn-group {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
button {
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-primary { background: #49b1f5; color: #fff; }
.btn-primary:hover { background: #3aa0e4; }
.btn-secondary { background: #f0f0f0; color: #333; }
.btn-secondary:hover { background: #e0e0e0; }
.btn-success { background: #52c41a; color: #fff; }
.btn-success:hover { background: #45b016; }
.btn-danger { background: #ff4d4f; color: #fff; }
.btn-danger:hover { background: #e84143; }
.msg {
  padding: 10px 16px;
  border-radius: 6px;
  margin-bottom: 12px;
  font-size: 14px;
  display: none;
}
.msg.error { background: #fff2f0; color: #ff4d4f; border: 1px solid #ffccc7; display: block; }
.msg.success { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; display: block; }
.preview-body h1 { font-size: 24px; margin: 14px 0 10px; color: #333; }
.preview-body h2 { font-size: 20px; margin: 14px 0 10px; color: #333; }
.preview-body h3 { font-size: 17px; margin: 12px 0 8px; color: #333; }
.preview-body p { margin: 8px 0; }
.preview-body ul, .preview-body ol { margin: 8px 0; padding-left: 24px; }
.preview-body blockquote {
  border-left: 4px solid #49b1f5;
  padding: 4px 12px;
  margin: 8px 0;
  color: #666;
  background: #f6f8fa;
}
.preview-body code {
  background: #f0f0f0;
  padding: 2px 6px;
  border-radius: 4px;
  font-family: Consolas, Monaco, monospace;
  font-size: 13px;
}
.preview-body pre {
  background: #f6f8fa;
  padding: 12px;
  border-radius: 6px;
  overflow-x: auto;
  margin: 8px 0;
}
.preview-body pre code {
  background: none;
  padding: 0;
}
.preview-body a { color: #49b1f5; }
.preview-body img { max-width: 100%; border-radius: 4px; }
.preview-body table {
  border-collapse: collapse;
  margin: 8px 0;
  width: 100%;
}
.preview-body th, .preview-body td {
  border: 1px solid #ddd;
  padding: 6px 12px;
}
.preview-body th { background: #f6f8fa; }
.preview-body hr {
  border: none;
  border-top: 1px solid #eee;
  margin: 12px 0;
}
@media (max-width: 700px) {
  .editor-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="container">
  <a href="/tools/" class="back-link">← 返回工具列表</a>
  <h1>Markdown 编辑器</h1>

  <div id="msg" class="msg"></div>

  <div class="toolbar">
    <button class="tool-btn" data-action="h1">H1</button>
    <button class="tool-btn" data-action="h2">H2</button>
    <button class="tool-btn" data-action="h3">H3</button>
    <button class="tool-btn" data-action="bold">粗体</button>
    <button class="tool-btn" data-action="italic">斜体</button>
    <button class="tool-btn" data-action="link">链接</button>
    <button class="tool-btn" data-action="image">图片</button>
    <button class="tool-btn" data-action="code">行内代码</button>
    <button class="tool-btn" data-action="codeblock">代码块</button>
    <button class="tool-btn" data-action="ul">无序列表</button>
    <button class="tool-btn" data-action="ol">有序列表</button>
    <button class="tool-btn" data-action="quote">引用</button>
    <button class="tool-btn" data-action="table">表格</button>
    <button class="tool-btn" data-action="hr">分割线</button>
  </div>

  <div class="editor-grid">
    <div class="pane">
      <div class="pane-title">Markdown 输入</div>
      <textarea id="editor" placeholder="请输入 Markdown..."># 欢迎使用 Markdown 编辑器

这是一段 **加粗** 文本和 *斜体* 文本。

- 列表项 1
- 列表项 2

> 这是一段引用

\`\`\`javascript
console.log('Hello World');
\`\`\`

[链接示例](https://example.com)</textarea>
    </div>
    <div class="pane preview">
      <div class="pane-title">实时预览</div>
      <div class="preview-body" id="preview"></div>
    </div>
  </div>

  <div class="btn-group">
    <button class="btn-success" onclick="exportHtml()">导出 HTML</button>
    <button class="btn-secondary" onclick="copyHtml()">复制 HTML</button>
    <button class="btn-danger" onclick="clearAll()">清空</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
const editor = document.getElementById('editor');
const preview = document.getElementById('preview');

function render() {
  const md = editor.value;
  try {
    preview.innerHTML = marked.parse(md);
  } catch (e) {
    preview.innerHTML = '<p style="color:#ff4d4f;">渲染错误：' + e.message + '</p>';
  }
}
editor.addEventListener('input', render);

function showMsg(text, type) {
  const msg = document.getElementById('msg');
  msg.textContent = text;
  msg.className = 'msg ' + type;
}
function hideMsg() {
  document.getElementById('msg').className = 'msg';
}

function wrapSelection(before, after, placeholder) {
  const start = editor.selectionStart;
  const end = editor.selectionEnd;
  const text = editor.value;
  const selected = text.substring(start, end) || placeholder;
  const newText = text.substring(0, start) + before + selected + after + text.substring(end);
  editor.value = newText;
  const cursorStart = start + before.length;
  editor.focus();
  editor.setSelectionRange(cursorStart, cursorStart + selected.length);
  render();
}

function insertLine(text) {
  const start = editor.selectionStart;
  const text2 = editor.value;
  const before = text2.substring(0, start);
  const needNewline = before.length > 0 && !before.endsWith('\n');
  const insert = (needNewline ? '\n' : '') + text + '\n';
  editor.value = before + insert + text2.substring(start);
  editor.focus();
  editor.setSelectionRange(start + insert.length, start + insert.length);
  render();
}

const actions = {
  h1: () => wrapSelection('# ', '', '标题'),
  h2: () => wrapSelection('## ', '', '标题'),
  h3: () => wrapSelection('### ', '', '标题'),
  bold: () => wrapSelection('**', '**', '加粗'),
  italic: () => wrapSelection('*', '*', '斜体'),
  link: () => wrapSelection('[', '](https://)', '链接文本'),
  image: () => wrapSelection('![', '](https://)', '图片描述'),
  code: () => wrapSelection('`', '`', 'code'),
  codeblock: () => wrapSelection('\n```\n', '\n```\n', 'code here'),
  ul: () => insertLine('- 列表项'),
  ol: () => insertLine('1. 列表项'),
  quote: () => insertLine('> 引用内容'),
  hr: () => insertLine('---'),
  table: () => insertLine('| 列1 | 列2 | 列3 |\n| --- | --- | --- |\n| A | B | C |')
};

document.querySelectorAll('.tool-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    const action = this.dataset.action;
    if (actions[action]) actions[action]();
  });
});

function buildFullHtml() {
  const inner = preview.innerHTML;
  return '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="UTF-8">\n<title>Markdown 导出</title>\n<style>' +
    'body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;max-width:760px;margin:40px auto;padding:0 20px;color:#333;line-height:1.7;}' +
    'code{background:#f0f0f0;padding:2px 6px;border-radius:4px;font-family:Consolas,Monaco,monospace;}' +
    'pre{background:#f6f8fa;padding:12px;border-radius:6px;overflow-x:auto;}' +
    'pre code{background:none;padding:0;}' +
    'blockquote{border-left:4px solid #49b1f5;padding:4px 12px;color:#666;background:#f6f8fa;margin:8px 0;}' +
    'a{color:#49b1f5;}img{max-width:100%;}' +
    'table{border-collapse:collapse;width:100%;}th,td{border:1px solid #ddd;padding:6px 12px;}th{background:#f6f8fa;}' +
    'hr{border:none;border-top:1px solid #eee;margin:12px 0;}' +
    '</style>\n</head>\n<body>\n' + inner + '\n</body>\n</html>';
}

function exportHtml() {
  if (!editor.value.trim()) { showMsg('没有可导出的内容', 'error'); return; }
  hideMsg();
  const fullHtml = buildFullHtml();
  const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'markdown-export.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showMsg('已导出 HTML 文件', 'success');
}

function copyHtml() {
  if (!editor.value.trim()) { showMsg('没有可复制的内容', 'error'); return; }
  const html = preview.innerHTML;
  navigator.clipboard.writeText(html).then(() => {
    showMsg('已复制 HTML 到剪贴板', 'success');
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = html;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showMsg('已复制 HTML 到剪贴板', 'success');
  });
}

function clearAll() {
  editor.value = '';
  hideMsg();
  render();
}

render();
</script>
</body>
</html>
