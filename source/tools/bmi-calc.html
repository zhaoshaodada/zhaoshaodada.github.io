<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BMI身体质量指数计算器，快速计算您的BMI指数，评估健康状况并给出建议。">
  <meta name="keywords" content="BMI计算器,身体质量指数,BMI指数,健康评估">
  <meta property="og:title" content="BMI计算器工具">
  <meta property="og:description" content="快速计算BMI指数，评估健康状况">
  <title>BMI计算器工具</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      padding: 40px;
      max-width: 500px;
      width: 100%;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 8px;
      font-size: 28px;
    }
    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .input-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #555;
    }
    .input-row {
      display: flex;
      gap: 20px;
    }
    .input-row .input-group {
      flex: 1;
    }
    input {
      width: 100%;
      padding: 15px 20px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 18px;
      outline: none;
      transition: border-color 0.3s;
    }
    input:focus {
      border-color: #f5576c;
    }
    input.error {
      border-color: #f44336;
    }
    .btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
    }
    .btn:active {
      transform: translateY(0);
    }
    .result-box {
      margin-top: 25px;
      display: none;
    }
    .bmi-circle {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      margin: 0 auto 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.5s;
    }
    .bmi-circle.underweight { background: #4fc3f7; }
    .bmi-circle.normal { background: #81c784; }
    .bmi-circle.overweight { background: #ffb74d; }
    .bmi-circle.obese { background: #ef5350; }
    .bmi-value {
      font-size: 48px;
      font-weight: 700;
      color: #fff;
    }
    .bmi-label {
      font-size: 18px;
      color: #fff;
      font-weight: 500;
    }
    .advice-box {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 20px;
    }
    .advice-title {
      font-weight: 600;
      color: #333;
      margin-bottom: 10px;
      font-size: 16px;
    }
    .advice-text {
      color: #666;
      font-size: 14px;
      line-height: 1.8;
    }
    .bmi-table {
      margin-top: 20px;
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .bmi-table th, .bmi-table td {
      padding: 10px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }
    .bmi-table th {
      background: #f8f9fa;
      color: #666;
    }
    .error-msg {
      color: #f44336;
      font-size: 14px;
      margin-top: 5px;
      display: none;
    }
    .tip {
      margin-top: 20px;
      padding: 15px;
      background: #fce4ec;
      border-radius: 8px;
      border-left: 4px solid #f5576c;
      font-size: 14px;
      color: #c62828;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚖️ BMI 计算器</h1>
    <p class="subtitle">计算身体质量指数，评估您的健康状况</p>
    
    <div class="input-row">
      <div class="input-group">
        <label>身高（cm）：</label>
        <input type="number" id="height" placeholder="例如：175" maxlength="4">
        <div class="error-msg" id="heightError">请输入有效的身高</div>
      </div>
      <div class="input-group">
        <label>体重（kg）：</label>
        <input type="number" id="weight" placeholder="例如：68" maxlength="4">
        <div class="error-msg" id="weightError">请输入有效的体重</div>
      </div>
    </div>
    
    <button class="btn" onclick="calculateBMI()">计算</button>
    
    <div class="result-box" id="resultBox">
      <div class="bmi-circle" id="bmiCircle">
        <div class="bmi-value" id="bmiValue">--</div>
        <div class="bmi-label" id="bmiLabel">--</div>
      </div>
      <div class="advice-box">
        <div class="advice-title">💡 健康建议</div>
        <div class="advice-text" id="adviceText"></div>
      </div>
    </div>
    
    <table class="bmi-table">
      <thead>
        <tr>
          <th>范围</th>
          <th>BMI 值</th>
          <th>状态</th>
        </tr>
      </thead>
      <tbody>
        <tr><td style="color: #0288d1;">偏瘦</td><td>&lt; 18.5</td><td>需要增加营养</td></tr>
        <tr><td style="color: #388e3c;">正常</td><td>18.5 - 23.9</td><td>保持健康习惯</td></tr>
        <tr><td style="color: #f57c00;">超重</td><td>24.0 - 27.9</td><td>建议适当运动</td></tr>
        <tr><td style="color: #c62828;">肥胖</td><td>≥ 28.0</td><td>需要控制饮食</td></tr>
      </tbody>
    </table>
    
    <div class="tip">
      💡 提示：BMI 只是参考指标，肌肉含量高的人群可能 BMI 值偏高。建议结合体脂率等指标综合评估。
    </div>
  </div>

  <script>
    function calculateBMI() {
      var height = parseFloat(document.getElementById('height').value);
      var weight = parseFloat(document.getElementById('weight').value);
      
      var heightError = document.getElementById('heightError');
      var weightError = document.getElementById('weightError');
      var resultBox = document.getElementById('resultBox');
      
      heightError.style.display = 'none';
      weightError.style.display = 'none';
      document.getElementById('height').classList.remove('error');
      document.getElementById('weight').classList.remove('error');
      
      if (isNaN(height) || height <= 0 || height > 250) {
        heightError.style.display = 'block';
        document.getElementById('height').classList.add('error');
        return;
      }
      
      if (isNaN(weight) || weight <= 0 || weight > 300) {
        weightError.style.display = 'block';
        document.getElementById('weight').classList.add('error');
        return;
      }
      
      var bmi = weight / Math.pow(height / 100, 2);
      bmi = Math.round(bmi * 10) / 10;
      
      var category = '';
      var className = '';
      var advice = '';
      
      if (bmi < 18.5) {
        category = '偏瘦';
        className = 'underweight';
        advice = '您的体重偏轻，建议适当增加营养摄入，保证充足的蛋白质和碳水化合物。可以适当进行力量训练，增加肌肉量。';
      } else if (bmi >= 18.5 && bmi < 24) {
        category = '正常';
        className = 'normal';
        advice = '恭喜！您的体重在正常范围内。请继续保持健康的饮食习惯和适度的运动，维持良好的身体状态。';
      } else if (bmi >= 24 && bmi < 28) {
        category = '超重';
        className = 'overweight';
        advice = '您的体重略微超标，建议适当控制饮食，减少高热量食物的摄入，并增加有氧运动，如快走、慢跑、游泳等。';
      } else {
        category = '肥胖';
        className = 'obese';
        advice = '您的体重超标较多，建议制定科学的减重计划，控制饮食热量摄入，增加运动量。如有需要，可以咨询专业医生或营养师。';
      }
      
      document.getElementById('bmiValue').textContent = bmi;
      document.getElementById('bmiLabel').textContent = category;
      document.getElementById('bmiCircle').className = 'bmi-circle ' + className;
      document.getElementById('adviceText').textContent = advice;
      resultBox.style.display = 'block';
    }
    
    document.getElementById('height').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('weight').focus();
      }
    });
    
    document.getElementById('weight').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        calculateBMI();
      }
    });
  </script>
</body>
</html>
