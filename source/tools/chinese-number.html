<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="中文数字大小写转换工具，支持阿拉伯数字转中文小写（一二三四）和中文大写（壹贰叁肆），也支持中文大小写互转。">
  <meta name="keywords" content="中文数字大小写转换,数字转中文,大写数字,小写中文数字,财务数字">
  <meta property="og:title" content="中文数字大小写转换工具">
  <meta property="og:description" content="阿拉伯数字与中文大小写数字互转">
  <title>中文数字大小写转换工具</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      padding: 40px;
      max-width: 600px;
      width: 100%;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 8px;
      font-size: 28px;
    }
    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .tabs {
      display: flex;
      margin-bottom: 25px;
      border-bottom: 2px solid #eee;
    }
    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      font-weight: 500;
      color: #666;
      border-bottom: 2px solid transparent;
      transition: all 0.3s;
    }
    .tab.active {
      color: #ff6b6b;
      border-bottom-color: #ff6b6b;
    }
    .input-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #555;
    }
    input {
      width: 100%;
      padding: 15px 20px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 18px;
      outline: none;
      transition: border-color 0.3s;
    }
    input:focus {
      border-color: #ff6b6b;
    }
    input.error {
      border-color: #f44336;
    }
    .btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      color: #333;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
    }
    .btn:active {
      transform: translateY(0);
    }
    .result-box {
      margin-top: 25px;
      display: none;
    }
    .result-item {
      background: #fff5f5;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 15px;
      position: relative;
    }
    .result-label {
      color: #666;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .result-text {
      font-size: 24px;
      font-weight: 600;
      color: #333;
      word-break: break-all;
      font-family: 'STKaiti', 'KaiTi', serif;
    }
    .copy-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 6px 16px;
      background: #fff;
      border: 1px solid #ff6b6b;
      color: #ff6b6b;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .copy-btn:hover {
      background: #ff6b6b;
      color: #fff;
    }
    .tip {
      margin-top: 20px;
      padding: 15px;
      background: #fff0f0;
      border-radius: 8px;
      border-left: 4px solid #ff6b6b;
      font-size: 14px;
      color: #c62828;
    }
    .error-msg {
      color: #f44336;
      font-size: 14px;
      margin-top: 5px;
      display: none;
    }
    .sample-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .sample-tag {
      padding: 6px 12px;
      background: #fff0f0;
      color: #ff6b6b;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .sample-tag:hover {
      background: #ff6b6b;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔢 中文数字大小写转换</h1>
    <p class="subtitle">阿拉伯数字与中文大小写数字互相转换</p>
    
    <div class="tabs">
      <div class="tab active" data-tab="num-to-chinese">数字转中文</div>
      <div class="tab" data-tab="chinese-convert">中文大小写互转</div>
    </div>
    
    <div id="tab-num-to-chinese" class="tab-content">
      <div class="input-group">
        <label>请输入阿拉伯数字：</label>
        <input type="text" id="numberInput" placeholder="例如：1234567890" maxlength="16">
        <div class="error-msg" id="numError">请输入有效的正整数</div>
        <div class="sample-tags">
          <span class="sample-tag" onclick="setNumber('2026')">2026</span>
          <span class="sample-tag" onclick="setNumber('5201314')">5201314</span>
          <span class="sample-tag" onclick="setNumber('888888')">888888</span>
          <span class="sample-tag" onclick="setNumber('10086')">10086</span>
        </div>
      </div>
      <button class="btn" onclick="numToChinese()">转换</button>
    </div>
    
    <div id="tab-chinese-convert" class="tab-content" style="display: none;">
      <div class="input-group">
        <label>请输入中文数字：</label>
        <input type="text" id="chineseInput" placeholder="例如：一千二百三十四 或 壹仟贰佰叁拾肆" maxlength="50">
        <div class="error-msg" id="chineseError">请输入有效的中文数字</div>
      </div>
      <button class="btn" onclick="convertChinese()">转换</button>
    </div>
    
    <div class="result-box" id="resultBox">
      <div class="result-item">
        <div class="result-label">中文小写：</div>
        <button class="copy-btn" onclick="copyResult('lowercaseResult')">复制</button>
        <div class="result-text" id="lowercaseResult">--</div>
      </div>
      <div class="result-item">
        <div class="result-label">中文大写：</div>
        <button class="copy-btn" onclick="copyResult('uppercaseResult')">复制</button>
        <div class="result-text" id="uppercaseResult">--</div>
      </div>
    </div>
    
    <div class="tip">
      💡 提示：支持 0-9999999999999999（最大16位）的阿拉伯数字转换。中文大小写互转支持零到亿级单位。
    </div>
  </div>

  <script>
    var tabs = document.querySelectorAll('.tab');
    tabs.forEach(function(tab) {
      tab.addEventListener('click', function() {
        tabs.forEach(function(t) { t.classList.remove('active'); });
        tab.classList.add('active');
        
        var target = tab.dataset.tab;
        document.querySelectorAll('.tab-content').forEach(function(c) { c.style.display = 'none'; });
        document.getElementById('tab-' + target).style.display = 'block';
        document.getElementById('resultBox').style.display = 'none';
      });
    });
    
    function setNumber(num) {
      document.getElementById('numberInput').value = num;
      numToChinese();
    }
    
    function numToChinese() {
      var input = document.getElementById('numberInput').value.trim();
      var errorMsg = document.getElementById('numError');
      
      if (!input || !/^\d+$/.test(input)) {
        errorMsg.style.display = 'block';
        document.getElementById('numberInput').classList.add('error');
        return;
      }
      
      if (input.length > 16) {
        errorMsg.textContent = '数字过大，最大支持16位';
        errorMsg.style.display = 'block';
        document.getElementById('numberInput').classList.add('error');
        return;
      }
      
      errorMsg.style.display = 'none';
      document.getElementById('numberInput').classList.remove('error');
      
      var lowercase = numberToChineseLowercase(input);
      var uppercase = numberToChineseUppercase(input);
      
      document.getElementById('lowercaseResult').textContent = lowercase;
      document.getElementById('uppercaseResult').textContent = uppercase;
      document.getElementById('resultBox').style.display = 'block';
    }
    
    function numberToChineseLowercase(num) {
      var digits = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
      var units = ['', '十', '百', '千'];
      var bigUnits = ['', '万', '亿', '万亿'];
      
      num = num.replace(/^0+/, '') || '0';
      if (num === '0') return '零';
      
      var result = '';
      var zero = false;
      var unitPos = 0;
      
      while (num.length > 0) {
        var section = num.slice(-4);
        num = num.slice(0, -4);
        
        var sectionStr = '';
        var sectionZero = true;
        
        for (var i = 0; i < section.length; i++) {
          var digit = parseInt(section[section.length - 1 - i]);
          if (digit === 0) {
            if (!sectionZero && !zero) {
              zero = true;
            }
          } else {
            if (zero) {
              sectionStr = digits[0] + sectionStr;
              zero = false;
            }
            sectionStr = digits[digit] + units[i] + sectionStr;
            sectionZero = false;
          }
        }
        
        if (!sectionZero) {
          sectionStr += bigUnits[unitPos];
        } else if (unitPos > 0 && result.charAt(0) !== '零') {
          sectionStr = '零';
        }
        
        result = sectionStr + result;
        unitPos++;
      }
      
      result = result.replace(/零+/g, '零').replace(/零$/, '');
      
      if (result.length > 1 && result.charAt(0) === '一' && result.charAt(1) === '十') {
        result = result.substring(1);
      }
      
      return result || '零';
    }
    
    function numberToChineseUppercase(num) {
      var lowercase = numberToChineseLowercase(num);
      var map = {
        '零': '零', '一': '壹', '二': '贰', '三': '叁', '四': '肆',
        '五': '伍', '六': '陆', '七': '柒', '八': '捌', '九': '玖',
        '十': '拾', '百': '佰', '千': '仟', '万': '万', '亿': '亿'
      };
      
      var result = '';
      for (var i = 0; i < lowercase.length; i++) {
        result += map[lowercase[i]] || lowercase[i];
      }
      return result;
    }
    
    function convertChinese() {
      var input = document.getElementById('chineseInput').value.trim();
      var errorMsg = document.getElementById('chineseError');
      
      if (!input) {
        errorMsg.style.display = 'block';
        document.getElementById('chineseInput').classList.add('error');
        return;
      }
      
      var lowercaseChars = '零一二三四五六七八九十百千万亿';
      var uppercaseChars = '零壹贰叁肆伍陆柒捌玖拾佰仟万亿';
      
      var isLowercase = false;
      var isUppercase = false;
      
      for (var i = 0; i < input.length; i++) {
        if (lowercaseChars.indexOf(input[i]) > -1) isLowercase = true;
        if (uppercaseChars.indexOf(input[i]) > -1) isUppercase = true;
      }
      
      if (!isLowercase && !isUppercase) {
        errorMsg.style.display = 'block';
        document.getElementById('chineseInput').classList.add('error');
        return;
      }
      
      errorMsg.style.display = 'none';
      document.getElementById('chineseInput').classList.remove('error');
      
      var lowercase = '';
      var uppercase = '';
      
      if (isUppercase && !isLowercase) {
        for (var i = 0; i < input.length; i++) {
          var idx = uppercaseChars.indexOf(input[i]);
          lowercase += lowercaseChars[idx] || input[i];
        }
        document.getElementById('lowercaseResult').textContent = lowercase;
        document.getElementById('uppercaseResult').textContent = input;
      } else {
        for (var i = 0; i < input.length; i++) {
          var idx = lowercaseChars.indexOf(input[i]);
          uppercase += uppercaseChars[idx] || input[i];
        }
        document.getElementById('lowercaseResult').textContent = input;
        document.getElementById('uppercaseResult').textContent = uppercase;
      }
      
      document.getElementById('resultBox').style.display = 'block';
    }
    
    function copyResult(id) {
      var text = document.getElementById(id).textContent;
      navigator.clipboard.writeText(text).then(function() {
        alert('复制成功！');
      }).catch(function() {
        alert('复制失败，请手动复制');
      });
    }
    
    document.getElementById('numberInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') numToChinese();
    });
    
    document.getElementById('chineseInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') convertChinese();
    });
  </script>
</body>
</html>
