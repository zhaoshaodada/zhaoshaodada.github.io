<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>颜色选择器 - 在线工具</title>
<meta name="description" content="在线颜色选择器，HEX/RGB/HSL/HSV 四种格式实时转换，点击复制，纯前端实现">
<meta name="keywords" content="颜色选择器,HEX,RGB,HSL,HSV,颜色转换,取色器,在线取色,Color Picker">
<meta property="og:title" content="颜色选择器 - 在线工具">
<meta property="og:description" content="在线颜色选择器，HEX/RGB/HSL/HSV 实时转换，点击复制">
<meta property="og:type" content="website">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #f5f5f5;
  min-height: 100vh;
  padding: 20px;
}
.container {
  max-width: 900px;
  margin: 0 auto;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  padding: 30px;
}
.back-link {
  display: inline-block;
  margin-bottom: 20px;
  color: #49b1f5;
  text-decoration: none;
  font-size: 14px;
}
.back-link:hover { text-decoration: underline; }
h1 {
  font-size: 24px;
  margin-bottom: 20px;
  color: #333;
}
.textarea-group {
  margin-bottom: 16px;
}
label {
  display: block;
  font-size: 14px;
  color: #666;
  margin-bottom: 8px;
}
.btn-group {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
button {
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-primary { background: #49b1f5; color: #fff; }
.btn-primary:hover { background: #3aa0e4; }
.btn-secondary { background: #f0f0f0; color: #333; }
.btn-secondary:hover { background: #e0e0e0; }
.btn-danger { background: #ff4d4f; color: #fff; }
.btn-danger:hover { background: #e84143; }
.result-area { margin-top: 20px; }
.msg {
  padding: 10px 16px;
  border-radius: 6px;
  margin-bottom: 12px;
  font-size: 14px;
  display: none;
}
.msg.error { background: #fff2f0; color: #ff4d4f; border: 1px solid #ffccc7; display: block; }
.msg.success { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; display: block; }

.picker-row {
  display: flex;
  gap: 16px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.picker-row input[type="color"] {
  width: 80px;
  height: 80px;
  border: 1px solid #ddd;
  border-radius: 8px;
  cursor: pointer;
  background: none;
  padding: 4px;
}
.picker-row input[type="color"]:focus {
  outline: none;
  border-color: #49b1f5;
}
.picker-row input[type="text"] {
  flex: 1;
  min-width: 200px;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 15px;
  font-family: Consolas, Monaco, monospace;
}
.picker-row input[type="text"]:focus {
  outline: none;
  border-color: #49b1f5;
}
.preview-block {
  width: 100%;
  height: 100px;
  border-radius: 8px;
  border: 1px solid #ddd;
  margin-bottom: 16px;
  transition: background 0.15s;
}
.format-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.format-card {
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 14px 16px;
  cursor: pointer;
  transition: all 0.2s;
  background: #fafafa;
}
.format-card:hover {
  border-color: #49b1f5;
  background: #f0f8ff;
}
.format-card .fmt-label {
  font-size: 12px;
  color: #999;
  margin-bottom: 4px;
  letter-spacing: 1px;
}
.format-card .fmt-value {
  font-size: 15px;
  color: #333;
  font-family: Consolas, Monaco, monospace;
  word-break: break-all;
}
@media (max-width: 600px) {
  .format-list { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="container">
  <a href="/tools/" class="back-link">← 返回工具列表</a>
  <h1>颜色选择器</h1>

  <div id="msg" class="msg"></div>

  <div class="picker-row">
    <input type="color" id="color-input" value="#49b1f5">
    <input type="text" id="hex-input" value="#49b1f5" maxlength="7" placeholder="#RRGGBB">
  </div>

  <div class="preview-block" id="preview-block" style="background:#49b1f5;"></div>

  <div class="btn-group">
    <button class="btn-secondary" onclick="copyValue('hex')">复制 HEX</button>
    <button class="btn-secondary" onclick="copyValue('rgb')">复制 RGB</button>
    <button class="btn-secondary" onclick="copyValue('hsl')">复制 HSL</button>
    <button class="btn-secondary" onclick="copyValue('hsv')">复制 HSV</button>
    <button class="btn-danger" onclick="resetColor()">重置</button>
  </div>

  <div class="result-area">
    <div class="format-list">
      <div class="format-card" onclick="copyValue('hex')">
        <div class="fmt-label">HEX</div>
        <div class="fmt-value" id="val-hex">#49B1F5</div>
      </div>
      <div class="format-card" onclick="copyValue('rgb')">
        <div class="fmt-label">RGB</div>
        <div class="fmt-value" id="val-rgb">rgb(73, 177, 245)</div>
      </div>
      <div class="format-card" onclick="copyValue('hsl')">
        <div class="fmt-label">HSL</div>
        <div class="fmt-value" id="val-hsl">hsl(206, 90%, 62%)</div>
      </div>
      <div class="format-card" onclick="copyValue('hsv')">
        <div class="fmt-label">HSV</div>
        <div class="fmt-value" id="val-hsv">hsv(206, 70%, 96%)</div>
      </div>
    </div>
  </div>
</div>

<script>
let currentRGB = { r: 73, g: 177, b: 245 };

function showMsg(text, type) {
  const msg = document.getElementById('msg');
  msg.textContent = text;
  msg.className = 'msg ' + type;
}
function hideMsg() {
  document.getElementById('msg').className = 'msg';
}

function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }

function hexToRgb(hex) {
  hex = hex.replace('#', '').trim();
  if (hex.length === 3) {
    hex = hex.split('').map(c => c + c).join('');
  }
  if (!/^[0-9a-fA-F]{6}$/.test(hex)) return null;
  return {
    r: parseInt(hex.substring(0, 2), 16),
    g: parseInt(hex.substring(2, 4), 16),
    b: parseInt(hex.substring(4, 6), 16)
  };
}

function rgbToHex(r, g, b) {
  const h = n => clamp(Math.round(n), 0, 255).toString(16).padStart(2, '0');
  return ('#' + h(r) + h(g) + h(b)).toUpperCase();
}

function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  let h = 0, s = 0;
  const l = (max + min) / 2;
  if (max !== min) {
    const d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    switch (max) {
      case r: h = (g - b) / d + (g < b ? 6 : 0); break;
      case g: h = (b - r) / d + 2; break;
      case b: h = (r - g) / d + 4; break;
    }
    h /= 6;
  }
  return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
}

function rgbToHsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const d = max - min;
  let h = 0;
  const s = max === 0 ? 0 : d / max;
  const v = max;
  if (max !== min) {
    switch (max) {
      case r: h = (g - b) / d + (g < b ? 6 : 0); break;
      case g: h = (b - r) / d + 2; break;
      case b: h = (r - g) / d + 4; break;
    }
    h /= 6;
  }
  return { h: Math.round(h * 360), s: Math.round(s * 100), v: Math.round(v * 100) };
}

function updateAll(rgb) {
  currentRGB = rgb;
  const hex = rgbToHex(rgb.r, rgb.g, rgb.b);
  const hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
  const hsv = rgbToHsv(rgb.r, rgb.g, rgb.b);
  document.getElementById('color-input').value = hex.toLowerCase();
  if (document.activeElement !== document.getElementById('hex-input')) {
    document.getElementById('hex-input').value = hex;
  }
  document.getElementById('preview-block').style.background = hex;
  document.getElementById('val-hex').textContent = hex;
  document.getElementById('val-rgb').textContent = 'rgb(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ')';
  document.getElementById('val-hsl').textContent = 'hsl(' + hsl.h + ', ' + hsl.s + '%, ' + hsl.l + '%)';
  document.getElementById('val-hsv').textContent = 'hsv(' + hsv.h + ', ' + hsv.s + '%, ' + hsv.v + '%)';
}

document.getElementById('color-input').addEventListener('input', function() {
  const rgb = hexToRgb(this.value);
  if (rgb) updateAll(rgb);
});

document.getElementById('hex-input').addEventListener('input', function() {
  const val = this.value;
  if (!val.startsWith('#') && val.length > 0) {
    // allow user typing without #
  }
  const rgb = hexToRgb(val);
  if (rgb) {
    updateAll(rgb);
    hideMsg();
  }
});

function copyValue(type) {
  const text = document.getElementById('val-' + type).textContent;
  navigator.clipboard.writeText(text).then(() => {
    showMsg('已复制：' + text, 'success');
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showMsg('已复制：' + text, 'success');
  });
}

function resetColor() {
  hideMsg();
  updateAll({ r: 73, g: 177, b: 245 });
  showMsg('已重置为默认颜色', 'success');
}

updateAll(currentRGB);
</script>
</body>
</html>
