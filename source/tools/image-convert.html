<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片格式转换 - 在线工具</title>
<meta name="description" content="在线图片格式转换工具，支持 PNG/JPEG/WebP 互转，纯前端 Canvas 实现，可调整质量，无需上传服务器，安全高效">
<meta name="keywords" content="图片格式转换,PNG转JPEG,JPEG转WebP,WebP转PNG,图片转换,格式互转,Canvas,在线工具">
<meta property="og:title" content="图片格式转换 - 在线工具">
<meta property="og:description" content="在线图片格式转换工具，支持 PNG/JPEG/WebP 互转，纯前端 Canvas 实现">
<meta property="og:type" content="website">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #f5f5f5;
  min-height: 100vh;
  padding: 20px;
}
.container {
  max-width: 900px;
  margin: 0 auto;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  padding: 30px;
}
.back-link {
  display: inline-block;
  margin-bottom: 20px;
  color: #49b1f5;
  text-decoration: none;
  font-size: 14px;
}
.back-link:hover { text-decoration: underline; }
h1 {
  font-size: 24px;
  margin-bottom: 8px;
  color: #333;
}
.subtitle {
  font-size: 13px;
  color: #999;
  margin-bottom: 20px;
}
.textarea-group { margin-bottom: 16px; }
label {
  display: block;
  font-size: 14px;
  color: #666;
  margin-bottom: 8px;
}
.btn-group {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
button {
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-primary { background: #49b1f5; color: #fff; }
.btn-primary:hover { background: #3aa0e4; }
.btn-secondary { background: #f0f0f0; color: #333; }
.btn-secondary:hover { background: #e0e0e0; }
.btn-success { background: #52c41a; color: #fff; }
.btn-success:hover { background: #45b016; }
.btn-danger { background: #ff4d4f; color: #fff; }
.btn-danger:hover { background: #e84143; }
.btn-success:disabled, .btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.result-area { margin-top: 20px; }
.msg {
  padding: 10px 16px;
  border-radius: 6px;
  margin-bottom: 12px;
  font-size: 14px;
  display: none;
}
.msg.error { background: #fff2f0; color: #ff4d4f; border: 1px solid #ffccc7; display: block; }
.msg.success { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; display: block; }
.drop-zone {
  border: 2px dashed #ddd;
  border-radius: 12px;
  padding: 40px 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  background: #fafafa;
}
.drop-zone:hover, .drop-zone.dragover {
  border-color: #49b1f5;
  background: #f0f8ff;
}
.drop-zone p {
  color: #666;
  font-size: 14px;
  margin-top: 8px;
}
.drop-zone .icon {
  font-size: 36px;
  color: #999;
}
.control-row {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  margin: 16px 0;
  align-items: center;
}
.control-group {
  flex: 1;
  min-width: 200px;
}
.control-group label {
  margin-bottom: 6px;
}
input[type="range"] {
  width: 100%;
  vertical-align: middle;
}
.range-value {
  display: inline-block;
  margin-left: 8px;
  color: #49b1f5;
  font-weight: 500;
  min-width: 40px;
}
select {
  padding: 8px 12px;
  border: 1px solid #ddd;
  border-radius: 6px;
  font-size: 14px;
  background: #fff;
  cursor: pointer;
  width: 100%;
}
select:focus {
  outline: none;
  border-color: #49b1f5;
}
.compare-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-top: 16px;
}
.compare-card {
  border: 1px solid #ddd;
  border-radius: 8px;
  overflow: hidden;
}
.compare-card .card-title {
  padding: 10px 14px;
  background: #f6f8fa;
  font-size: 13px;
  color: #666;
  border-bottom: 1px solid #eee;
}
.compare-card .card-body {
  padding: 12px;
  text-align: center;
  min-height: 140px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fafafa;
  font-size: 13px;
  color: #999;
  flex-direction: column;
}
.compare-card img {
  max-width: 100%;
  max-height: 200px;
  display: block;
  margin: 0 auto;
}
.info-line {
  font-size: 13px;
  color: #666;
  margin-top: 6px;
  font-family: Consolas, Monaco, monospace;
}
.info-line .ratio-down { color: #52c41a; font-weight: 500; }
.info-line .ratio-up { color: #ff4d4f; font-weight: 500; }
.format-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 500;
  margin-left: 6px;
}
.format-badge.png { background: #e6f7ff; color: #1890ff; }
.format-badge.jpeg { background: #fff7e6; color: #fa8c16; }
.format-badge.webp { background: #f6ffed; color: #52c41a; }
.format-badge.other { background: #f0f0f0; color: #666; }
.tip {
  font-size: 12px;
  color: #999;
  margin-top: 8px;
  padding: 8px 12px;
  background: #fafafa;
  border-radius: 6px;
  border-left: 3px solid #49b1f5;
}
@media (max-width: 600px) {
  .compare-grid { grid-template-columns: 1fr; }
  .control-row { flex-direction: column; }
}
</style>
</head>
<body>
<div class="container">
  <a href="/tools/" class="back-link">← 返回工具列表</a>
  <h1>图片格式转换</h1>
  <p class="subtitle">支持 PNG / JPEG / WebP 互转，纯前端 Canvas 实现，图片不会上传服务器</p>

  <div id="msg" class="msg"></div>

  <div class="textarea-group">
    <label>上传图片：</label>
    <div class="drop-zone" id="drop-zone">
      <div class="icon">🖼️</div>
      <p>点击选择图片，或将图片拖拽到此处</p>
      <p style="font-size:12px;color:#999;">支持 PNG / JPEG / WebP / GIF / BMP</p>
      <input type="file" id="file-input" accept="image/*" style="display:none;">
    </div>
  </div>

  <div class="control-row">
    <div class="control-group">
      <label>目标格式：</label>
      <select id="format">
        <option value="image/png">PNG（无损，支持透明）</option>
        <option value="image/jpeg" selected>JPEG（有损，体积小）</option>
        <option value="image/webp">WebP（现代格式，高压缩）</option>
      </select>
    </div>
    <div class="control-group" id="quality-group">
      <label>输出质量：<span class="range-value" id="quality-value">90</span>%</label>
      <input type="range" id="quality" min="1" max="100" value="90">
    </div>
  </div>

  <div class="btn-group">
    <button class="btn-primary" id="convert-btn" onclick="convert()" disabled>开始转换</button>
    <button class="btn-success" id="download-btn" onclick="download()" disabled>下载转换后图片</button>
    <button class="btn-danger" onclick="clearAll()">清空</button>
  </div>

  <div class="result-area">
    <div class="compare-grid">
      <div class="compare-card">
        <div class="card-title">原图</div>
        <div class="card-body" id="original-body">上传图片后显示预览</div>
      </div>
      <div class="compare-card">
        <div class="card-title">转换后</div>
        <div class="card-body" id="converted-body">转换完成后显示预览</div>
      </div>
    </div>
    <div class="info-line" id="info-line" style="margin-top:16px;"></div>
    <div class="tip" id="tip" style="display:none;"></div>
  </div>
</div>

<script>
let originalFile = null;
let originalUrl = null;
let convertedBlob = null;
let convertedUrl = null;

function showMsg(text, type) {
  const msg = document.getElementById('msg');
  msg.textContent = text;
  msg.className = 'msg ' + type;
}
function hideMsg() {
  document.getElementById('msg').className = 'msg';
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
  return (bytes / 1024 / 1024).toFixed(2) + ' MB';
}

function formatLabel(mime) {
  const map = {
    'image/png': 'PNG',
    'image/jpeg': 'JPEG',
    'image/webp': 'WebP',
    'image/gif': 'GIF',
    'image/bmp': 'BMP',
    'image/svg+xml': 'SVG'
  };
  return map[mime] || (mime || '未知').replace('image/', '').toUpperCase();
}

function formatBadgeClass(mime) {
  if (mime === 'image/png') return 'png';
  if (mime === 'image/jpeg') return 'jpeg';
  if (mime === 'image/webp') return 'webp';
  return 'other';
}

const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');

dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  if (e.target.files[0]) handleFile(e.target.files[0]);
});
dropZone.addEventListener('dragover', e => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});

document.getElementById('format').addEventListener('change', function() {
  // PNG 无损，禁用质量选项
  const qualityGroup = document.getElementById('quality-group');
  if (this.value === 'image/png') {
    qualityGroup.style.opacity = '0.5';
    qualityGroup.style.pointerEvents = 'none';
  } else {
    qualityGroup.style.opacity = '1';
    qualityGroup.style.pointerEvents = 'auto';
  }
});

document.getElementById('quality').addEventListener('input', function() {
  document.getElementById('quality-value').textContent = this.value;
});

function handleFile(file) {
  hideMsg();
  if (!file.type.startsWith('image/')) {
    showMsg('请选择图片文件', 'error');
    return;
  }
  if (file.type === 'image/svg+xml') {
    showMsg('SVG 是矢量格式，无法通过 Canvas 转换，请使用其他工具', 'error');
    return;
  }
  originalFile = file;
  if (originalUrl) URL.revokeObjectURL(originalUrl);
  originalUrl = URL.createObjectURL(file);
  const badge = '<span class="format-badge ' + formatBadgeClass(file.type) + '">' + formatLabel(file.type) + '</span>';
  document.getElementById('original-body').innerHTML =
    '<img src="' + originalUrl + '" alt="原图">' +
    '<div class="info-line" style="margin-top:8px;">' + formatSize(file.size) + ' · ' + badge + '</div>';
  document.getElementById('converted-body').textContent = '点击「开始转换」';
  document.getElementById('info-line').textContent = '';
  document.getElementById('tip').style.display = 'none';
  document.getElementById('convert-btn').disabled = false;
  resetDownload();
}

function convert() {
  if (!originalFile) { showMsg('请先上传图片', 'error'); return; }
  hideMsg();
  const format = document.getElementById('format').value;
  const quality = parseInt(document.getElementById('quality').value, 10) / 100;
  const img = new Image();
  img.onload = function() {
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext('2d');
    // JPEG 不支持透明通道，用白色背景填充
    if (format === 'image/jpeg') {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    ctx.drawImage(img, 0, 0);
    canvas.toBlob(function(blob) {
      if (!blob) { showMsg('转换失败，浏览器可能不支持该格式编码', 'error'); return; }
      convertedBlob = blob;
      if (convertedUrl) URL.revokeObjectURL(convertedUrl);
      convertedUrl = URL.createObjectURL(blob);
      const ext = format === 'image/jpeg' ? 'jpg' : (format === 'image/webp' ? 'webp' : 'png');
      const badge = '<span class="format-badge ' + formatBadgeClass(format) + '">' + ext.toUpperCase() + '</span>';
      document.getElementById('converted-body').innerHTML =
        '<img src="' + convertedUrl + '" alt="转换后">' +
        '<div class="info-line" style="margin-top:8px;">' + formatSize(blob.size) + ' · ' + badge + '</div>';
      const ratio = (1 - blob.size / originalFile.size) * 100;
      const ratioCls = ratio >= 0 ? 'ratio-down' : 'ratio-up';
      const ratioText = ratio >= 0
        ? '减小 ' + ratio.toFixed(1) + '%'
        : '增大 ' + Math.abs(ratio).toFixed(1) + '%';
      document.getElementById('info-line').innerHTML =
        '原始大小：<strong>' + formatSize(originalFile.size) + '</strong>  →  ' +
        '转换后：<strong>' + formatSize(blob.size) + '</strong>  ' +
        '<span class="' + ratioCls + '">' + ratioText + '</span>';
      // 显示转换提示
      const tipEl = document.getElementById('tip');
      let tipText = '';
      if (format === 'image/jpeg' && originalFile.type === 'image/png') {
        tipText = '提示：PNG 转 JPEG 会丢失透明通道（已用白色填充），有透明背景的图片请改用 PNG 或 WebP。';
      } else if (format === 'image/png' && (originalFile.type === 'image/jpeg' || originalFile.type === 'image/webp')) {
        tipText = '提示：转为 PNG 无损格式，体积可能比原图更大。';
      } else if (originalFile.type === 'image/gif') {
        tipText = '提示：GIF 动图转换后只会保留第一帧，动画会丢失。';
      }
      if (tipText) {
        tipEl.textContent = tipText;
        tipEl.style.display = 'block';
      } else {
        tipEl.style.display = 'none';
      }
      enableDownload();
      showMsg('转换完成', 'success');
    }, format, format === 'image/png' ? undefined : quality);
  };
  img.onerror = function() { showMsg('图片加载失败', 'error'); };
  img.src = originalUrl;
}

function enableDownload() {
  document.getElementById('download-btn').disabled = false;
}
function resetDownload() {
  document.getElementById('download-btn').disabled = true;
  convertedBlob = null;
  if (convertedUrl) { URL.revokeObjectURL(convertedUrl); convertedUrl = null; }
}

function download() {
  if (!convertedBlob) { showMsg('没有可下载的内容', 'error'); return; }
  const format = document.getElementById('format').value;
  const ext = format === 'image/jpeg' ? 'jpg' : (format === 'image/webp' ? 'webp' : 'png');
  const baseName = (originalFile && originalFile.name) ? originalFile.name.replace(/\.[^.]+$/, '') : 'image';
  const a = document.createElement('a');
  a.href = convertedUrl;
  a.download = baseName + '_converted.' + ext;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  showMsg('开始下载', 'success');
}

function clearAll() {
  hideMsg();
  originalFile = null;
  if (originalUrl) { URL.revokeObjectURL(originalUrl); originalUrl = null; }
  resetDownload();
  fileInput.value = '';
  document.getElementById('original-body').textContent = '上传图片后显示预览';
  document.getElementById('converted-body').textContent = '转换完成后显示预览';
  document.getElementById('info-line').textContent = '';
  document.getElementById('tip').style.display = 'none';
  document.getElementById('convert-btn').disabled = true;
}

// 初始化：PNG 时禁用质量
document.getElementById('format').dispatchEvent(new Event('change'));
</script>
</body>
</html>
