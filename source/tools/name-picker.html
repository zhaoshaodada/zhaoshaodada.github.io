<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="随机点名器工具，支持导入名单、随机抽取、排除已抽选人员，适用于课堂点名、抽奖等场景。">
  <meta name="keywords" content="随机点名器,课堂点名,抽奖工具,随机抽取">
  <meta property="og:title" content="随机点名器工具">
  <meta property="og:description" content="支持导入名单，随机抽取人员">
  <title>随机点名器工具</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      padding: 40px;
      max-width: 600px;
      width: 100%;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 8px;
      font-size: 28px;
    }
    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .input-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #555;
    }
    textarea {
      width: 100%;
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
      resize: vertical;
      min-height: 150px;
      outline: none;
      transition: border-color 0.3s;
    }
    textarea:focus {
      border-color: #4facfe;
    }
    .btn {
      padding: 15px 40px;
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.2s;
      margin-right: 15px;
    }
    .btn:hover {
      transform: translateY(-2px);
    }
    .btn:active {
      transform: translateY(0);
    }
    .btn-outline {
      background: #fff;
      color: #4facfe;
      border: 2px solid #4facfe;
    }
    .btn-group {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }
    .result-box {
      margin-top: 30px;
      text-align: center;
    }
    .picker-area {
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      margin: 0 auto 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 32px;
      font-weight: 700;
      box-shadow: 0 10px 40px rgba(79, 172, 254, 0.4);
      transition: transform 0.1s;
    }
    .picker-area.running {
      animation: shake 0.1s infinite;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
    .status-bar {
      display: flex;
      justify-content: space-around;
      margin-top: 20px;
      font-size: 14px;
      color: #666;
    }
    .count-item {
      text-align: center;
    }
    .count-value {
      font-size: 24px;
      font-weight: 600;
      color: #4facfe;
    }
    .history-box {
      margin-top: 30px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 10px;
    }
    .history-title {
      font-weight: 600;
      color: #333;
      margin-bottom: 10px;
    }
    .history-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .history-tag {
      padding: 6px 12px;
      background: #e3f2fd;
      color: #1976d2;
      border-radius: 20px;
      font-size: 14px;
    }
    .tip {
      margin-top: 20px;
      padding: 15px;
      background: #e3f2fd;
      border-radius: 8px;
      border-left: 4px solid #4facfe;
      font-size: 14px;
      color: #0d47a1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎲 随机点名器</h1>
    <p class="subtitle">导入名单，随机抽取幸运儿</p>
    
    <div class="input-group">
      <label>名单（每行一个名字）：</label>
      <textarea id="nameList" placeholder="张三&#10;李四&#10;王五&#10;赵六">张三
李四
王五
赵六
孙七
周八
吴九
郑十</textarea>
    </div>
    
    <div class="btn-group">
      <button class="btn" id="startBtn" onclick="startPick()">开始抽取</button>
      <button class="btn btn-outline" onclick="reset()">重置</button>
    </div>
    
    <div class="result-box">
      <div class="picker-area" id="pickerArea">点击开始</div>
    </div>
    
    <div class="status-bar">
      <div class="count-item">
        <div class="count-value" id="totalCount">0</div>
        <div>总人数</div>
      </div>
      <div class="count-item">
        <div class="count-value" id="pickedCount">0</div>
        <div>已抽取</div>
      </div>
      <div class="count-item">
        <div class="count-value" id="remainCount">0</div>
        <div>剩余</div>
      </div>
    </div>
    
    <div class="history-box">
      <div class="history-title">📝 抽取历史</div>
      <div class="history-list" id="historyList"></div>
    </div>
    
    <div class="tip">
      💡 提示：名单支持每行一个名字，或用逗号/空格分隔。抽取后会自动排除已抽选人员，可重复点击继续抽取。
    </div>
  </div>

  <script>
    var names = [];
    var remaining = [];
    var picked = [];
    var isRunning = false;
    var timer = null;
    
    function updateStatus() {
      document.getElementById('totalCount').textContent = names.length;
      document.getElementById('pickedCount').textContent = picked.length;
      document.getElementById('remainCount').textContent = remaining.length;
      
      var historyList = document.getElementById('historyList');
      historyList.innerHTML = '';
      picked.forEach(function(name, index) {
        var tag = document.createElement('div');
        tag.className = 'history-tag';
        tag.textContent = (index + 1) + '. ' + name;
        historyList.appendChild(tag);
      });
    }
    
    function parseNames() {
      var text = document.getElementById('nameList').value.trim();
      var lines = text.split(/[\n,，\s]+/);
      names = lines.filter(function(n) { return n.trim(); });
      remaining = names.slice();
      picked = [];
      updateStatus();
    }
    
    parseNames();
    
    document.getElementById('nameList').addEventListener('input', parseNames);
    
    function startPick() {
      if (isRunning) {
        stopPick();
        return;
      }
      
      if (remaining.length === 0) {
        alert('所有人都已抽取完毕，请重置！');
        return;
      }
      
      isRunning = true;
      document.getElementById('startBtn').textContent = '停止';
      document.getElementById('pickerArea').classList.add('running');
      
      timer = setInterval(function() {
        var randomIndex = Math.floor(Math.random() * remaining.length);
        document.getElementById('pickerArea').textContent = remaining[randomIndex];
      }, 50);
    }
    
    function stopPick() {
      isRunning = false;
      clearInterval(timer);
      document.getElementById('startBtn').textContent = '开始抽取';
      document.getElementById('pickerArea').classList.remove('running');
      
      var pickedName = document.getElementById('pickerArea').textContent;
      if (pickedName !== '点击开始') {
        var index = remaining.indexOf(pickedName);
        if (index > -1) {
          remaining.splice(index, 1);
          picked.push(pickedName);
          updateStatus();
        }
      }
    }
    
    function reset() {
      isRunning = false;
      clearInterval(timer);
      document.getElementById('startBtn').textContent = '开始抽取';
      document.getElementById('pickerArea').classList.remove('running');
      document.getElementById('pickerArea').textContent = '点击开始';
      parseNames();
    }
  </script>
</body>
</html>
