<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS 选择器测试 - 在线工具</title>
<meta name="description" content="在线CSS选择器测试工具，输入CSS选择器实时匹配并高亮页面元素，支持各种选择器语法，纯前端实现">
<meta name="keywords" content="CSS选择器,CSS选择器测试,选择器匹配,CSS,在线工具">
<meta property="og:title" content="CSS 选择器测试 - 在线工具">
<meta property="og:description" content="在线CSS选择器测试工具，输入CSS选择器实时匹配并高亮页面元素">
<meta property="og:type" content="website">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #f5f5f5;
  min-height: 100vh;
  padding: 20px;
}
.container {
  max-width: 900px;
  margin: 0 auto;
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  padding: 30px;
}
.back-link {
  display: inline-block;
  margin-bottom: 20px;
  color: #49b1f5;
  text-decoration: none;
  font-size: 14px;
}
.back-link:hover { text-decoration: underline; }
h1 {
  font-size: 24px;
  margin-bottom: 8px;
  color: #333;
}
.subtitle { font-size: 13px; color: #999; margin-bottom: 20px; }
.textarea-group { margin-bottom: 16px; }
label {
  display: block;
  font-size: 14px;
  color: #666;
  margin-bottom: 8px;
}
input[type="text"] {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 16px;
  font-family: Consolas, Monaco, monospace;
}
input[type="text"]:focus {
  outline: none;
  border-color: #49b1f5;
}
.btn-group {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
button {
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-primary { background: #49b1f5; color: #fff; }
.btn-primary:hover { background: #3aa0e4; }
.btn-secondary { background: #f0f0f0; color: #333; }
.btn-secondary:hover { background: #e0e0e0; }
.btn-success { background: #52c41a; color: #fff; }
.btn-success:hover { background: #45b016; }
.btn-danger { background: #ff4d4f; color: #fff; }
.btn-danger:hover { background: #e84143; }
.msg {
  padding: 10px 16px;
  border-radius: 6px;
  margin-bottom: 12px;
  font-size: 14px;
  display: none;
}
.msg.error { background: #fff2f0; color: #ff4d4f; border: 1px solid #ffccc7; display: block; }
.msg.success { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; display: block; }
.test-area {
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 20px;
  background: #fafafa;
  margin-bottom: 16px;
}
.test-element {
  padding: 10px;
  margin: 10px;
  background: #fff;
  border: 1px solid #eee;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
}
.test-element.highlight {
  background: #f6ffed;
  border-color: #52c41a;
  box-shadow: 0 0 0 2px rgba(82, 196, 26, 0.2);
}
.test-element:hover {
  background: #f0f0f0;
}
.example-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}
.example-btn {
  padding: 6px 12px;
  font-size: 12px;
  background: #f5f5f5;
  color: #666;
}
.example-btn:hover { background: #e8e8e8; }
.result-info {
  font-size: 13px;
  color: #666;
  margin-bottom: 16px;
}
.result-info span {
  font-weight: 600;
  color: #49b1f5;
}
</style>
</head>
<body>
<div class="container">
  <a href="/tools/" class="back-link">← 返回工具列表</a>
  <h1>CSS 选择器测试</h1>
  <p class="subtitle">输入CSS选择器，实时匹配并高亮页面元素</p>

  <div id="msg" class="msg"></div>

  <div class="example-list">
    <button class="example-btn" onclick="setSelector('.item')">.item (类选择器)</button>
    <button class="example-btn" onclick="setSelector('#header')">#header (ID选择器)</button>
    <button class="example-btn" onclick="setSelector('div')">div (标签选择器)</button>
    <button class="example-btn" onclick="setSelector('.item:nth-child(2)')">:nth-child(2)</button>
    <button class="example-btn" onclick="setSelector('.item:first-child')">:first-child</button>
    <button class="example-btn" onclick="setSelector('.item:last-child')">:last-child</button>
    <button class="example-btn" onclick="setSelector('.list > .item')">子选择器</button>
    <button class="example-btn" onclick="setSelector('.list .item')">后代选择器</button>
    <button class="example-btn" onclick="setSelector('[data-type]')">属性选择器</button>
    <button class="example-btn" onclick="setSelector('.active')">.active</button>
  </div>

  <div class="textarea-group">
    <label>CSS 选择器：</label>
    <input type="text" id="selectorInput" placeholder="输入 CSS 选择器，例如：.item">
  </div>

  <div class="btn-group">
    <button class="btn-primary" onclick="testSelector()">测试选择器</button>
    <button class="btn-success" onclick="copySelector()">复制选择器</button>
    <button class="btn-danger" onclick="clearAll()">清空</button>
  </div>

  <div class="result-info" id="resultInfo">输入选择器并点击测试</div>

  <div class="test-area" id="testArea">
    <div class="test-element" id="header">页面头部 (id="header")</div>
    <div class="test-element" id="nav">导航栏 (id="nav")</div>
    <div class="test-element list">
      <div class="test-element item active" data-type="article">文章1 (class="item active")</div>
      <div class="test-element item" data-type="article">文章2 (class="item")</div>
      <div class="test-element item" data-type="image">图片1 (class="item")</div>
      <div class="test-element item active" data-type="video">视频1 (class="item active")</div>
      <div class="test-element item" data-type="article">文章3 (class="item")</div>
    </div>
    <div class="test-element" id="sidebar">侧边栏 (id="sidebar")</div>
    <div class="test-element" id="footer">页面底部 (id="footer")</div>
  </div>
</div>

<script>
function showMsg(text, type) {
  const msg = document.getElementById('msg');
  msg.textContent = text;
  msg.className = 'msg ' + type;
}
function hideMsg() {
  document.getElementById('msg').className = 'msg';
}

function setSelector(selector) {
  document.getElementById('selectorInput').value = selector;
  testSelector();
}

function testSelector() {
  const selector = document.getElementById('selectorInput').value.trim();
  if (!selector) {
    showMsg('请输入选择器', 'error');
    clearHighlight();
    document.getElementById('resultInfo').textContent = '输入选择器并点击测试';
    return;
  }
  
  try {
    const elements = document.querySelectorAll(selector);
    clearHighlight();
    
    elements.forEach(el => {
      el.classList.add('highlight');
    });
    
    document.getElementById('resultInfo').innerHTML = 
      '选择器 "<span>' + selector + '</span>" 匹配到 <span>' + elements.length + '</span> 个元素';
    
    if (elements.length > 0) {
      showMsg('匹配成功，共找到 ' + elements.length + ' 个元素', 'success');
    } else {
      showMsg('未找到匹配的元素', 'error');
    }
  } catch (e) {
    showMsg('选择器语法错误：' + e.message, 'error');
    document.getElementById('resultInfo').textContent = '选择器语法错误';
  }
}

function clearHighlight() {
  document.querySelectorAll('.test-element').forEach(el => {
    el.classList.remove('highlight');
  });
}

function copySelector() {
  const input = document.getElementById('selectorInput');
  if (!input.value) { showMsg('没有可复制的内容', 'error'); return; }
  input.select();
  document.execCommand('copy');
  showMsg('已复制到剪贴板', 'success');
}

function clearAll() {
  document.getElementById('selectorInput').value = '';
  clearHighlight();
  document.getElementById('resultInfo').textContent = '输入选择器并点击测试';
  hideMsg();
}

document.getElementById('selectorInput').addEventListener('input', testSelector);
</script>
</body>
</html>
