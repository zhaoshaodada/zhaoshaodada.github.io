<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="2048小游戏，经典益智游戏，通过滑动合并相同数字，达到2048即可获胜。">
  <meta name="keywords" content="2048,小游戏,经典游戏,滑动合并,益智游戏">
  <meta property="og:title" content="2048小游戏">
  <meta property="og:description" content="经典2048游戏，滑动合并相同数字">
  <title>2048小游戏</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #f5af19 0%, #f12711 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0;
    }
    .header {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      padding: 25px 20px;
      text-align: center;
      width: 100%;
    }
    h1 {
      color: #fff;
      margin-bottom: 8px;
      font-size: 28px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }
    .subtitle {
      color: rgba(255,255,255,0.8);
      margin-bottom: 0;
      font-size: 14px;
    }
    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      padding: 30px;
      max-width: 450px;
      width: 100%;
      margin: 20px auto;
    }
    .control-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .btn {
      padding: 10px 20px;
      background: linear-gradient(135deg, #f5af19 0%, #f12711 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
    }
    .stats {
      display: flex;
      gap: 20px;
    }
    .stat-item {
      background: #f8f9fa;
      padding: 10px 20px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-label {
      font-size: 12px;
      color: #999;
      margin-bottom: 5px;
    }
    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: #f12711;
    }
    .game-board {
      background: #bbada0;
      border-radius: 8px;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .tile {
      aspect-ratio: 1;
      background: #cdc1b4;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      transition: all 0.15s;
    }
    .tile-2 { background: #eee4da; color: #776e65; }
    .tile-4 { background: #ede0c8; color: #776e65; }
    .tile-8 { background: #f2b179; color: #f9f6f2; }
    .tile-16 { background: #f59563; color: #f9f6f2; }
    .tile-32 { background: #f67c5f; color: #f9f6f2; }
    .tile-64 { background: #f65e3b; color: #f9f6f2; }
    .tile-128 { background: #edcf72; color: #f9f6f2; font-size: 24px; }
    .tile-256 { background: #edcc61; color: #f9f6f2; font-size: 24px; }
    .tile-512 { background: #edc850; color: #f9f6f2; font-size: 24px; }
    .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 20px; }
    .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 20px; }
    .tile-super { background: #3c3a32; color: #f9f6f2; font-size: 18px; }
    .hint {
      text-align: center;
      margin-top: 15px;
      color: #888;
      font-size: 14px;
    }
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal.show {
      display: flex;
    }
    .modal-content {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      animation: bounceIn 0.5s;
      max-width: 400px;
      width: 90%;
    }
    @keyframes bounceIn {
      0% { transform: scale(0.5); opacity: 0; }
      60% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
    .modal-icon {
      font-size: 60px;
      margin-bottom: 15px;
    }
    .modal-title {
      font-size: 24px;
      font-weight: 700;
      color: #333;
      margin-bottom: 10px;
    }
    .modal-text {
      color: #666;
      margin-bottom: 25px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔢 2048</h1>
    <p class="subtitle">使用方向键或滑动屏幕，合并相同数字，达到2048即可获胜</p>
  </div>
  <div class="container">
    <div class="control-bar">
      <div class="stats">
        <div class="stat-item">
          <div class="stat-label">得分</div>
          <div class="stat-value" id="score">0</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">最高</div>
          <div class="stat-value" id="best">0</div>
        </div>
      </div>
      <button class="btn" onclick="newGame()">新游戏</button>
    </div>
    
    <div class="game-board" id="gameBoard"></div>
    
    <p class="hint">💡 方向键：↑ ↓ ← → 移动 | 相同数字合并</p>
  </div>
  
  <div class="modal" id="winModal">
    <div class="modal-content">
      <div class="modal-icon">🎉</div>
      <div class="modal-title">恭喜！</div>
      <div class="modal-text" id="winText">
        你达到了2048！
      </div>
      <button class="btn" onclick="closeWinModal()">继续挑战</button>
    </div>
  </div>
  
  <div class="modal" id="gameOverModal">
    <div class="modal-content">
      <div class="modal-icon">😢</div>
      <div class="modal-title">游戏结束</div>
      <div class="modal-text" id="gameOverText">
        得分：0
      </div>
      <button class="btn" onclick="closeModal()">再玩一次</button>
    </div>
  </div>

  <script>
    var gridSize = 4;
    var grid = [];
    var score = 0;
    var bestScore = parseInt(localStorage.getItem('2048-best')) || 0;
    var hasWon = false;
    var isGameOver = false;
    
    document.getElementById('best').textContent = bestScore;
    
    function init() {
      newGame();
      window.addEventListener('keydown', handleKeyDown);
      
      var touchStartX = 0;
      var touchStartY = 0;
      document.addEventListener('touchstart', function(e) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      });
      document.addEventListener('touchend', function(e) {
        var touchEndX = e.changedTouches[0].clientX;
        var touchEndY = e.changedTouches[0].clientY;
        var dx = touchEndX - touchStartX;
        var dy = touchEndY - touchStartY;
        
        if (Math.abs(dx) > Math.abs(dy)) {
          if (Math.abs(dx) > 30) {
            dx > 0 ? move('right') : move('left');
          }
        } else {
          if (Math.abs(dy) > 30) {
            dy > 0 ? move('down') : move('up');
          }
        }
      });
    }
    
    function newGame() {
      grid = Array.from({ length: gridSize }, () => Array(gridSize).fill(0));
      score = 0;
      hasWon = false;
      isGameOver = false;
      updateScore();
      addRandomTile();
      addRandomTile();
      render();
    }
    
    function addRandomTile() {
      var empty = [];
      for (var y = 0; y < gridSize; y++) {
        for (var x = 0; x < gridSize; x++) {
          if (grid[y][x] === 0) {
            empty.push({ x, y });
          }
        }
      }
      
      if (empty.length > 0) {
        var { x, y } = empty[Math.floor(Math.random() * empty.length)];
        grid[y][x] = Math.random() < 0.9 ? 2 : 4;
      }
    }
    
    function handleKeyDown(e) {
      if (isGameOver) return;
      
      switch (e.key) {
        case 'ArrowUp':
          e.preventDefault();
          move('up');
          break;
        case 'ArrowDown':
          e.preventDefault();
          move('down');
          break;
        case 'ArrowLeft':
          e.preventDefault();
          move('left');
          break;
        case 'ArrowRight':
          e.preventDefault();
          move('right');
          break;
      }
    }
    
    function move(direction) {
      var moved = false;
      var newGrid = grid.map(row => [...row]);
      
      if (direction === 'left') {
        for (var y = 0; y < gridSize; y++) {
          var row = newGrid[y].filter(val => val !== 0);
          for (var i = 0; i < row.length - 1; i++) {
            if (row[i] === row[i + 1]) {
              row[i] *= 2;
              score += row[i];
              if (row[i] === 2048 && !hasWon) {
                hasWon = true;
                showWinModal();
              }
              row.splice(i + 1, 1);
            }
          }
          while (row.length < gridSize) row.push(0);
          if (JSON.stringify(newGrid[y]) !== JSON.stringify(row)) {
            moved = true;
            newGrid[y] = row;
          }
        }
      } else if (direction === 'right') {
        for (var y = 0; y < gridSize; y++) {
          var row = newGrid[y].filter(val => val !== 0);
          for (var i = row.length - 1; i > 0; i--) {
            if (row[i] === row[i - 1]) {
              row[i] *= 2;
              score += row[i];
              if (row[i] === 2048 && !hasWon) {
                hasWon = true;
                showWinModal();
              }
              row.splice(i - 1, 1);
            }
          }
          while (row.length < gridSize) row.unshift(0);
          if (JSON.stringify(newGrid[y]) !== JSON.stringify(row)) {
            moved = true;
            newGrid[y] = row;
          }
        }
      } else if (direction === 'up') {
        for (var x = 0; x < gridSize; x++) {
          var col = [];
          for (var y = 0; y < gridSize; y++) col.push(newGrid[y][x]);
          col = col.filter(val => val !== 0);
          for (var i = 0; i < col.length - 1; i++) {
            if (col[i] === col[i + 1]) {
              col[i] *= 2;
              score += col[i];
              if (col[i] === 2048 && !hasWon) {
                hasWon = true;
                showWinModal();
              }
              col.splice(i + 1, 1);
            }
          }
          while (col.length < gridSize) col.push(0);
          for (var y = 0; y < gridSize; y++) {
            if (newGrid[y][x] !== col[y]) moved = true;
            newGrid[y][x] = col[y];
          }
        }
      } else if (direction === 'down') {
        for (var x = 0; x < gridSize; x++) {
          var col = [];
          for (var y = 0; y < gridSize; y++) col.push(newGrid[y][x]);
          col = col.filter(val => val !== 0);
          for (var i = col.length - 1; i > 0; i--) {
            if (col[i] === col[i - 1]) {
              col[i] *= 2;
              score += col[i];
              if (col[i] === 2048 && !hasWon) {
                hasWon = true;
                showWinModal();
              }
              col.splice(i - 1, 1);
            }
          }
          while (col.length < gridSize) col.unshift(0);
          for (var y = 0; y < gridSize; y++) {
            if (newGrid[y][x] !== col[y]) moved = true;
            newGrid[y][x] = col[y];
          }
        }
      }
      
      if (moved) {
        grid = newGrid;
        addRandomTile();
        updateScore();
        render();
        checkGameOver();
      }
    }
    
    function render() {
      var board = document.getElementById('gameBoard');
      board.innerHTML = '';
      
      for (var y = 0; y < gridSize; y++) {
        for (var x = 0; x < gridSize; x++) {
          var tile = document.createElement('div');
          tile.className = 'tile' + (grid[y][x] ? ' tile-' + (grid[y][x] <= 2048 ? grid[y][x] : 'super') : '');
          tile.textContent = grid[y][x] || '';
          board.appendChild(tile);
        }
      }
    }
    
    function updateScore() {
      document.getElementById('score').textContent = score;
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('2048-best', bestScore);
        document.getElementById('best').textContent = bestScore;
      }
    }
    
    function checkGameOver() {
      for (var y = 0; y < gridSize; y++) {
        for (var x = 0; x < gridSize; x++) {
          if (grid[y][x] === 0) return;
          if (x < gridSize - 1 && grid[y][x] === grid[y][x + 1]) return;
          if (y < gridSize - 1 && grid[y][x] === grid[y + 1][x]) return;
        }
      }
      isGameOver = true;
      document.getElementById('gameOverText').textContent = '得分：' + score;
      document.getElementById('gameOverModal').classList.add('show');
    }
    
    function showWinModal() {
      document.getElementById('winModal').classList.add('show');
    }
    
    function closeWinModal() {
      document.getElementById('winModal').classList.remove('show');
    }
    
    function closeModal() {
      document.getElementById('gameOverModal').classList.remove('show');
      newGame();
    }
    
    init();
  </script>
</body>
</html>
