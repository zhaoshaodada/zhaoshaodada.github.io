<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="双人迷宫对战小游戏，两位玩家在同一个迷宫中比赛，先到达出口者获胜。">
  <meta name="keywords" content="双人迷宫,对战游戏,本地多人,迷宫比赛">
  <meta property="og:title" content="双人迷宫对战小游戏">
  <meta property="og:description" content="双人本地对战迷宫游戏，先到达出口者获胜">
  <title>双人迷宫对战小游戏</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0;
    }
    .header {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      padding: 25px 20px;
      text-align: center;
      width: 100%;
    }
    h1 {
      color: #fff;
      margin-bottom: 8px;
      font-size: 28px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }
    .subtitle {
      color: rgba(255,255,255,0.8);
      margin-bottom: 0;
      font-size: 14px;
    }
    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      padding: 30px;
      max-width: 600px;
      width: 100%;
      margin: 20px auto;
    }
    .control-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .difficulty-select {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    select {
      padding: 8px 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }
    select:focus {
      border-color: #11998e;
    }
    .btn {
      padding: 10px 20px;
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
    }
    .stats {
      display: flex;
      gap: 20px;
      font-size: 14px;
      color: #666;
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .stat-value {
      font-weight: 600;
      color: #11998e;
    }
    #gameCanvas {
      display: block;
      margin: 0 auto;
      border: 3px solid #11998e;
      border-radius: 8px;
      background: #f8f9fa;
    }
    .hint {
      text-align: center;
      margin-top: 15px;
      color: #888;
      font-size: 14px;
    }
    .control-help {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 15px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 8px;
    }
    .player-controls {
      text-align: center;
    }
    .player-label {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .player1-label {
      color: #ef4444;
    }
    .player2-label {
      color: #3b82f6;
    }
    .controls-list {
      font-size: 12px;
      color: #666;
      line-height: 1.8;
    }
    .keyboard {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-top: 15px;
    }
    .key-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
      align-items: center;
    }
    .key {
      width: 50px;
      height: 50px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #666;
      background: #f8f9fa;
      cursor: pointer;
      user-select: none;
      transition: all 0.1s;
    }
    .key:active {
      background: #11998e;
      color: #fff;
      border-color: #11998e;
    }
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal.show {
      display: flex;
    }
    .modal-content {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      animation: bounceIn 0.5s;
      max-width: 400px;
      width: 90%;
    }
    @keyframes bounceIn {
      0% { transform: scale(0.5); opacity: 0; }
      60% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
    .modal-icon {
      font-size: 60px;
      margin-bottom: 15px;
    }
    .modal-title {
      font-size: 24px;
      font-weight: 700;
      color: #333;
      margin-bottom: 10px;
    }
    .modal-text {
      color: #666;
      margin-bottom: 25px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>⚔️ 双人迷宫对战</h1>
    <p class="subtitle">两位玩家在同一个迷宫中比赛，先到达出口者获胜</p>
  </div>
  <div class="container">
    <div class="control-bar">
      <div class="difficulty-select">
        <label>难度：</label>
        <select id="difficulty" onchange="changeDifficulty()">
          <option value="easy">简单 (9x9)</option>
          <option value="normal" selected>普通 (15x15)</option>
          <option value="hard">困难 (21x21)</option>
        </select>
        <button class="btn" onclick="newGame()">新游戏</button>
      </div>
      <div class="stats">
        <div class="stat-item">
          <span>玩家1步数：</span>
          <span class="stat-value" id="steps1">0</span>
        </div>
        <div class="stat-item">
          <span>玩家2步数：</span>
          <span class="stat-value" id="steps2">0</span>
        </div>
      </div>
    </div>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <div class="control-help">
      <div class="player-controls">
        <div class="player-label player1-label">🔴 玩家1 (WASD)</div>
        <div class="controls-list">
          W - 上<br>
          S - 下<br>
          A - 左<br>
          D - 右
        </div>
      </div>
      <div class="player-controls">
        <div class="player-label player2-label">🔵 玩家2 (方向键)</div>
        <div class="controls-list">
          ↑ - 上<br>
          ↓ - 下<br>
          ← - 左<br>
          → - 右
        </div>
      </div>
    </div>
    
    <p class="hint">💡 两位玩家同时在迷宫中移动，先到达出口（🚪）者获胜！</p>
  </div>
  
  <div class="modal" id="winModal">
    <div class="modal-content">
      <div class="modal-icon" id="winnerIcon">🎉</div>
      <div class="modal-title" id="winnerTitle">玩家1 获胜！</div>
      <div class="modal-text" id="winText">
        玩家1：0步 | 玩家2：0步
      </div>
      <button class="btn" onclick="closeModal()">再玩一次</button>
    </div>
  </div>

  <script>
    var canvas = document.getElementById('gameCanvas');
    var ctx = canvas.getContext('2d');
    
    var config = {
      easy: { size: 9 },
      normal: { size: 15 },
      hard: { size: 21 }
    };
    var currentDifficulty = 'normal';
    var size;
    
    var maze = [];
    var player1 = { x: 1, y: 1 };
    var player2 = { x: 0, y: 0 };
    var exit = { x: 0, y: 0 };
    var steps1 = 0;
    var steps2 = 0;
    var gameOver = false;
    
    var cellSize = 0;
    
    function init() {
      newGame();
      window.addEventListener('keydown', handleKeyDown);
    }
    
    function changeDifficulty() {
      currentDifficulty = document.getElementById('difficulty').value;
      newGame();
    }
    
    function newGame() {
      var cfg = config[currentDifficulty];
      size = cfg.size;
      
      steps1 = 0;
      steps2 = 0;
      gameOver = false;
      
      generateMaze();
      placePlayers();
      placeExit();
      
      cellSize = Math.min(400, window.innerWidth - 100) / size;
      canvas.width = cellSize * size;
      canvas.height = cellSize * size;
      
      updateStats();
      draw();
    }
    
    function generateMaze() {
      maze = Array.from({ length: size }, () => Array(size).fill(1));
      
      var stack = [];
      var startX = 1, startY = 1;
      maze[startY][startX] = 0;
      stack.push({ x: startX, y: startY });
      
      var directions = [
        { dx: 0, dy: -2 },
        { dx: 0, dy: 2 },
        { dx: -2, dy: 0 },
        { dx: 2, dy: 0 }
      ];
      
      while (stack.length > 0) {
        var current = stack[stack.length - 1];
        var neighbors = [];
        
        for (var i = 0; i < directions.length; i++) {
          var nx = current.x + directions[i].dx;
          var ny = current.y + directions[i].dy;
          
          if (nx > 0 && nx < size - 1 && ny > 0 && ny < size - 1 && maze[ny][nx] === 1) {
            neighbors.push({ x: nx, y: ny, dx: directions[i].dx / 2, dy: directions[i].dy / 2 });
          }
        }
        
        if (neighbors.length > 0) {
          var next = neighbors[Math.floor(Math.random() * neighbors.length)];
          maze[current.y + next.dy][current.x + next.dx] = 0;
          maze[next.y][next.x] = 0;
          stack.push({ x: next.x, y: next.y });
        } else {
          stack.pop();
        }
      }
      
      maze[1][1] = 0;
    }
    
    function placePlayers() {
      player1.x = 1;
      player1.y = 1;
      
      player2.x = size - 2;
      player2.y = size - 2;
      
      if (maze[player2.y][player2.x] === 1) {
        player2.x = size - 3;
        player2.y = size - 3;
      }
    }
    
    function placeExit() {
      var emptyCells = [];
      
      for (var y = 0; y < size; y++) {
        for (var x = 0; x < size; x++) {
          if (maze[y][x] === 0 && !(x === player1.x && y === player1.y) && !(x === player2.x && y === player2.y)) {
            emptyCells.push({ x, y });
          }
        }
      }
      
      var centerX = size / 2;
      var centerY = size / 2;
      
      var best = emptyCells[0];
      var minDist = Infinity;
      
      for (var i = 0; i < emptyCells.length; i++) {
        var dist1 = Math.abs(emptyCells[i].x - player1.x) + Math.abs(emptyCells[i].y - player1.y);
        var dist2 = Math.abs(emptyCells[i].x - player2.x) + Math.abs(emptyCells[i].y - player2.y);
        var avgDist = (dist1 + dist2) / 2;
        var centerDist = Math.abs(emptyCells[i].x - centerX) + Math.abs(emptyCells[i].y - centerY);
        
        if (avgDist > minDist && centerDist < minDist * 0.5) {
          minDist = avgDist;
          best = emptyCells[i];
        } else if (avgDist > minDist) {
          minDist = avgDist;
          best = emptyCells[i];
        }
      }
      
      exit = best;
    }
    
    function handleKeyDown(e) {
      if (gameOver) return;
      
      switch (e.key) {
        case 'w':
        case 'W':
          e.preventDefault();
          movePlayer(1, 'up');
          break;
        case 's':
        case 'S':
          e.preventDefault();
          movePlayer(1, 'down');
          break;
        case 'a':
        case 'A':
          e.preventDefault();
          movePlayer(1, 'left');
          break;
        case 'd':
        case 'D':
          e.preventDefault();
          movePlayer(1, 'right');
          break;
        case 'ArrowUp':
          e.preventDefault();
          movePlayer(2, 'up');
          break;
        case 'ArrowDown':
          e.preventDefault();
          movePlayer(2, 'down');
          break;
        case 'ArrowLeft':
          e.preventDefault();
          movePlayer(2, 'left');
          break;
        case 'ArrowRight':
          e.preventDefault();
          movePlayer(2, 'right');
          break;
      }
    }
    
    function movePlayer(playerNum, dir) {
      var player = playerNum === 1 ? player1 : player2;
      var steps = playerNum === 1 ? steps1 : steps2;
      
      var newX = player.x;
      var newY = player.y;
      
      switch (dir) {
        case 'up': newY--; break;
        case 'down': newY++; break;
        case 'left': newX--; break;
        case 'right': newX++; break;
      }
      
      if (newX >= 0 && newX < size && newY >= 0 && newY < size && maze[newY][newX] === 0) {
        var otherPlayer = playerNum === 1 ? player2 : player1;
        if (!(newX === otherPlayer.x && newY === otherPlayer.y)) {
          player.x = newX;
          player.y = newY;
          
          if (playerNum === 1) {
            steps1++;
          } else {
            steps2++;
          }
          
          checkWin(playerNum);
          updateStats();
          draw();
        }
      }
    }
    
    function checkWin(playerNum) {
      var player = playerNum === 1 ? player1 : player2;
      
      if (player.x === exit.x && player.y === exit.y) {
        gameOver = true;
        var winnerIcon = playerNum === 1 ? '🏆' : '🏆';
        var winnerTitle = playerNum === 1 ? '🔴 玩家1 获胜！' : '🔵 玩家2 获胜！';
        
        document.getElementById('winnerIcon').textContent = winnerIcon;
        document.getElementById('winnerTitle').textContent = winnerTitle;
        document.getElementById('winText').textContent = '玩家1：' + steps1 + '步 | 玩家2：' + steps2 + '步';
        document.getElementById('winModal').classList.add('show');
      }
    }
    
    function updateStats() {
      document.getElementById('steps1').textContent = steps1;
      document.getElementById('steps2').textContent = steps2;
    }
    
    function draw() {
      ctx.fillStyle = '#f8f9fa';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      for (var y = 0; y < size; y++) {
        for (var x = 0; x < size; x++) {
          if (maze[y][x] === 1) {
            ctx.fillStyle = '#4a5568';
            ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
            
            ctx.fillStyle = '#2d3748';
            ctx.fillRect(x * cellSize + 2, y * cellSize + 2, cellSize - 4, cellSize - 4);
          } else {
            ctx.fillStyle = '#fff';
            ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
            
            ctx.fillStyle = '#e2e8f0';
            ctx.fillRect(x * cellSize + 1, y * cellSize + 1, cellSize - 2, cellSize - 2);
          }
        }
      }
      
      ctx.font = cellSize * 0.6 + 'px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      ctx.fillText('🚪', exit.x * cellSize + cellSize / 2, exit.y * cellSize + cellSize / 2);
      
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(player1.x * cellSize + cellSize / 2, player1.y * cellSize + cellSize / 2, cellSize / 2 - 4, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.fillStyle = '#fff';
      ctx.font = cellSize * 0.35 + 'px Arial';
      ctx.fillText('P1', player1.x * cellSize + cellSize / 2, player1.y * cellSize + cellSize / 2);
      
      ctx.fillStyle = '#3b82f6';
      ctx.beginPath();
      ctx.arc(player2.x * cellSize + cellSize / 2, player2.y * cellSize + cellSize / 2, cellSize / 2 - 4, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.fillStyle = '#fff';
      ctx.fillText('P2', player2.x * cellSize + cellSize / 2, player2.y * cellSize + cellSize / 2);
    }
    
    function closeModal() {
      document.getElementById('winModal').classList.remove('show');
      newGame();
    }
    
    init();
  </script>
</body>
</html>
