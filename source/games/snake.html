<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="贪吃蛇小游戏，经典益智游戏，使用方向键控制蛇吃食物变长，支持多种难度。">
  <meta name="keywords" content="贪吃蛇,小游戏,经典游戏,方向键控制,益智游戏">
  <meta property="og:title" content="贪吃蛇小游戏">
  <meta property="og:description" content="经典贪吃蛇游戏，方向键控制蛇吃食物变长">
  <title>贪吃蛇小游戏</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0;
    }
    .header {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      padding: 25px 20px;
      text-align: center;
      width: 100%;
    }
    h1 {
      color: #fff;
      margin-bottom: 8px;
      font-size: 28px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }
    .subtitle {
      color: rgba(255,255,255,0.8);
      margin-bottom: 0;
      font-size: 14px;
    }
    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      padding: 30px;
      max-width: 500px;
      width: 100%;
      margin: 20px auto;
    }
    .control-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .difficulty-select {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    select {
      padding: 8px 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }
    select:focus {
      border-color: #11998e;
    }
    .btn {
      padding: 10px 20px;
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
    }
    .stats {
      display: flex;
      gap: 20px;
      font-size: 14px;
      color: #666;
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .stat-value {
      font-weight: 600;
      color: #11998e;
    }
    #gameCanvas {
      display: block;
      margin: 0 auto;
      border: 3px solid #11998e;
      border-radius: 8px;
      background: #f8f9fa;
    }
    .hint {
      text-align: center;
      margin-top: 15px;
      color: #888;
      font-size: 14px;
    }
    .keyboard {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-top: 15px;
    }
    .key-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
      align-items: center;
    }
    .key {
      width: 50px;
      height: 50px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #666;
      background: #f8f9fa;
      cursor: pointer;
      user-select: none;
      transition: all 0.1s;
    }
    .key:active {
      background: #11998e;
      color: #fff;
      border-color: #11998e;
    }
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal.show {
      display: flex;
    }
    .modal-content {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      animation: bounceIn 0.5s;
      max-width: 400px;
      width: 90%;
    }
    @keyframes bounceIn {
      0% { transform: scale(0.5); opacity: 0; }
      60% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
    .modal-icon {
      font-size: 60px;
      margin-bottom: 15px;
    }
    .modal-title {
      font-size: 24px;
      font-weight: 700;
      color: #333;
      margin-bottom: 10px;
    }
    .modal-text {
      color: #666;
      margin-bottom: 25px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🐍 贪吃蛇</h1>
    <p class="subtitle">使用方向键控制蛇移动，吃到食物变长，不能撞到墙壁或自己</p>
  </div>
  <div class="container">
    <div class="control-bar">
      <div class="difficulty-select">
        <label>难度：</label>
        <select id="difficulty" onchange="changeDifficulty()">
          <option value="easy">简单</option>
          <option value="normal" selected>普通</option>
          <option value="hard">困难</option>
          <option value="expert">专家</option>
        </select>
        <button class="btn" onclick="newGame()">新游戏</button>
      </div>
      <div class="stats">
        <div class="stat-item">
          <span>得分：</span>
          <span class="stat-value" id="score">0</span>
        </div>
        <div class="stat-item">
          <span>长度：</span>
          <span class="stat-value" id="length">1</span>
        </div>
      </div>
    </div>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <p class="hint">💡 点击画布或按下方向键即可开始</p>
    
    <div class="keyboard">
      <div class="key-row">
        <div class="key" onclick="changeDirection('up')">↑</div>
        <div style="display: flex; gap: 5px;">
          <div class="key" onclick="changeDirection('left')">←</div>
          <div class="key" onclick="changeDirection('down')">↓</div>
          <div class="key" onclick="changeDirection('right')">→</div>
        </div>
      </div>
    </div>
  </div>
  
  <div class="modal" id="gameOverModal">
    <div class="modal-content">
      <div class="modal-icon">😢</div>
      <div class="modal-title">游戏结束</div>
      <div class="modal-text" id="gameOverText">
        得分：0 | 长度：1
      </div>
      <button class="btn" onclick="closeModal()">再玩一次</button>
    </div>
  </div>

  <script>
    var canvas = document.getElementById('gameCanvas');
    var ctx = canvas.getContext('2d');
    
    var gridSize = 20;
    var gridCount = canvas.width / gridSize;
    
    var snake = [{ x: 10, y: 10 }];
    var direction = { x: 1, y: 0 };
    var nextDirection = { x: 1, y: 0 };
    var food = { x: 15, y: 10 };
    var score = 0;
    var gameLoop = null;
    var gameStarted = false;
    
    var speed = {
      easy: 200,
      normal: 150,
      hard: 100,
      expert: 70
    };
    var currentDifficulty = 'normal';
    
    function init() {
      newGame();
      window.addEventListener('keydown', handleKeyDown);
      canvas.addEventListener('click', function() { canvas.focus(); });
    }
    
    function changeDifficulty() {
      currentDifficulty = document.getElementById('difficulty').value;
      newGame();
    }
    
    function newGame() {
      snake = [{ x: 10, y: 10 }];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      gameStarted = false;
      spawnFood();
      updateStats();
      clearInterval(gameLoop);
      draw();
    }
    
    function spawnFood() {
      do {
        food.x = Math.floor(Math.random() * gridCount);
        food.y = Math.floor(Math.random() * gridCount);
      } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
    }
    
    function handleKeyDown(e) {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.key) === -1) {
        return;
      }
      e.preventDefault();
      
      if (!gameStarted) {
        gameStarted = true;
        gameLoop = setInterval(update, speed[currentDifficulty]);
      }
      
      switch (e.key) {
        case 'ArrowUp':
          if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
          break;
        case 'ArrowDown':
          if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
          break;
        case 'ArrowLeft':
          if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
          break;
        case 'ArrowRight':
          if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
          break;
      }
    }
    
    function changeDirection(dir) {
      if (!gameStarted) {
        gameStarted = true;
        gameLoop = setInterval(update, speed[currentDifficulty]);
      }
      
      switch (dir) {
        case 'up':
          if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
          break;
        case 'down':
          if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
          break;
        case 'left':
          if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
          break;
        case 'right':
          if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
          break;
      }
    }
    
    function update() {
      direction = nextDirection;
      
      var head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
      
      if (head.x < 0 || head.x >= gridCount || head.y < 0 || head.y >= gridCount) {
        gameOver();
        return;
      }
      
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        gameOver();
        return;
      }
      
      snake.unshift(head);
      
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        updateStats();
        spawnFood();
      } else {
        snake.pop();
      }
      
      draw();
    }
    
    function draw() {
      ctx.fillStyle = '#f8f9fa';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      ctx.strokeStyle = '#e0e0e0';
      for (var i = 0; i <= gridCount; i++) {
        ctx.beginPath();
        ctx.moveTo(i * gridSize, 0);
        ctx.lineTo(i * gridSize, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * gridSize);
        ctx.lineTo(canvas.width, i * gridSize);
        ctx.stroke();
      }
      
      ctx.fillStyle = '#ff6b6b';
      ctx.beginPath();
      ctx.arc(food.x * gridSize + gridSize / 2, food.y * gridSize + gridSize / 2, gridSize / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
      
      for (var i = 0; i < snake.length; i++) {
        var segment = snake[i];
        var gradient = ctx.createLinearGradient(
          segment.x * gridSize, segment.y * gridSize,
          (segment.x + 1) * gridSize, (segment.y + 1) * gridSize
        );
        gradient.addColorStop(0, '#11998e');
        gradient.addColorStop(1, '#38ef7d');
        ctx.fillStyle = gradient;
        ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
        
        if (i === 0) {
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          var eyeOffset = gridSize / 5;
          ctx.arc(segment.x * gridSize + gridSize / 2 - eyeOffset, segment.y * gridSize + gridSize / 2 - eyeOffset, 3, 0, Math.PI * 2);
          ctx.arc(segment.x * gridSize + gridSize / 2 + eyeOffset, segment.y * gridSize + gridSize / 2 - eyeOffset, 3, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
    
    function updateStats() {
      document.getElementById('score').textContent = score;
      document.getElementById('length').textContent = snake.length;
    }
    
    function gameOver() {
      clearInterval(gameLoop);
      document.getElementById('gameOverText').textContent = '得分：' + score + ' | 长度：' + snake.length;
      document.getElementById('gameOverModal').classList.add('show');
    }
    
    function closeModal() {
      document.getElementById('gameOverModal').classList.remove('show');
      newGame();
    }
    
    init();
  </script>
</body>
</html>
