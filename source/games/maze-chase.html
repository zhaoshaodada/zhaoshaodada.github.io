<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="迷宫追逐小游戏，躲避敌人到达出口即可获胜。">
  <meta name="keywords" content="迷宫追逐,小游戏,益智游戏,躲避敌人">
  <meta property="og:title" content="迷宫追逐小游戏">
  <meta property="og:description" content="经典迷宫追逐游戏，躲避敌人到达出口">
  <title>迷宫追逐小游戏</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0;
    }
    .header {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      padding: 25px 20px;
      text-align: center;
      width: 100%;
    }
    h1 {
      color: #fff;
      margin-bottom: 8px;
      font-size: 28px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }
    .subtitle {
      color: rgba(255,255,255,0.8);
      margin-bottom: 0;
      font-size: 14px;
    }
    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      padding: 30px;
      max-width: 600px;
      width: 100%;
      margin: 20px auto;
    }
    .control-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .difficulty-select {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    select {
      padding: 8px 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }
    select:focus {
      border-color: #f5576c;
    }
    .btn {
      padding: 10px 20px;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
    }
    .stats {
      display: flex;
      gap: 20px;
      font-size: 14px;
      color: #666;
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .stat-value {
      font-weight: 600;
      color: #f5576c;
    }
    #gameCanvas {
      display: block;
      margin: 0 auto;
      border: 3px solid #f5576c;
      border-radius: 8px;
      background: #f8f9fa;
    }
    .hint {
      text-align: center;
      margin-top: 15px;
      color: #888;
      font-size: 14px;
    }
    .keyboard {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-top: 15px;
    }
    .key-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
      align-items: center;
    }
    .key {
      width: 50px;
      height: 50px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #666;
      background: #f8f9fa;
      cursor: pointer;
      user-select: none;
      transition: all 0.1s;
    }
    .key:active {
      background: #f5576c;
      color: #fff;
      border-color: #f5576c;
    }
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal.show {
      display: flex;
    }
    .modal-content {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      animation: bounceIn 0.5s;
      max-width: 400px;
      width: 90%;
    }
    @keyframes bounceIn {
      0% { transform: scale(0.5); opacity: 0; }
      60% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
    .modal-icon {
      font-size: 60px;
      margin-bottom: 15px;
    }
    .modal-title {
      font-size: 24px;
      font-weight: 700;
      color: #333;
      margin-bottom: 10px;
    }
    .modal-text {
      color: #666;
      margin-bottom: 25px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>👻 迷宫追逐</h1>
    <p class="subtitle">躲避敌人到达出口即可获胜</p>
  </div>
  <div class="container">
    <div class="control-bar">
      <div class="difficulty-select">
        <label>难度：</label>
        <select id="difficulty" onchange="changeDifficulty()">
          <option value="easy">简单 (1敌人)</option>
          <option value="normal" selected>普通 (2敌人)</option>
          <option value="hard">困难 (3敌人)</option>
        </select>
        <button class="btn" onclick="newGame()">新游戏</button>
      </div>
      <div class="stats">
        <div class="stat-item">
          <span>生命：</span>
          <span class="stat-value" id="lives">❤❤❤</span>
        </div>
        <div class="stat-item">
          <span>时间：</span>
          <span class="stat-value" id="time">00:00</span>
        </div>
      </div>
    </div>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <p class="hint">💡 使用方向键移动，躲避敌人（👻）到达出口（🚪）</p>
    
    <div class="keyboard">
      <div class="key-row">
        <div class="key" onclick="move('up')">↑</div>
        <div style="display: flex; gap: 5px;">
          <div class="key" onclick="move('left')">←</div>
          <div class="key" onclick="move('down')">↓</div>
          <div class="key" onclick="move('right')">→</div>
        </div>
      </div>
    </div>
  </div>
  
  <div class="modal" id="winModal">
    <div class="modal-content">
      <div class="modal-icon">🎉</div>
      <div class="modal-title">恭喜通关！</div>
      <div class="modal-text" id="winText">
        用时：00:00
      </div>
      <button class="btn" onclick="closeModal()">再玩一次</button>
    </div>
  </div>
  
  <div class="modal" id="gameOverModal">
    <div class="modal-content">
      <div class="modal-icon">💀</div>
      <div class="modal-title">游戏结束</div>
      <div class="modal-text" id="gameOverText">
        被敌人抓住了！
      </div>
      <button class="btn" onclick="closeModal()">再玩一次</button>
    </div>
  </div>

  <script>
    var canvas = document.getElementById('gameCanvas');
    var ctx = canvas.getContext('2d');
    
    var config = {
      easy: { size: 11, enemies: 1, speed: 800 },
      normal: { size: 15, enemies: 2, speed: 600 },
      hard: { size: 17, enemies: 3, speed: 450 }
    };
    var currentDifficulty = 'normal';
    var size, enemyCount, enemySpeed;
    
    var maze = [];
    var player = { x: 1, y: 1 };
    var exit = { x: 0, y: 0 };
    var enemies = [];
    var lives = 3;
    var startTime = 0;
    var timerInterval = null;
    var enemyInterval = null;
    var gameOver = false;
    
    var cellSize = 0;
    
    function init() {
      newGame();
      window.addEventListener('keydown', handleKeyDown);
    }
    
    function changeDifficulty() {
      currentDifficulty = document.getElementById('difficulty').value;
      newGame();
    }
    
    function newGame() {
      var cfg = config[currentDifficulty];
      size = cfg.size;
      enemyCount = cfg.enemies;
      enemySpeed = cfg.speed;
      
      lives = 3;
      gameOver = false;
      
      generateMaze();
      placeExit();
      placeEnemies();
      
      cellSize = Math.min(400, window.innerWidth - 100) / size;
      canvas.width = cellSize * size;
      canvas.height = cellSize * size;
      
      startTime = Date.now();
      startTimer();
      
      updateStats();
      draw();
      
      startEnemyMovement();
    }
    
    function generateMaze() {
      maze = Array.from({ length: size }, () => Array(size).fill(1));
      
      var stack = [];
      var startX = 1, startY = 1;
      maze[startY][startX] = 0;
      stack.push({ x: startX, y: startY });
      
      var directions = [
        { dx: 0, dy: -2 },
        { dx: 0, dy: 2 },
        { dx: -2, dy: 0 },
        { dx: 2, dy: 0 }
      ];
      
      while (stack.length > 0) {
        var current = stack[stack.length - 1];
        var neighbors = [];
        
        for (var i = 0; i < directions.length; i++) {
          var nx = current.x + directions[i].dx;
          var ny = current.y + directions[i].dy;
          
          if (nx > 0 && nx < size - 1 && ny > 0 && ny < size - 1 && maze[ny][nx] === 1) {
            neighbors.push({ x: nx, y: ny, dx: directions[i].dx / 2, dy: directions[i].dy / 2 });
          }
        }
        
        if (neighbors.length > 0) {
          var next = neighbors[Math.floor(Math.random() * neighbors.length)];
          maze[current.y + next.dy][current.x + next.dx] = 0;
          maze[next.y][next.x] = 0;
          stack.push({ x: next.x, y: next.y });
        } else {
          stack.pop();
        }
      }
      
      maze[1][1] = 0;
    }
    
    function placeExit() {
      var emptyCells = [];
      
      for (var y = 0; y < size; y++) {
        for (var x = 0; x < size; x++) {
          if (maze[y][x] === 0 && !(x === 1 && y === 1)) {
            emptyCells.push({ x, y });
          }
        }
      }
      
      var farthest = emptyCells[0];
      var maxDist = 0;
      
      for (var i = 0; i < emptyCells.length; i++) {
        var dist = Math.abs(emptyCells[i].x - 1) + Math.abs(emptyCells[i].y - 1);
        if (dist > maxDist) {
          maxDist = dist;
          farthest = emptyCells[i];
        }
      }
      
      exit = farthest;
    }
    
    function placeEnemies() {
      enemies = [];
      var emptyCells = [];
      
      for (var y = 0; y < size; y++) {
        for (var x = 0; x < size; x++) {
          if (maze[y][x] === 0 && !(x === 1 && y === 1) && !(x === exit.x && y === exit.y)) {
            emptyCells.push({ x, y });
          }
        }
      }
      
      for (var i = 0; i < enemyCount; i++) {
        if (emptyCells.length === 0) break;
        var index = Math.floor(Math.random() * emptyCells.length);
        enemies.push({ x: emptyCells[index].x, y: emptyCells[index].y });
        emptyCells.splice(index, 1);
      }
    }
    
    function handleKeyDown(e) {
      if (gameOver) return;
      
      switch (e.key) {
        case 'ArrowUp':
        case 'w':
        case 'W':
          e.preventDefault();
          move('up');
          break;
        case 'ArrowDown':
        case 's':
        case 'S':
          e.preventDefault();
          move('down');
          break;
        case 'ArrowLeft':
        case 'a':
        case 'A':
          e.preventDefault();
          move('left');
          break;
        case 'ArrowRight':
        case 'd':
        case 'D':
          e.preventDefault();
          move('right');
          break;
      }
    }
    
    function move(dir) {
      var newX = player.x;
      var newY = player.y;
      
      switch (dir) {
        case 'up': newY--; break;
        case 'down': newY++; break;
        case 'left': newX--; break;
        case 'right': newX++; break;
      }
      
      if (newX >= 0 && newX < size && newY >= 0 && newY < size && maze[newY][newX] === 0) {
        player.x = newX;
        player.y = newY;
        
        checkExit();
        checkCollision();
        
        updateStats();
        draw();
      }
    }
    
    function startEnemyMovement() {
      if (enemyInterval) clearInterval(enemyInterval);
      enemyInterval = setInterval(updateEnemies, enemySpeed);
    }
    
    function updateEnemies() {
      if (gameOver) return;
      
      for (var i = 0; i < enemies.length; i++) {
        moveEnemy(i);
      }
      
      checkCollision();
      draw();
    }
    
    function moveEnemy(index) {
      var enemy = enemies[index];
      var directions = [
        { dx: 0, dy: -1 },
        { dx: 0, dy: 1 },
        { dx: -1, dy: 0 },
        { dx: 1, dy: 0 }
      ];
      
      var validMoves = [];
      for (var i = 0; i < directions.length; i++) {
        var nx = enemy.x + directions[i].dx;
        var ny = enemy.y + directions[i].dy;
        if (nx >= 0 && nx < size && ny >= 0 && ny < size && maze[ny][nx] === 0) {
          validMoves.push(directions[i]);
        }
      }
      
      if (validMoves.length > 0) {
        var distToPlayer = function(dx, dy) {
          return Math.abs((enemy.x + dx) - player.x) + Math.abs((enemy.y + dy) - player.y);
        };
        
        validMoves.sort(function(a, b) {
          return distToPlayer(a.dx, a.dy) - distToPlayer(b.dx, b.dy);
        });
        
        var moveProb = Math.random();
        var selectedMove;
        
        if (moveProb < 0.6) {
          selectedMove = validMoves[0];
        } else if (moveProb < 0.85) {
          selectedMove = validMoves[Math.floor(Math.random() * validMoves.length)];
        } else {
          selectedMove = validMoves[validMoves.length - 1];
        }
        
        enemy.x += selectedMove.dx;
        enemy.y += selectedMove.dy;
      }
    }
    
    function checkCollision() {
      for (var i = 0; i < enemies.length; i++) {
        if (enemies[i].x === player.x && enemies[i].y === player.y) {
          lives--;
          updateStats();
          
          if (lives <= 0) {
            gameOver = true;
            stopTimer();
            clearInterval(enemyInterval);
            document.getElementById('gameOverModal').classList.add('show');
          } else {
            resetPlayer();
          }
          return;
        }
      }
    }
    
    function resetPlayer() {
      player.x = 1;
      player.y = 1;
    }
    
    function checkExit() {
      if (player.x === exit.x && player.y === exit.y) {
        gameOver = true;
        stopTimer();
        clearInterval(enemyInterval);
        document.getElementById('winText').textContent = '用时：' + document.getElementById('time').textContent;
        document.getElementById('winModal').classList.add('show');
      }
    }
    
    function startTimer() {
      stopTimer();
      timerInterval = setInterval(updateTimer, 1000);
    }
    
    function updateTimer() {
      var elapsed = Math.floor((Date.now() - startTime) / 1000);
      var minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
      var seconds = (elapsed % 60).toString().padStart(2, '0');
      document.getElementById('time').textContent = minutes + ':' + seconds;
    }
    
    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }
    
    function updateStats() {
      var hearts = '';
      for (var i = 0; i < lives; i++) hearts += '❤';
      for (var i = lives; i < 3; i++) hearts += '🖤';
      document.getElementById('lives').textContent = hearts;
    }
    
    function draw() {
      ctx.fillStyle = '#f8f9fa';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      for (var y = 0; y < size; y++) {
        for (var x = 0; x < size; x++) {
          if (maze[y][x] === 1) {
            ctx.fillStyle = '#4a5568';
            ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
            
            ctx.fillStyle = '#2d3748';
            ctx.fillRect(x * cellSize + 2, y * cellSize + 2, cellSize - 4, cellSize - 4);
          } else {
            ctx.fillStyle = '#fff';
            ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
            
            ctx.fillStyle = '#e2e8f0';
            ctx.fillRect(x * cellSize + 1, y * cellSize + 1, cellSize - 2, cellSize - 2);
          }
        }
      }
      
      ctx.font = cellSize * 0.6 + 'px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      ctx.fillText('🚪', exit.x * cellSize + cellSize / 2, exit.y * cellSize + cellSize / 2);
      
      for (var i = 0; i < enemies.length; i++) {
        ctx.fillText('👻', enemies[i].x * cellSize + cellSize / 2, enemies[i].y * cellSize + cellSize / 2);
      }
      
      ctx.fillStyle = '#48bb78';
      ctx.beginPath();
      ctx.arc(player.x * cellSize + cellSize / 2, player.y * cellSize + cellSize / 2, cellSize / 2 - 4, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.fillStyle = '#fff';
      ctx.font = cellSize * 0.4 + 'px Arial';
      ctx.fillText('🧑', player.x * cellSize + cellSize / 2, player.y * cellSize + cellSize / 2);
    }
    
    function closeModal() {
      document.getElementById('winModal').classList.remove('show');
      document.getElementById('gameOverModal').classList.remove('show');
      newGame();
    }
    
    init();
  </script>
</body>
</html>
