<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="迷宫小游戏，自动生成随机迷宫，使用键盘方向键控制小人从起点走到终点，支持多种难度。">
  <meta name="keywords" content="迷宫游戏,小游戏,方向键控制,走迷宫,益智游戏">
  <meta property="og:title" content="迷宫小游戏">
  <meta property="og:description" content="自动生成随机迷宫，方向键控制小人走出迷宫">
  <title>迷宫小游戏</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0;
    }
    .header {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      padding: 25px 20px;
      text-align: center;
      width: 100%;
    }
    h1 {
      color: #fff;
      margin-bottom: 8px;
      font-size: 28px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }
    .subtitle {
      color: rgba(255,255,255,0.8);
      margin-bottom: 0;
      font-size: 14px;
    }
    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      padding: 30px;
      max-width: 700px;
      width: 100%;
      margin: 20px auto;
    }
    .control-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .difficulty-select {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    select {
      padding: 8px 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }
    select:focus {
      border-color: #667eea;
    }
    .btn {
      padding: 10px 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
    }
    .stats {
      display: flex;
      gap: 20px;
      font-size: 14px;
      color: #666;
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .stat-value {
      font-weight: 600;
      color: #667eea;
    }
    #mazeCanvas {
      display: block;
      margin: 0 auto;
      border: 3px solid #667eea;
      border-radius: 8px;
      background: #f8f9fa;
    }
    .hint {
      text-align: center;
      margin-top: 15px;
      color: #888;
      font-size: 14px;
    }
    .keyboard {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-top: 15px;
    }
    .key-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
      align-items: center;
    }
    .key {
      width: 50px;
      height: 50px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #666;
      background: #f8f9fa;
      cursor: pointer;
      user-select: none;
      transition: all 0.1s;
    }
    .key:active {
      background: #667eea;
      color: #fff;
      border-color: #667eea;
    }
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal.show {
      display: flex;
    }
    .modal-content {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      animation: bounceIn 0.5s;
      max-width: 400px;
      width: 90%;
    }
    @keyframes bounceIn {
      0% { transform: scale(0.5); opacity: 0; }
      60% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
    .modal-icon {
      font-size: 60px;
      margin-bottom: 15px;
    }
    .modal-title {
      font-size: 24px;
      font-weight: 700;
      color: #333;
      margin-bottom: 10px;
    }
    .modal-text {
      color: #666;
      margin-bottom: 25px;
      line-height: 1.8;
    }
    .tip {
      margin-top: 20px;
      padding: 15px;
      background: #f3e8ff;
      border-radius: 8px;
      border-left: 4px solid #764ba2;
      font-size: 14px;
      color: #5a189a;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎮 迷宫逃脱</h1>
    <p class="subtitle">使用方向键控制小人，从起点走到终点</p>
  </div>
  <div class="container">
    <div class="control-bar">
      <div class="difficulty-select">
        <label>难度：</label>
        <select id="difficulty" onchange="changeDifficulty()">
          <option value="easy">简单 (11x11)</option>
          <option value="normal" selected>普通 (15x15)</option>
          <option value="hard">困难 (21x21)</option>
          <option value="expert">专家 (31x31)</option>
        </select>
        <button class="btn" onclick="newGame()">新游戏</button>
      </div>
      <div class="stats">
        <div class="stat-item">
          <span>步数：</span>
          <span class="stat-value" id="steps">0</span>
        </div>
        <div class="stat-item">
          <span>时间：</span>
          <span class="stat-value" id="time">00:00</span>
        </div>
      </div>
    </div>
    
    <canvas id="mazeCanvas" width="600" height="600"></canvas>
    
    <p class="hint">💡 点击画布或按下方向键即可开始</p>
    
    <div class="keyboard">
      <div class="key-row">
        <div class="key" onclick="movePlayer('up')">↑</div>
        <div style="display: flex; gap: 5px;">
          <div class="key" onclick="movePlayer('left')">←</div>
          <div class="key" onclick="movePlayer('down')">↓</div>
          <div class="key" onclick="movePlayer('right')">→</div>
        </div>
      </div>
    </div>
    
    <div class="tip">
      💡 提示：红色圆点是起点，绿色方块是终点。找到通往终点的路径即可获胜！小人会按 180-250ms 切换两帧走路动画。
    </div>
  </div>
  
  <div class="modal" id="winModal">
    <div class="modal-content">
      <div class="modal-icon">🎉</div>
      <div class="modal-title">恭喜通关！</div>
      <div class="modal-text" id="winText">
        你成功走出了迷宫！<br>
        步数：0 | 时间：00:00
      </div>
      <button class="btn" onclick="closeModal()">再玩一次</button>
    </div>
  </div>

  <script>
    var canvas = document.getElementById('mazeCanvas');
    var ctx = canvas.getContext('2d');
    var difficulty = {
      easy: { size: 11, cellSize: 50 },
      normal: { size: 15, cellSize: 36 },
      hard: { size: 21, cellSize: 26 },
      expert: { size: 31, cellSize: 18 }
    };
    
    var currentDifficulty = 'normal';
    var maze = [];
    var player = { x: 1, y: 1 };
    var playerRender = { x: 1, y: 1 }; // 实际渲染的插值位置
    var exit = { x: 0, y: 0 };
    var steps = 0;
    var startTime = null;
    var timerInterval = null;
    var gameStarted = false;
    var moveState = 'idle'; // idle | up | down | left | right
    var walkFrame = 0; // 0 or 1: 两张走路帧
    var walkFrameTimer = null;
    var walkFrameInterval = 220; // 180-250ms 之间
    
    // 移动动画相关
    var isMoving = false;
    var moveFrom = { x: 0, y: 0 };
    var moveTo = { x: 0, y: 0 };
    var moveStartTime = 0;
    var moveDuration = 220; // 单格移动时长
    var moveAnimFrame = null;
    var isAnimating = false;
    
    var playerImages = [];
    var imagesReady = false;
    var initDone = false;
    
    function preloadImages() {
      var sources = [
        '/games/img.png',
        '/games/img_1.png'
      ];
      var loaded = 0;
      sources.forEach(function(src) {
        var img = new Image();
        img.onload = function() {
          loaded++;
          if (loaded === sources.length) {
            imagesReady = true;
            if (initDone) {
              drawMaze();
            }
          }
        };
        img.onerror = function() {
          loaded++;
          if (loaded === sources.length) {
            imagesReady = true;
            if (initDone) {
              drawMaze();
            }
          }
        };
        img.src = src;
        playerImages.push(img);
      });
    }
    
    function init() {
      preloadImages();
      newGame();
      initDone = true;
      // 如果图片已经加载好，立即重绘
      if (imagesReady) {
        drawMaze();
      }
      window.addEventListener('keydown', handleKeyDown);
      canvas.addEventListener('click', function() { canvas.focus(); });
    }
    
    function changeDifficulty() {
      currentDifficulty = document.getElementById('difficulty').value;
      newGame();
    }
    
    function newGame() {
      var config = difficulty[currentDifficulty];
      var size = config.size;
      var cellSize = config.cellSize;
      
      canvas.width = size * cellSize;
      canvas.height = size * cellSize;
      
      maze = generateMaze(size);
      player = { x: 1, y: 1 };
      playerRender = { x: 1, y: 1 };
      exit = { x: size - 2, y: size - 2 };
      steps = 0;
      gameStarted = false;
      moveState = 'down';
      walkFrame = 0;
      isMoving = false;
      
      stopTimer();
      stopWalkAnimation();
      cancelMoveAnimation();
      
      document.getElementById('steps').textContent = '0';
      document.getElementById('time').textContent = '00:00';
      
      drawMaze();
    }
    
    function generateMaze(size) {
      var maze = [];
      for (var i = 0; i < size; i++) {
        maze[i] = [];
        for (var j = 0; j < size; j++) {
          maze[i][j] = 1;
        }
      }
      
      var stack = [];
      var current = { x: 1, y: 1 };
      maze[1][1] = 0;
      stack.push(current);
      
      var directions = [
        { dx: 0, dy: -2 },
        { dx: 0, dy: 2 },
        { dx: -2, dy: 0 },
        { dx: 2, dy: 0 }
      ];
      
      while (stack.length > 0) {
        var neighbors = [];
        
        for (var i = 0; i < directions.length; i++) {
          var nx = current.x + directions[i].dx;
          var ny = current.y + directions[i].dy;
          
          if (nx > 0 && nx < size - 1 && ny > 0 && ny < size - 1 && maze[ny][nx] === 1) {
            neighbors.push({ x: nx, y: ny, dx: directions[i].dx / 2, dy: directions[i].dy / 2 });
          }
        }
        
        if (neighbors.length > 0) {
          var next = neighbors[Math.floor(Math.random() * neighbors.length)];
          maze[current.y + next.dy][current.x + next.dx] = 0;
          maze[next.y][next.x] = 0;
          stack.push({ x: next.x, y: next.y });
          current = { x: next.x, y: next.y };
        } else {
          current = stack.pop();
        }
      }
      
      return maze;
    }
    
    function drawMaze() {
      var config = difficulty[currentDifficulty];
      var cellSize = config.cellSize;
      var size = config.size;
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      for (var y = 0; y < size; y++) {
        for (var x = 0; x < size; x++) {
          if (maze[y][x] === 1) {
            ctx.fillStyle = '#667eea';
            ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
          } else {
            ctx.fillStyle = '#f8f9fa';
            ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
          }
        }
      }
      
      // 绘制终点
      ctx.fillStyle = '#4caf50';
      ctx.fillRect(exit.x * cellSize + 4, exit.y * cellSize + 4, cellSize - 8, cellSize - 8);
      ctx.fillStyle = '#fff';
      ctx.font = (cellSize * 0.5) + 'px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🏁', exit.x * cellSize + cellSize / 2, exit.y * cellSize + cellSize / 2);
      
      // 绘制玩家
      drawPlayer();
    }
    
    function drawPlayer() {
      var config = difficulty[currentDifficulty];
      var cellSize = config.cellSize;
      var cx = playerRender.x * cellSize + cellSize / 2;
      var cy = playerRender.y * cellSize + cellSize / 2;
      var size = cellSize * 0.85;
      
      if (imagesReady && playerImages.length >= 2 && playerImages[0].complete && playerImages[0].naturalWidth > 0) {
        // 走动时使用两张图片交替显示，静止时使用第一张
        var imgIndex = (isMoving && walkFrame === 1) ? 1 : 0;
        var img = playerImages[imgIndex];
        
        ctx.save();
        // 根据方向水平翻转
        if (moveState === 'left') {
          ctx.translate(cx + size / 2, cy - size / 2);
          ctx.scale(-1, 1);
          ctx.drawImage(img, 0, 0, size, size);
        } else {
          ctx.drawImage(img, cx - size / 2, cy - size / 2, size, size);
        }
        ctx.restore();
      } else {
        // 图片未加载完成时使用占位圆点
        ctx.fillStyle = '#ff6b6b';
        ctx.beginPath();
        ctx.arc(cx, cy, cellSize / 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    
    function startWalkAnimation() {
      if (walkFrameTimer) return;
      // 根据移动速度在 180-250ms 之间随机选择
      walkFrameInterval = 180 + Math.floor(Math.random() * 70);
      walkFrameTimer = setInterval(function() {
        walkFrame = walkFrame === 0 ? 1 : 0;
        drawMaze();
      }, walkFrameInterval);
    }
    
    function stopWalkAnimation() {
      if (walkFrameTimer) {
        clearInterval(walkFrameTimer);
        walkFrameTimer = null;
        walkFrame = 0;
      }
    }
    
    function cancelMoveAnimation() {
      if (moveAnimFrame) {
        cancelAnimationFrame(moveAnimFrame);
        moveAnimFrame = null;
      }
      isAnimating = false;
    }
    
    function animateMove() {
      if (!isAnimating) return;
      var now = Date.now();
      var elapsed = now - moveStartTime;
      var progress = Math.min(elapsed / moveDuration, 1);
      
      // 缓动函数：ease-out
      var ease = 1 - Math.pow(1 - progress, 2);
      
      playerRender.x = moveFrom.x + (moveTo.x - moveFrom.x) * ease;
      playerRender.y = moveFrom.y + (moveTo.y - moveFrom.y) * ease;
      
      drawMaze();
      
      if (progress < 1) {
        moveAnimFrame = requestAnimationFrame(animateMove);
      } else {
        // 动画完成
        playerRender.x = moveTo.x;
        playerRender.y = moveTo.y;
        isMoving = false;
        isAnimating = false;
        moveAnimFrame = null;
        stopWalkAnimation();
        drawMaze();
        
        // 检查是否到达终点
        if (player.x === exit.x && player.y === exit.y) {
          gameWin();
        }
      }
    }
    
    function handleKeyDown(e) {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.key) === -1) {
        return;
      }
      e.preventDefault();
      
      switch (e.key) {
        case 'ArrowUp': movePlayer('up'); break;
        case 'ArrowDown': movePlayer('down'); break;
        case 'ArrowLeft': movePlayer('left'); break;
        case 'ArrowRight': movePlayer('right'); break;
      }
    }
    
    function movePlayer(direction) {
      // 每次按键只处理一格
      if (isAnimating) return;
      
      if (!gameStarted) {
        gameStarted = true;
        startTime = Date.now();
        timerInterval = setInterval(updateTimer, 1000);
      }
      
      // 更新朝向
      switch (direction) {
        case 'up': moveState = 'up'; break;
        case 'down': moveState = 'down'; break;
        case 'left': moveState = 'left'; break;
        case 'right': moveState = 'right'; break;
      }
      
      var nx = player.x;
      var ny = player.y;
      
      switch (direction) {
        case 'up': ny--; break;
        case 'down': ny++; break;
        case 'left': nx--; break;
        case 'right': nx++; break;
      }
      
      // 检查目标格子是否可走
      if (!maze[ny] || maze[ny][nx] !== 0) {
        // 撞墙，只更新朝向
        drawMaze();
        return;
      }
      
      // 启动走路帧切换动画
      startWalkAnimation();
      
      // 启动位置插值动画
      isMoving = true;
      isAnimating = true;
      moveFrom.x = playerRender.x;
      moveFrom.y = playerRender.y;
      moveTo.x = nx;
      moveTo.y = ny;
      moveStartTime = Date.now();
      
      // 立即更新逻辑位置（用于步数计算）
      player.x = nx;
      player.y = ny;
      steps++;
      document.getElementById('steps').textContent = steps;
      
      moveAnimFrame = requestAnimationFrame(animateMove);
    }
    
    function updateTimer() {
      var elapsed = Math.floor((Date.now() - startTime) / 1000);
      var minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
      var seconds = (elapsed % 60).toString().padStart(2, '0');
      document.getElementById('time').textContent = minutes + ':' + seconds;
    }
    
    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }
    
    function gameWin() {
      stopTimer();
      var timeStr = document.getElementById('time').textContent;
      document.getElementById('winText').innerHTML = 
        '你成功走出了迷宫！<br>步数：' + steps + ' | 时间：' + timeStr;
      document.getElementById('winModal').classList.add('show');
    }
    
    function closeModal() {
      document.getElementById('winModal').classList.remove('show');
      newGame();
    }
    
    init();
  </script>
</body>
</html>
