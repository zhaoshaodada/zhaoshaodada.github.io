<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="3D迷宫小游戏，第一人称视角体验迷宫探索。">
  <meta name="keywords" content="3D迷宫,小游戏,第一人称,3D游戏">
  <meta property="og:title" content="3D迷宫小游戏">
  <meta property="og:description" content="第一人称视角3D迷宫探索游戏">
  <title>3D迷宫小游戏</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0;
      overflow: hidden;
    }
    .header {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      padding: 20px;
      text-align: center;
      width: 100%;
      z-index: 10;
    }
    h1 {
      color: #fff;
      margin-bottom: 8px;
      font-size: 24px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }
    .subtitle {
      color: rgba(255,255,255,0.7);
      margin-bottom: 0;
      font-size: 12px;
    }
    .control-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      margin-bottom: 10px;
    }
    .stats {
      display: flex;
      gap: 20px;
      font-size: 14px;
      color: #fff;
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .stat-value {
      font-weight: 600;
      color: #00ff88;
    }
    .btn {
      padding: 8px 16px;
      background: rgba(0,255,136,0.2);
      color: #00ff88;
      border: 1px solid #00ff88;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      background: rgba(0,255,136,0.3);
      transform: translateY(-2px);
    }
    .game-area {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
    }
    #gameCanvas {
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      background: #0a0a12;
    }
    .hint {
      text-align: center;
      color: rgba(255,255,255,0.5);
      font-size: 12px;
      margin-top: 10px;
    }
    .keyboard {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-top: 15px;
      padding-bottom: 20px;
    }
    .key-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
      align-items: center;
    }
    .key {
      width: 50px;
      height: 50px;
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.05);
      cursor: pointer;
      user-select: none;
      transition: all 0.1s;
    }
    .key:active {
      background: rgba(0,255,136,0.3);
      color: #00ff88;
      border-color: #00ff88;
    }
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal.show {
      display: flex;
    }
    .modal-content {
      background: #1a1a2e;
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      animation: bounceIn 0.5s;
      max-width: 400px;
      width: 90%;
      border: 1px solid rgba(255,255,255,0.1);
    }
    @keyframes bounceIn {
      0% { transform: scale(0.5); opacity: 0; }
      60% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
    .modal-icon {
      font-size: 60px;
      margin-bottom: 15px;
    }
    .modal-title {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 10px;
    }
    .modal-text {
      color: rgba(255,255,255,0.7);
      margin-bottom: 25px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎮 3D迷宫</h1>
    <p class="subtitle">第一人称视角探索迷宫，找到出口</p>
  </div>
  
  <div class="control-bar">
    <div class="stats">
      <div class="stat-item">
        <span>位置：</span>
        <span class="stat-value" id="position">(1, 1)</span>
      </div>
      <div class="stat-item">
        <span>步数：</span>
        <span class="stat-value" id="steps">0</span>
      </div>
    </div>
    <button class="btn" onclick="newGame()">新游戏</button>
  </div>
  
  <div class="game-area">
    <canvas id="gameCanvas" width="600" height="400"></canvas>
  </div>
  
  <p class="hint">💡 WASD 或方向键移动，空格键转身</p>
  
  <div class="keyboard">
    <div class="key-row">
      <div class="key" onclick="move('forward')">↑</div>
      <div style="display: flex; gap: 5px;">
        <div class="key" onclick="move('left')">←</div>
        <div class="key" onclick="move('backward')">↓</div>
        <div class="key" onclick="move('right')">→</div>
      </div>
    </div>
  </div>
  
  <div class="modal" id="winModal">
    <div class="modal-content">
      <div class="modal-icon">🎉</div>
      <div class="modal-title">恭喜通关！</div>
      <div class="modal-text" id="winText">
        步数：0
      </div>
      <button class="btn" onclick="closeModal()">再玩一次</button>
    </div>
  </div>

  <script>
    var canvas = document.getElementById('gameCanvas');
    var ctx = canvas.getContext('2d');
    
    var size = 9;
    var cellSize = 60;
    var viewDistance = 4;
    
    var maze = [];
    var player = { x: 1, y: 1, angle: 0 };
    var exit = { x: 0, y: 0 };
    var steps = 0;
    
    var rays = 120;
    var fov = Math.PI / 3;
    
    function init() {
      newGame();
      window.addEventListener('keydown', handleKeyDown);
    }
    
    function newGame() {
      steps = 0;
      player.x = 1;
      player.y = 1;
      player.angle = 0;
      
      generateMaze();
      placeExit();
      
      updateStats();
      draw();
    }
    
    function generateMaze() {
      maze = Array.from({ length: size }, () => Array(size).fill(1));
      
      var stack = [];
      var startX = 1, startY = 1;
      maze[startY][startX] = 0;
      stack.push({ x: startX, y: startY });
      
      var directions = [
        { dx: 0, dy: -2 },
        { dx: 0, dy: 2 },
        { dx: -2, dy: 0 },
        { dx: 2, dy: 0 }
      ];
      
      while (stack.length > 0) {
        var current = stack[stack.length - 1];
        var neighbors = [];
        
        for (var i = 0; i < directions.length; i++) {
          var nx = current.x + directions[i].dx;
          var ny = current.y + directions[i].dy;
          
          if (nx > 0 && nx < size - 1 && ny > 0 && ny < size - 1 && maze[ny][nx] === 1) {
            neighbors.push({ x: nx, y: ny, dx: directions[i].dx / 2, dy: directions[i].dy / 2 });
          }
        }
        
        if (neighbors.length > 0) {
          var next = neighbors[Math.floor(Math.random() * neighbors.length)];
          maze[current.y + next.dy][current.x + next.dx] = 0;
          maze[next.y][next.x] = 0;
          stack.push({ x: next.x, y: next.y });
        } else {
          stack.pop();
        }
      }
      
      maze[1][1] = 0;
    }
    
    function placeExit() {
      var emptyCells = [];
      
      for (var y = 0; y < size; y++) {
        for (var x = 0; x < size; x++) {
          if (maze[y][x] === 0 && !(x === 1 && y === 1)) {
            emptyCells.push({ x, y });
          }
        }
      }
      
      var farthest = emptyCells[0];
      var maxDist = 0;
      
      for (var i = 0; i < emptyCells.length; i++) {
        var dist = Math.abs(emptyCells[i].x - 1) + Math.abs(emptyCells[i].y - 1);
        if (dist > maxDist) {
          maxDist = dist;
          farthest = emptyCells[i];
        }
      }
      
      exit = farthest;
    }
    
    function handleKeyDown(e) {
      switch (e.key) {
        case 'ArrowUp':
        case 'w':
        case 'W':
          e.preventDefault();
          move('forward');
          break;
        case 'ArrowDown':
        case 's':
        case 'S':
          e.preventDefault();
          move('backward');
          break;
        case 'ArrowLeft':
        case 'a':
        case 'A':
          e.preventDefault();
          move('left');
          break;
        case 'ArrowRight':
        case 'd':
        case 'D':
          e.preventDefault();
          move('right');
          break;
        case ' ':
          e.preventDefault();
          player.angle += Math.PI / 2;
          draw();
          break;
      }
    }
    
    function move(dir) {
      var speed = 0.5;
      var newX = player.x;
      var newY = player.y;
      
      switch (dir) {
        case 'forward':
          newX += Math.cos(player.angle) * speed;
          newY += Math.sin(player.angle) * speed;
          break;
        case 'backward':
          newX -= Math.cos(player.angle) * speed;
          newY -= Math.sin(player.angle) * speed;
          break;
        case 'left':
          player.angle -= 0.15;
          draw();
          return;
        case 'right':
          player.angle += 0.15;
          draw();
          return;
      }
      
      var gridX = Math.floor(newX);
      var gridY = Math.floor(newY);
      
      if (gridX >= 0 && gridX < size && gridY >= 0 && gridY < size && maze[gridY][gridX] === 0) {
        player.x = newX;
        player.y = newY;
        steps++;
        updateStats();
        draw();
      }
      
      checkExit();
    }
    
    function checkExit() {
      var gridX = Math.floor(player.x);
      var gridY = Math.floor(player.y);
      
      if (gridX === exit.x && gridY === exit.y) {
        document.getElementById('winText').textContent = '步数：' + steps;
        document.getElementById('winModal').classList.add('show');
      }
    }
    
    function updateStats() {
      document.getElementById('position').textContent = '(' + Math.floor(player.x) + ', ' + Math.floor(player.y) + ')';
      document.getElementById('steps').textContent = steps;
    }
    
    function draw() {
      ctx.fillStyle = '#0a0a12';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      var ceilingGradient = ctx.createLinearGradient(0, 0, 0, canvas.height / 2);
      ceilingGradient.addColorStop(0, '#1a1a2e');
      ceilingGradient.addColorStop(1, '#0a0a12');
      ctx.fillStyle = ceilingGradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height / 2);
      
      var floorGradient = ctx.createLinearGradient(0, canvas.height / 2, 0, canvas.height);
      floorGradient.addColorStop(0, '#0a0a12');
      floorGradient.addColorStop(1, '#1a1a2e');
      ctx.fillStyle = floorGradient;
      ctx.fillRect(0, canvas.height / 2, canvas.width, canvas.height / 2);
      
      var stepAngle = fov / rays;
      var startAngle = player.angle - fov / 2;
      
      for (var i = 0; i < rays; i++) {
        var angle = startAngle + stepAngle * i;
        var rayResult = castRay(angle);
        
        var distance = rayResult.distance;
        var hitX = rayResult.hitX;
        var hitY = rayResult.hitY;
        
        var wallHeight = canvas.height / (distance * Math.cos(angle - player.angle));
        var wallWidth = canvas.width / rays;
        
        var colorShade = 255 - Math.min(255, distance * 30);
        var color = 'rgb(' + colorShade + ', ' + (colorShade * 0.7) + ', ' + (colorShade * 0.5) + ')';
        
        if (hitX === Math.floor(hitX) && hitX !== player.x) {
          color = 'rgb(' + colorShade + ', ' + (colorShade * 0.6) + ', ' + (colorShade * 0.4) + ')';
        }
        
        ctx.fillStyle = color;
        
        var x = i * wallWidth;
        var y = (canvas.height - wallHeight) / 2;
        
        ctx.fillRect(x, y, wallWidth + 1, wallHeight);
        
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(x, y, wallWidth + 1, 5);
        
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.fillRect(x, y + wallHeight - 5, wallWidth + 1, 5);
      }
      
      drawMinimap();
    }
    
    function castRay(angle) {
      var step = 0.05;
      var distance = 0;
      var x = player.x;
      var y = player.y;
      
      while (distance < viewDistance) {
        x += Math.cos(angle) * step;
        y += Math.sin(angle) * step;
        distance += step;
        
        var gridX = Math.floor(x);
        var gridY = Math.floor(y);
        
        if (gridX < 0 || gridX >= size || gridY < 0 || gridY >= size) {
          return { distance: viewDistance, hitX: x, hitY: y };
        }
        
        if (maze[gridY][gridX] === 1) {
          return { distance: distance, hitX: x, hitY: y };
        }
      }
      
      return { distance: viewDistance, hitX: x, hitY: y };
    }
    
    function drawMinimap() {
      var minimapSize = 120;
      var minimapX = canvas.width - minimapSize - 10;
      var minimapY = 10;
      var cellSize = minimapSize / size;
      
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(minimapX, minimapY, minimapSize, minimapSize);
      
      for (var y = 0; y < size; y++) {
        for (var x = 0; x < size; x++) {
          var px = minimapX + x * cellSize;
          var py = minimapY + y * cellSize;
          
          if (maze[y][x] === 1) {
            ctx.fillStyle = '#4a5568';
            ctx.fillRect(px, py, cellSize, cellSize);
          } else {
            ctx.fillStyle = '#fff';
            ctx.fillRect(px, py, cellSize, cellSize);
          }
        }
      }
      
      ctx.fillStyle = '#ff4444';
      ctx.fillRect(minimapX + exit.x * cellSize, minimapY + exit.y * cellSize, cellSize, cellSize);
      
      ctx.fillStyle = '#00ff88';
      ctx.beginPath();
      ctx.arc(minimapX + player.x * cellSize, minimapY + player.y * cellSize, cellSize / 2, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.strokeStyle = '#00ff88';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(minimapX + player.x * cellSize, minimapY + player.y * cellSize);
      ctx.lineTo(
        minimapX + player.x * cellSize + Math.cos(player.angle) * cellSize,
        minimapY + player.y * cellSize + Math.sin(player.angle) * cellSize
      );
      ctx.stroke();
    }
    
    function closeModal() {
      document.getElementById('winModal').classList.remove('show');
      newGame();
    }
    
    init();
  </script>
</body>
</html>
