<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="别踩白块小游戏，经典反应游戏，快速点击黑色方块，不要踩到白色方块。">
  <meta name="keywords" content="别踩白块,小游戏,反应游戏,钢琴块">
  <meta property="og:title" content="别踩白块小游戏">
  <meta property="og:description" content="经典别踩白块游戏，快速点击黑色方块">
  <title>别踩白块小游戏</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0;
      overflow: hidden;
    }
    .header {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      padding: 20px;
      text-align: center;
      width: 100%;
      z-index: 10;
    }
    h1 {
      color: #fff;
      margin-bottom: 8px;
      font-size: 24px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }
    .subtitle {
      color: rgba(255,255,255,0.7);
      margin-bottom: 0;
      font-size: 12px;
    }
    .control-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      margin-bottom: 10px;
    }
    .stats {
      display: flex;
      gap: 30px;
      font-size: 14px;
      color: #fff;
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .stat-value {
      font-weight: 700;
      font-size: 20px;
      color: #00ff88;
    }
    .game-area {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .game-board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      width: 100%;
      max-width: 400px;
      height: 100%;
      max-height: 600px;
      background: #333;
      border: 3px solid #444;
      border-radius: 12px;
      overflow: hidden;
    }
    .column {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .tile {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.1s;
      position: relative;
    }
    .tile.white {
      background: #fff;
    }
    .tile.black {
      background: #000;
    }
    .tile.black:active {
      background: #333;
    }
    .tile.clicked {
      background: #00ff88 !important;
    }
    .tile.missed {
      background: #ff4444 !important;
    }
    .start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .start-btn {
      padding: 20px 60px;
      background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
      color: #000;
      border: none;
      border-radius: 50px;
      font-size: 24px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s;
      box-shadow: 0 10px 30px rgba(0,255,136,0.4);
    }
    .start-btn:hover {
      transform: scale(1.05);
    }
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    .modal.show {
      display: flex;
    }
    .modal-content {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      animation: bounceIn 0.5s;
      max-width: 350px;
      width: 90%;
    }
    @keyframes bounceIn {
      0% { transform: scale(0.5); opacity: 0; }
      60% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
    .modal-icon {
      font-size: 60px;
      margin-bottom: 15px;
    }
    .modal-title {
      font-size: 24px;
      font-weight: 700;
      color: #333;
      margin-bottom: 10px;
    }
    .modal-text {
      color: #666;
      margin-bottom: 25px;
      line-height: 1.8;
    }
    .btn {
      padding: 12px 30px;
      background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎹 别踩白块</h1>
    <p class="subtitle">快速点击黑色方块，不要踩到白色方块</p>
  </div>
  
  <div class="control-bar">
    <div class="stats">
      <div class="stat-item">
        <span>得分：</span>
        <span class="stat-value" id="score">0</span>
      </div>
      <div class="stat-item">
        <span>速度：</span>
        <span class="stat-value" id="speed">1x</span>
      </div>
    </div>
  </div>
  
  <div class="game-area">
    <div class="game-board" id="gameBoard">
      <div class="column" id="col0"></div>
      <div class="column" id="col1"></div>
      <div class="column" id="col2"></div>
      <div class="column" id="col3"></div>
    </div>
  </div>
  
  <div class="start-screen" id="startScreen">
    <h1 style="color:#00ff88; font-size:48px; margin-bottom:20px;">🎹</h1>
    <h2 style="color:#fff; font-size:32px; margin-bottom:10px;">别踩白块</h2>
    <p style="color:rgba(255,255,255,0.7); margin-bottom:40px;">点击黑色方块得分，不要踩到白色方块！</p>
    <button class="start-btn" onclick="startGame()">开始游戏</button>
  </div>
  
  <div class="modal" id="gameOverModal">
    <div class="modal-content">
      <div class="modal-icon">😢</div>
      <div class="modal-title">游戏结束</div>
      <div class="modal-text" id="gameOverText">
        得分：0
      </div>
      <button class="btn" onclick="closeModal()">再玩一次</button>
    </div>
  </div>

  <script>
    var columns = [[], [], [], []];
    var score = 0;
    var speed = 1;
    var gameLoop = null;
    var gameStarted = false;
    var tilesPerColumn = 4;
    
    function init() {
      createInitialTiles();
    }
    
    function createInitialTiles() {
      for (var col = 0; col < 4; col++) {
        columns[col] = [];
        for (var row = 0; row < tilesPerColumn; row++) {
          var isBlack = row === tilesPerColumn - 1;
          if (!isBlack && col === 0) isBlack = true;
          columns[col].push(isBlack);
        }
      }
      render();
    }
    
    function render() {
      for (var col = 0; col < 4; col++) {
        var colEl = document.getElementById('col' + col);
        colEl.innerHTML = '';
        
        for (var row = 0; row < tilesPerColumn; row++) {
          var tile = document.createElement('div');
          tile.className = 'tile ' + (columns[col][row] ? 'black' : 'white');
          tile.dataset.col = col;
          tile.dataset.row = row;
          tile.addEventListener('click', handleClick);
          colEl.appendChild(tile);
        }
      }
    }
    
    function startGame() {
      document.getElementById('startScreen').style.display = 'none';
      score = 0;
      speed = 1;
      gameStarted = true;
      updateStats();
      createInitialTiles();
      gameLoop = setInterval(update, 800 / speed);
    }
    
    function update() {
      for (var col = 0; col < 4; col++) {
        columns[col].pop();
        var isBlack = Math.random() < 0.5;
        columns[col].unshift(isBlack);
      }
      render();
    }
    
    function handleClick(e) {
      if (!gameStarted) return;
      
      var col = parseInt(e.target.dataset.col);
      var row = parseInt(e.target.dataset.row);
      
      if (columns[col][row]) {
        score++;
        if (score % 10 === 0) {
          speed += 0.1;
          clearInterval(gameLoop);
          gameLoop = setInterval(update, Math.max(200, 800 / speed));
        }
        updateStats();
        
        var tile = e.target;
        tile.classList.add('clicked');
        setTimeout(function() {
          tile.classList.remove('clicked');
        }, 100);
      } else {
        gameOver();
      }
    }
    
    function updateStats() {
      document.getElementById('score').textContent = score;
      document.getElementById('speed').textContent = speed.toFixed(1) + 'x';
    }
    
    function gameOver() {
      clearInterval(gameLoop);
      gameStarted = false;
      document.getElementById('gameOverText').textContent = '得分：' + score;
      document.getElementById('gameOverModal').classList.add('show');
    }
    
    function closeModal() {
      document.getElementById('gameOverModal').classList.remove('show');
      document.getElementById('startScreen').style.display = 'flex';
    }
    
    init();
  </script>
</body>
</html>
